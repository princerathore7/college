<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delete Canteen (Admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    padding:20px;
}
.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
button{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.delete{ background:#e53e3e;color:white; }
.fetch{ background:#3182ce;color:white; }
</style>
</head>
<body>

<h2>Admin Panel - Delete Canteen</h2>

<button class="fetch" onclick="loadCanteens()">Load All Canteens</button>

<div id="canteenContainer"></div>

<script>

const BASE_URL = "https://college-hwbb.onrender.com/api/canteen";

async function loadCanteens(){

    try{
        const res = await fetch(`${BASE_URL}/canteens`);

        if(!res.ok){
            alert("Failed to fetch canteens");
            return;
        }

        const data = await res.json();

        const container = document.getElementById("canteenContainer");
        container.innerHTML = "";

        if(data.length === 0){
            container.innerHTML = "<p>No canteens found</p>";
            return;
        }

        data.forEach(canteen => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <p><strong>Name:</strong> ${canteen.name}</p>
                <p><strong>Mobile:</strong> ${canteen.mobile}</p>
                <p><strong>ID:</strong> ${canteen._id}</p>
                <button class="delete" onclick="deleteCanteen('${canteen._id}')">
                    Delete Canteen
                </button>
            `;

            container.appendChild(card);
        });

    }catch(error){
        console.error(error);
        alert("Server error occurred");
    }
}

async function deleteCanteen(canteen_id){

    if(!confirm("Are you sure you want to delete this canteen?")) return;

    try{
        const res = await fetch(`${BASE_URL}/delete/${canteen_id}`,{
            method:"DELETE"
        });

        const result = await res.json();

        if(!res.ok){
            alert(result.error || "Delete failed");
            return;
        }

        alert("Canteen Deleted Successfully");

        loadCanteens();

    }catch(error){
        console.error(error);
        alert("Server error during delete");
    }
}

</script>

</body>
</html>
