<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{

width:400px;
background:white;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
padding:30px;
text-align:center;
}

.logo{
width:120px;
margin-bottom:10px;
}

h2{
margin:5px 0 20px 0;
color:#0a2c5a;
}

.info{
text-align:left;
margin-bottom:15px;
}

label{
font-size:14px;
font-weight:600;
color:#444;
}

input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
margin-top:5px;
font-size:14px;
}

.readonly{
background:#f2f2f2;
border:none;
}

button{

width:100%;
background:#0a2c5a;
color:white;
border:none;
padding:12px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;

}

button:hover{
background:#d32f2f;
}

.success{

color:green;
margin-top:10px;

}

</style>

</head>


<body>

<div class="card">

<img src="logo.jpg" class="logo">

<h2>Student Profile</h2>

<div class="info">
<label>Name</label>
<input type="text" id="name" class="readonly" readonly>
</div>

<div class="info">
<label>Enrollment</label>
<input type="text" id="enrollment" class="readonly" readonly>
</div>

<div class="info">
<label>Class</label>
<input type="text" id="class" class="readonly" readonly>
</div>

<div class="info">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="info">
<label>Phone</label>
<input type="text" id="phone">
</div>

<button onclick="updateProfile()">Update Profile</button>

<div class="success" id="msg"></div>

</div>

<script>

const API="https://college-hwbb.onrender.com/api";

const enrollment=localStorage.getItem("enrollment");

async function loadProfile(){

try{

const res=await fetch(`${API}/students/${enrollment}/class`);

const data=await res.json();

if(data.success){

document.getElementById("name").value=data.student.name;
document.getElementById("enrollment").value=data.student.enrollment;
document.getElementById("class").value=data.student.class || data.student.branch;
document.getElementById("email").value=data.student.email || "";
document.getElementById("phone").value=data.student.phone || "";

}

}catch(err){

console.log(err)

}

}

async function updateProfile(){

const email=document.getElementById("email").value;
const phone=document.getElementById("phone").value;

const res=await fetch(`${API}/students/${enrollment}/profile`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
phone

})

});

const data=await res.json();

document.getElementById("msg").innerText=data.message;

}

loadProfile();

</script>

</body>
</html>
