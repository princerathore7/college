<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lost & Found | Scool name</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #0b1f3a;
    --accent-color: #2ecc71;
    --error-color: #e74c3c;
    --text-main: #2c3e50;
    --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
}

body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    max-width: 480px;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
}

/* Background Emoji Decorations */
.emoji-bg {
    position: absolute;
    font-size: 40px;
    opacity: 0.1;
    z-index: 0;
}

.logo-container {
    text-align: center;
    margin-bottom: 20px;
}

.logo-container img {
    max-width: 180px;
    height: auto;
}

h2 {
    text-align: center;
    color: var(--primary-color);
    margin-top: 10px;
    font-weight: 600;
}

.student-status {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    display: block;
    margin-top: 15px;
    color: var(--primary-color);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: 2px solid #e1e8ef;
    font-size: 14px;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--primary-color);
    outline: none;
    box-shadow: 0 0 8px rgba(11, 31, 58, 0.1);
}

input[readonly] {
    background: #f8f9fa;
    color: #7f8c8d;
    cursor: not-allowed;
    border-style: dashed;
}

.file-upload-wrapper {
    position: relative;
    margin-top: 10px;
    border: 2px dashed #cbd5e0;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    background: #fafbfc;
}

.file-upload-wrapper:hover {
    background: #f1f5f9;
}

button {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 15px;
    width: 100%;
    margin-top: 25px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
    box-shadow: 0 4px 15px rgba(11, 31, 58, 0.2);
}

button:hover {
    background: #162e4d;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

.preview {
    margin-top: 15px;
    display: flex;
    justify-content: center;
}

.preview img {
    max-width: 100px;
    border-radius: 8px;
    border: 2px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.msg {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">
    <span class="emoji-bg" style="top: 10px; left: 10px;">😰</span>
    <span class="emoji-bg" style="bottom: 10px; right: 10px;">🌳</span>
    <span class="emoji-bg" style="bottom: 50px; left: 20px;">🎒</span>

    <div class="logo-container">
        <img src="logo.jpg" alt="Acropolis Logo">
    </div>

    <h2>File Missing Complaint</h2>
    <p class="student-status">Don't worry! Fill the details and we'll help you find it. 🔍</p>

    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Enrollment</label>
            <input type="text" id="enrollment" readonly>
        </div>
        <div style="flex: 1;">
            <label>Class</label>
            <input type="text" id="class" readonly>
        </div>
    </div>

    <label>Full Name</label>
    <input type="text" id="name" readonly>

    <label>What is missing? 🎒</label>
    <select id="category" required>
        <option value="">-- Select Category --</option>
        <option>Electronic Item (Phone/Laptop)</option>
        <option>Bag / Backpack</option>
        <option>Tiffin Box / Bottle</option>
        <option>Money / Wallet</option>
        <option>Books / Notebooks</option>
        <option>ID Card</option>
        <option>Other Personal Belongings</option>
    </select>

    <label>Describe the Item & Last Location 📍</label>
    <textarea id="description" rows="3" placeholder="Example: Blue Puma bag, left behind a tree near the canteen..."></textarea>

    <label>Upload Reference Photo 📸</label>
    <div class="file-upload-wrapper" onclick="document.getElementById('photo').click()">
        <span id="file-label">Click to upload photo</span>
        <input type="file" id="photo" accept="image/*" style="display:none">
        <div class="preview" id="preview"></div>
    </div>

    <button onclick="submitComplaint()">🚀 Submit Complaint</button>

    <div class="msg" id="msg"></div>
</div>

<script>
const enrollmentEl = document.getElementById("enrollment");
const nameEl       = document.getElementById("name");
const classEl      = document.getElementById("class");
const photoInput   = document.getElementById("photo");
const previewBox   = document.getElementById("preview");
const fileLabel    = document.getElementById("file-label");

function getQP(key) {
  return new URLSearchParams(window.location.search).get(key);
}

document.addEventListener("DOMContentLoaded", () => {
  const profile = JSON.parse(localStorage.getItem("studentProfile") || "{}");
  enrollmentEl.value = getQP("enrollment") || profile.enrollment || "0827IT241105"; // Default as backup
  nameEl.value = getQP("name") || profile.name || "Prince Rathore";
  classEl.value = getQP("class") || profile.class || "IT-2nd Year";
});

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;
  
  fileLabel.innerText = "Change Photo";
  const url = URL.createObjectURL(file);
  previewBox.innerHTML = `<img src="${url}">`;
});

function submitComplaint() {
  const cat = document.getElementById("category").value;
  const desc = document.getElementById("description").value;

  if (!cat || !desc.trim() || !photoInput.files[0]) {
    showMsg("⚠️ Hey! Please fill all fields properly.", "#e74c3c");
    return;
  }

  const formData = new FormData();
  formData.append("enrollment", enrollmentEl.value.trim());
  formData.append("name", nameEl.value.trim());
  formData.append("class", classEl.value.trim());
  formData.append("category", cat);
  formData.append("description", desc.trim());
  formData.append("photo", photoInput.files[0]);

  showMsg("⏳ Please wait, filing your report...", "#f39c12");

  fetch("https://college-hwbb.onrender.com/api/missing/submit", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      showMsg("✅ Successfully filed! Check updates soon.", "#2ecc71");
      resetForm();
    } else {
      showMsg("❌ " + (res.message || "Something went wrong."), "#e74c3c");
    }
  })
  .catch(err => {
    showMsg("❌ Server error. Please try later.", "#e74c3c");
  });
}

function resetForm() {
  document.getElementById("description").value = "";
  document.getElementById("category").value = "";
  photoInput.value = "";
  previewBox.innerHTML = "";
  fileLabel.innerText = "Click to upload photo";
}

function showMsg(text, color) {
  const msg = document.getElementById("msg");
  msg.style.color = color;
  msg.innerText = text;
}
</script>

</body>
</html>
