<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Missing Complaint</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}
.container{
    max-width:500px;
    background:#fff;
    margin:auto;
    padding:20px;
    border-radius:8px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}
h2{
    text-align:center;
    color:#0b1f3a;
}
label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}
input, select, textarea, button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}
input[readonly], input:disabled{
    background:#eee;
    cursor:not-allowed;
}
textarea{
    resize:none;
}
button{
    background:#2ecc71;
    color:white;
    border:none;
    margin-top:20px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#27ae60;
}
.msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
.preview{
    margin-top:10px;
    text-align:center;
}
.preview img{
    max-width:100%;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="container">
    <h2>📌 File Missing Complaint</h2>

    <label>Enrollment Number</label>
    <input type="text" id="enrollment" readonly>

    <label>Name</label>
    <input type="text" id="name" readonly>

    <label>Class</label>
    <input type="text" id="class" readonly>

    <label>Category</label>
    <select id="category" required>
        <option value="">-- Select Category --</option>
        <option>Electronic Item</option>
        <option>Bag</option>
        <option>Tiffin</option>
        <option>Money</option>
        <option>Books</option>
        <option>ID Card</option>
        <option>Other</option>
    </select>

    <label>Description</label>
    <textarea id="description" rows="4" placeholder="Describe missing item clearly..."></textarea>

    <label>Upload Photo</label>
    <input type="file" id="photo" accept="image/*">

    <div class="preview" id="preview"></div>

    <button onclick="submitComplaint()">Submit Complaint</button>

    <div class="msg" id="msg"></div>
</div>
<script>
/* ==============================
   GLOBAL ELEMENT REFERENCES
================================ */
const enrollmentEl = document.getElementById("enrollment");
const nameEl       = document.getElementById("name");
const classEl      = document.getElementById("class");
const photoInput   = document.getElementById("photo");
const previewBox   = document.getElementById("preview");

/* ==============================
   GET QUERY PARAM
================================ */
function getQP(key) {
  return new URLSearchParams(window.location.search).get(key);
}

/* ==============================
   AUTOFILL ON LOAD
================================ */
document.addEventListener("DOMContentLoaded", () => {

  const profile = JSON.parse(
    localStorage.getItem("studentProfile") || "{}"
  );

  enrollmentEl.value =
    getQP("enrollment") || profile.enrollment || "";

  nameEl.value =
    getQP("name") || profile.name || "";

  classEl.value =
    getQP("class") || profile.class || "";
});

/* ==============================
   IMAGE PREVIEW (NO BASE64)
================================ */
photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  previewBox.innerHTML = `<img src="${url}" style="max-width:120px">`;
});

/* ==============================
   SUBMIT COMPLAINT
================================ */
function submitComplaint() {

  if (
    !enrollmentEl.value.trim() ||
    !nameEl.value.trim() ||
    !classEl.value.trim() ||
    !photoInput.files[0] ||
    !category.value ||
    !description.value.trim()
  ) {
    showMsg("❌ Please fill all required fields", "red");
    return;
  }

  const formData = new FormData();
  formData.append("enrollment", enrollmentEl.value.trim());
  formData.append("name", nameEl.value.trim());
  formData.append("class", classEl.value.trim());
  formData.append("category", category.value);
  formData.append("description", description.value.trim());
  formData.append("photo", photoInput.files[0]); // 🔥 FILE ONLY

  showMsg("⏳ Submitting complaint...", "orange");

  fetch("https://college-hwbb.onrender.com/api/missing/submit", {
    method: "POST",
    body: formData   // ❌ no headers needed
  })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        showMsg("✅ Complaint submitted successfully", "green");
        resetForm();
      } else {
        showMsg("❌ " + (res.message || "Submission failed"), "red");
      }
    })
    .catch(err => {
      console.error(err);
      showMsg("❌ Server error. Try again later", "red");
    });
}

/* ==============================
   HELPERS
================================ */
function resetForm() {
  description.value = "";
  category.value = "";
  photoInput.value = "";
  previewBox.innerHTML = "";
}

function showMsg(text, color) {
  const msg = document.getElementById("msg");
  msg.style.color = color;
  msg.innerText = text;
}
</script>

</body>
</html>
