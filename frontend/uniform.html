<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Uniform Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f3f6ff;
    margin: 0;
    padding: 0;
    color: #222;
  }
  header {
    background: #0b5fff;
    color: white;
    text-align: center;
    padding: 20px 10px;
    font-size: 1.5rem;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .container {
    max-width: 1100px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    padding: 0 20px;
  }
  .btn {
    background: #0b5fff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .btn:hover {
    background: #0047b3;
  }
  #buyUniformBtn {
    display: block;
    margin: 25px auto;
    font-size: 1rem;
  }

  /* Modal Styles */
  #uniformForm {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    width: 90%;
    max-width: 420px;
    z-index: 1000;
  }
  #uniformForm input, 
  #uniformForm select {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  #uniformForm label {
    display: block;
    margin-top: 10px;
  }
  #closeForm {
    background: #ff4747;
    margin-left: 10px;
  }
  #measurements {
    transition: 0.3s ease;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
  }
</style>
</head>
<body>
  <header>🧢 School Uniform Store</header>
  <button id="buyUniformBtn" class="btn">🛒 Buy Uniform</button>

  <div class="overlay" id="overlay"></div>

  <div id="uniformForm">
    <h2 style="text-align:center; margin-bottom:10px;">Uniform Request</h2>
    <input type="text" id="studentName" placeholder="Student Name" required />
    <input type="text" id="enrollment" placeholder="Enrollment No" required />
    <input type="text" id="class" placeholder="Class" required />
    <select id="item" required>
      <option value="">Select Uniform Item</option>
      <option>School Shirt</option>
      <option>School Pant</option>
      <option>School Tie</option>
      <option>School Belt</option>
      <option>School Shoes</option>
      <option>School Socks</option>
    </select>
    <input type="number" id="quantity" placeholder="Quantity" min="1" required />

    <div id="measurements">
      <input type="text" id="length" placeholder="Length (cm)" />
      <input type="text" id="width" placeholder="Width (cm)" />
    </div>

    <label>
      <input type="checkbox" id="noMeasure" />
      I don’t know my measurements (Physical measurement ₹100)
    </label>

    <div style="text-align:center; margin-top:15px;">
      <button class="btn" onclick="submitUniformRequest()">Submit</button>
      <button class="btn" id="closeForm">Cancel</button>
    </div>
  </div>

<script>
  const form = document.getElementById('uniformForm');
  const overlay = document.getElementById('overlay');

  document.getElementById('buyUniformBtn').addEventListener('click', () => {
    form.style.display = 'block';
    overlay.style.display = 'block';
  });

  document.getElementById('closeForm').addEventListener('click', () => {
    form.style.display = 'none';
    overlay.style.display = 'none';
  });

  overlay.addEventListener('click', () => {
    form.style.display = 'none';
    overlay.style.display = 'none';
  });

  document.getElementById('noMeasure').addEventListener('change', (e) => {
    document.getElementById('measurements').style.display = e.target.checked ? 'none' : 'block';
  });

  async function submitUniformRequest() {
    const data = {
      student_name: document.getElementById('studentName').value,
      enrollment: document.getElementById('enrollment').value,
      class: document.getElementById('class').value,
      item: document.getElementById('item').value,
      quantity: document.getElementById('quantity').value,
      measurements: document.getElementById('noMeasure').checked
        ? "Physical measurement required"
        : {
            length: document.getElementById('length').value,
            width: document.getElementById('width').value
          }
    };

    if (!data.student_name || !data.enrollment || !data.class || !data.item || !data.quantity) {
      alert("⚠️ Please fill all required fields");
      return;
    }

    try {
      const res = await fetch('/api/uniform/request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.msg || "Request submitted successfully!");
    } catch (err) {
      console.error(err);
      alert("Error submitting request.");
    }

    // Close form after submission
    form.style.display = 'none';
    overlay.style.display = 'none';
  }
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acropolis Campus - Login</title>
<link rel="icon" href="https://cdn.corenexis.com/view/6199335168">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --primary-color: #31c2cf; /* Photo wala cyan color */
  --text-gray: #777;
  --input-bg: #e8f0fe;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* --- Layout Container --- */
.main-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
}

/* --- Left Side: Image Slider --- */
.image-section {
  flex: 1.2;
  position: relative;
  background-color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-section img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  transition: opacity 1s ease-in-out;
  opacity: 0;
}

.image-section img.active {
  opacity: 1;
}

/* Logo overlay on image (optional, as per screenshot) */
.logo-overlay {
  position: absolute;
  top: 30px;
  left: 30px;
  z-index: 10;
  display: flex;
  align-items: center;
  color: white;
  font-weight: bold;
  font-size: 24px;
}

/* --- Right Side: Login Form --- */
.login-section {
  flex: 1;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 8%;
  position: relative;
}

.login-header {
  margin-bottom: 40px;
}

.login-header h1 {
  font-size: 2.2rem;
  font-weight: 300;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.login-header p {
  color: var(--text-gray);
  font-size: 0.9rem;
  margin-top: 10px;
}

/* Role Selector Styles */
.role-container {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.role-container label {
  font-size: 0.9rem;
  color: var(--text-gray);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Form Styling */
.form-group {
  margin-bottom: 20px;
  width: 100%;
}

input[type="text"], 
input[type="password"] {
  width: 100%;
  padding: 15px;
  border: none;
  background-color: var(--input-bg);
  border-bottom: 2px solid transparent;
  font-size: 1rem;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-bottom-color: var(--primary-color);
}

.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-gray);
}

.forgot-pw {
  color: #bbb;
  text-decoration: none;
  font-size: 0.85rem;
}

/* Login Button */
.btn-login {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 12px 35px;
  font-size: 1rem;
  cursor: pointer;
  float: right;
  margin-top: 20px;
  transition: 0.3s;
}

.btn-login:hover {
  background-color: #28a9b6;
}

.btn-login:disabled {
  background-color: #ccc;
}

/* Bottom Copyright */
.footer-text {
  position: absolute;
  bottom: 20px;
  right: 40px;
  font-size: 0.75rem;
  color: #999;
}

.social-icons {
    margin-top: 30px;
    display: flex;
    gap: 15px;
    color: #999;
}

/* Responsive */
@media (max-width: 900px) {
  .image-section { display: none; }
  .login-section { padding: 0 40px; }
}
</style>
</head>
<body>

<div class="main-wrapper">
  <div class="image-section" id="slider">
    <div class="logo-overlay">
        <span style="font-size: 1.5rem; letter-spacing: 2px;">ACROPOLIS </span>
    </div>
    <img src="model1.png" class="active" alt="Campus 1">
    <img src="model2.png" alt="Campus 2">
    <img src="model3.png" alt="Campus 3">
  </div>

  <div class="login-section">
    <div class="login-header">
      <h1>Welcome to Acropolis Day to Day portal</h1>
      <p>Login (Student/Staff)</p>
    </div>

    <form id="loginForm">
      <div class="role-container">
        <label><input type="radio" name="role" value="student" checked> Student</label>
        <label><input type="radio" name="role" value="mentor"> Mentor</label>
         <label><input type="radio" name="role" value="bus"> Bus Driver</label>
      </div>

      <div class="form-group">
        <input type="text" id="username" placeholder="Enrollment Number / Mentor ID" required>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <div class="form-footer">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-pw">Forgot Password?</a>
        <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
      </div>
    </form>

    <div class="social-icons">
        <span>Twitter</span>
        <span>Facebook</span>
    </div>

    <div class="footer-text">
      2025-26 © Prince Rathore IT3
    </div>
  </div>
</div>
<script>
/* =====================================================
   IMAGE SLIDER LOGIC
===================================================== */
const images = document.querySelectorAll('#slider img');
let currentIndex = 0;

function nextImage() {
  images[currentIndex].classList.remove('active');
  currentIndex = (currentIndex + 1) % images.length;
  images[currentIndex].classList.add('active');
}
setInterval(nextImage, 5000);


/* =====================================================
   DYNAMIC PLACEHOLDER BASED ON ROLE
===================================================== */
const roleRadios = document.querySelectorAll('input[name="role"]');
const usernameInput = document.getElementById("username");

roleRadios.forEach(radio => {
  radio.addEventListener("change", () => {
    if (radio.value === "student") {
      usernameInput.placeholder = "Enrollment Number";
    } 
    else if (radio.value === "mentor") {
      usernameInput.placeholder = "Mentor ID";
    } 
    else if (radio.value === "bus") {
      usernameInput.placeholder = "Bus Pilot ID (e.g. BUS-101)";
    }
  });
});


/* =====================================================
   LOGIN HANDLER
===================================================== */
const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  btn.disabled = true;
  btn.innerText = "Processing...";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const role = document.querySelector('input[name="role"]:checked').value;

  let url = "";
  let bodyData = {};

  /* ---------- API SELECTION (NO CHANGE IN STUDENT / MENTOR) ---------- */
  if (role === "mentor") {
    url = "https://college-hwbb.onrender.com/api/login/mentor";
    bodyData = { mentorId: username, password };

  } 
  else if (role === "bus") {
    url = "https://college-hwbb.onrender.com/api/bus/login";
    bodyData = { busId: username, password };

  } 
  else {
    url = "https://college-hwbb.onrender.com/api/students/login";
    bodyData = { enrollment: username, password };
  }

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bodyData)
    });

    const data = await res.json();

    /* ---------- SUCCESS HANDLING ---------- */
    if (res.ok) {

      /* STUDENT */
      if (role === "student" && data.success) {
        localStorage.setItem("enrollment", data.enrollment);
        localStorage.setItem("role", "student");
        window.location.href = "ewhfihewlbewcbewstudent-dashboard45689";
        return;
      }

      /* MENTOR */
      if (role === "mentor" && data.success) {
        localStorage.setItem("mentorId", data.mentor.mentorId);
        localStorage.setItem("mentorName", data.mentor.name || "Mentor");
        localStorage.setItem("role", "mentor");
        window.location.href = "uihfewibfasdvkfdbvkbkvbwifowjnfhbfebfuhiufbwfbuid";
        return;
      }

      /* 🚌 BUS DRIVER */
      if (role === "bus") {
        localStorage.setItem("busId", username);
        localStorage.setItem("role", "bus");
        window.location.href = `bus-driver.html?busId=${username}`;
        return;
      }

    } else {
      alert(data.message || data.error || "Invalid credentials");
    }

  } catch (err) {
    alert("Server connection error");
  } finally {
    btn.disabled = false;
    btn.innerText = "Sign In";
  }
});
</script>


</body>
</html>
