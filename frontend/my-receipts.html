<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Receipts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

.receipt{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.empty{
    color:gray;
}
</style>
</head>
<body>

<div class="container">

<h2><i class="fa-solid fa-receipt"></i> My Receipts</h2>

<div id="receiptList"></div>

</div>

<script>

// ⚠️ Get enrollment from login session or localStorage
const enrollment = localStorage.getItem("studentEnrollment");

async function loadReceipts(){

    const container = document.getElementById("receiptList");

    if(!enrollment){
        container.innerHTML = "<p class='empty'>Student not logged in</p>";
        return;
    }

    container.innerHTML = "Loading receipts...";

    try{

        const res = await fetch(`/api/receipts/finestudent/${enrollment}`);
        const data = await res.json();

        if(!data.success || data.receipts.length === 0){
            container.innerHTML = "<p class='empty'>No receipts found</p>";
            return;
        }

        container.innerHTML = "";

        data.receipts.forEach(receipt => {

            const receiptId = receipt.receipt_id || receipt._id;

            container.innerHTML += `
            <div class="receipt">

                <b>Receipt ID:</b> ${receiptId} <br>

                <b>Payment ID:</b> ${receipt.payment_id || "-"} <br>

                <b>Order ID:</b> ${receipt.order_id || "-"} <br>

                <b>Enrollment:</b> ${receipt.enrollment} <br>

                <b>Class:</b> ${receipt.class || "-"} <br>

                <b>Amount Paid:</b> ₹${receipt.amount_paid} <br>

                <b>Reason:</b> ${receipt.reason} <br>

                <b>Status:</b> ${receipt.status} <br>

                <b>Date:</b> ${
                    receipt.createdAt
                    ? new Date(receipt.createdAt).toLocaleString("en-IN")
                    : "-"
                } <br><br>

                <button onclick="viewReceipt('${receiptId}')">
                    View Receipt
                </button>

            </div>
            `;
        });

    }
    catch(error){
        container.innerHTML = "<p class='empty'>Server error</p>";
    }
}


function viewReceipt(id){
    window.location.href = `receipt-view.html?id=${id}`;
}

loadReceipts();

</script>

</body>
</html>
