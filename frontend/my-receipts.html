<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Receipts</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family: Arial;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
margin-bottom:20px;
}

.receipt{
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

button{
background:#007bff;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.empty{
color:gray;
}
/* PROFESSIONAL BACK BUTTON */

.professional-back {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 9px 16px;

    background: #ffffff;
    color: #344054;

    border: 1px solid #e4e7ec;
    border-radius: 8px;

    font-size: 14px;
    font-weight: 600;
    font-family: Inter, Arial, sans-serif;

    text-decoration: none;

    cursor: pointer;

    transition: all 0.2s ease;
}

.professional-back:hover {
    background: #f9fafb;
    border-color: #cbd5e1;
    color: #101828;

    transform: translateX(-2px);
    box-shadow: 0 2px 5px rgba(16,24,40,0.06);
}

.professional-back:active {
    transform: scale(0.97);
}

.back-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-arrow svg {
    width: 17px;
    height: 17px;
}

.professional-back:focus-visible {
    outline: 3px solid rgba(59,130,246,0.25);
    outline-offset: 2px;
}

</style>
</head>
<body>
    <a href="javascript:history.back()" class="professional-back">
    <span class="back-arrow">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M12 19L5 12L12 5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
    </span>
    <span>Back</span>
</a>

<div class="container">

<h2><i class="fa-solid fa-receipt"></i> My Receipts</h2>

<div id="receiptList"></div>

</div>

<script>

const API_BASE = "https://college-hwbb.onrender.com/api/receipts";


// --------------------------------------------------
// LOAD RECEIPTS FROM SERVER
// --------------------------------------------------
async function loadReceipts(){

    const profile = JSON.parse(localStorage.getItem("studentProfile"));

    if(!profile || !profile.enrollment){

        document.getElementById("receiptList").innerHTML =
            "<p class='empty'>Enrollment not found. Please login again.</p>";

        return;
    }

    const enrollment = profile.enrollment;

    try{

        const res = await fetch(`${API_BASE}/finestudent/${enrollment}`);

        const data = await res.json();

        if(!data.success){

            document.getElementById("receiptList").innerHTML =
                "<p class='empty'>Failed to load receipts</p>";

            return;
        }

        const receipts = data.receipts;

        localStorage.setItem("studentReceipts", JSON.stringify(receipts));

        renderReceipts(receipts);

    }
    catch(err){

        console.error(err);

        document.getElementById("receiptList").innerHTML =
            "<p class='empty'>Server error loading receipts</p>";

    }

}


// --------------------------------------------------
// RENDER RECEIPTS
// --------------------------------------------------
function renderReceipts(receipts){

    const container = document.getElementById("receiptList");

    if(receipts.length === 0){

        container.innerHTML =
            "<p class='empty'>No receipts found</p>";

        return;
    }

    container.innerHTML = "";

    receipts.forEach(receipt => {

        const receiptId = receipt.receipt_id || receipt._id;

        const dateText = receipt.createdAt
            ? new Date(receipt.createdAt).toLocaleString("en-IN")
            : "-";

        container.innerHTML += `

        <div class="receipt">

            <b>Receipt ID:</b> ${receiptId} <br>

            <b>Payment ID:</b> ${receipt.payment_id || "-"} <br>

            <b>Enrollment:</b> ${receipt.enrollment} <br>

            <b>Class:</b> ${receipt.class || "-"} <br>

            <b>Amount:</b> ₹${receipt.amount_paid} <br>

            <b>Reason:</b> ${receipt.reason} <br>

            <b>Status:</b> ${receipt.status} <br>

            <b>Date:</b> ${dateText} <br><br>

            <button onclick="viewReceipt('${receiptId}')">
                View Receipt
            </button>

        </div>

        `;

    });

}


// --------------------------------------------------
// VIEW RECEIPT
// --------------------------------------------------
function viewReceipt(receiptId){

    const receipts = JSON.parse(
        localStorage.getItem("studentReceipts")
    ) || [];

    const receipt = receipts.find(r =>
        (r.receipt_id === receiptId) ||
        (r._id === receiptId)
    );

    if(!receipt){

        alert("Receipt not found");

        return;
    }

    localStorage.setItem(
        "selectedReceipt",
        JSON.stringify(receipt)
    );

    window.location.href = "receipt-view.html";

}


// --------------------------------------------------
loadReceipts();
// --------------------------------------------------
/* PROFESSIONAL BACK NAVIGATION */

document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll(".professional-back").forEach(button => {

        button.addEventListener("click", function (e) {

            // Default browser back navigation
            if (window.history.length > 1) {
                e.preventDefault();
                window.history.back();
            }

        });

    });

});
</script>

</body>
</html>
