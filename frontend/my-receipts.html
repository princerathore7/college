<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Receipts</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family: Arial;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
margin-bottom:20px;
}

.receipt{
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

button{
background:#007bff;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.empty{
color:gray;
}

</style>
</head>
<body>

<div class="container">

<h2><i class="fa-solid fa-receipt"></i> My Receipts</h2>

<div id="receiptList"></div>

</div>

<script>

function loadReceipts(){

    const receipts = JSON.parse(localStorage.getItem("studentReceipts")) || [];

    const container = document.getElementById("receiptList");

    if(receipts.length === 0){
        container.innerHTML = "<p class='empty'>No receipts found</p>";
        return;
    }

    container.innerHTML = "";

    receipts.reverse().forEach(receipt => {

        container.innerHTML += `
        <div class="receipt">
            <b>Receipt ID:</b> ${receipt.id} <br>
            <b>Enrollment:</b> ${receipt.enrollment} <br>
            <b>Amount:</b> ₹${receipt.amount} <br>
            <b>Reason:</b> ${receipt.reason} <br>
            <b>Date:</b> ${receipt.date} <br><br>

            <button onclick='viewReceipt("${receipt.id}")'>
                View Receipt
            </button>
        </div>
        `;

    });

}

function viewReceipt(id){

    const receipts = JSON.parse(localStorage.getItem("studentReceipts")) || [];

    const receipt = receipts.find(r => r.id === id);

    if(!receipt){
        alert("Receipt not found");
        return;
    }

    alert(
        "Receipt ID: " + receipt.id + "\n" +
        "Enrollment: " + receipt.enrollment + "\n" +
        "Amount: ₹" + receipt.amount + "\n" +
        "Reason: " + receipt.reason + "\n" +
        "Date: " + receipt.date
    );

}

loadReceipts();

</script>

</body>
</html>
