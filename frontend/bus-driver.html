<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridofy Driver Tracking</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body { height:100%; margin:0; }
#map { position:absolute; inset:0; z-index:0; }

.control-panel {
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  background:rgba(255,255,255,0.95);
  padding:10px 16px;
  border-radius:16px;
  box-shadow:0 10px 20px rgba(0,0,0,0.25);
  display:flex;
  gap:12px;
  align-items:center;
}

.switch {
  position:relative;
  width:50px;
  height:26px;
}

.switch input { display:none; }

.slider {
  position:absolute;
  cursor:pointer;
  inset:0;
  background:#dc2626;
  border-radius:34px;
  transition:0.3s;
}

.slider:before {
  content:"";
  position:absolute;
  height:20px;
  width:20px;
  left:3px;
  bottom:3px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}

input:checked + .slider {
  background:#16a34a;
}

input:checked + .slider:before {
  transform:translateX(24px);
}

.status {
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  color:white;
  padding:8px 16px;
  border-radius:20px;
  font-size:14px;
  z-index:9999;
  display:none;
}
</style>
</head>

<body>

<div class="control-panel">
  <span class="font-bold text-slate-800" id="busText">Bus: --</span>

  <label class="switch">
    <input type="checkbox" id="trackSwitch">
    <span class="slider"></span>
  </label>

  <button onclick="manualRefresh()" class="bg-blue-600 text-white px-3 py-1 rounded-lg">
    Refresh
  </button>
</div>

<div id="map"></div>
<div class="status" id="status"></div>

<script>
const BASE_URL="https://college-hwbb.onrender.com";
const params=new URLSearchParams(window.location.search);
const busId=params.get("busId")||"unknown";
document.getElementById("busText").textContent="Bus: "+busId;

const map=L.map("map").setView([23.2599,77.4126],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const marker=L.marker([0,0]).addTo(map);

let watchId=null;
let lastCoords=null;
let resendInterval=null;

/* ---------- STATUS ---------- */
function showStatus(msg,color="black"){
 const s=document.getElementById("status");
 s.textContent=msg;
 s.style.background=color;
 s.style.display="block";
 setTimeout(()=>s.style.display="none",2500);
}

/* ---------- SEND LOCATION ---------- */
async function sendLocation(lat,lng){
 try{
   await fetch(`${BASE_URL}/api/bus/update-location`,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({busId,lat,lng})
   });
 }catch(e){
   showStatus("⚠ Network error — retrying","#7c2d12");
 }
}

/* ---------- GPS SUCCESS ---------- */
function handlePosition(pos){
 const {latitude,longitude,accuracy}=pos.coords;

 lastCoords=[latitude,longitude];
 marker.setLatLng(lastCoords);
 map.panTo(lastCoords);

 sendLocation(latitude,longitude);

 showStatus(`📍 Accuracy: ${Math.round(accuracy)}m`,"#065f46");
}

/* ---------- GPS ERROR ---------- */
function handleError(err){
 let msg="GPS error";

 if(err.code===1) msg="Permission denied";
 if(err.code===2) msg="Location unavailable";
 if(err.code===3) msg="GPS timeout";

 showStatus("⚠ "+msg,"#7c2d12");
}

/* ---------- START TRACKING ---------- */
function startTracking(){
 if(!navigator.geolocation){
   showStatus("GPS not supported","#7c2d12");
   return;
 }

 watchId=navigator.geolocation.watchPosition(
   handlePosition,
   handleError,
   {
     enableHighAccuracy:true,
     maximumAge:0,
     timeout:10000
   }
 );

 resendInterval=setInterval(()=>{
   if(lastCoords){
     sendLocation(lastCoords[0],lastCoords[1]);
   }
 },5000);

 showStatus("Tracking ON","#065f46");
}

/* ---------- STOP TRACKING ---------- */
function stopTracking(){
 navigator.geolocation.clearWatch(watchId);
 clearInterval(resendInterval);
 watchId=null;

 fetch(`${BASE_URL}/api/bus/stop-location/${busId}`,{method:"POST"});

 showStatus("Tracking OFF","#7c2d12");
}

/* ---------- SWITCH ---------- */
document.getElementById("trackSwitch").addEventListener("change",e=>{
 if(e.target.checked) startTracking();
 else stopTracking();
});

/* ---------- MANUAL REFRESH ---------- */
function manualRefresh(){
 if(!navigator.geolocation){
   showStatus("GPS unavailable","#7c2d12");
   return;
 }

 navigator.geolocation.getCurrentPosition(
   pos=>{
     handlePosition(pos);
     showStatus("Manual refresh complete","#1d4ed8");
   },
   handleError,
   {enableHighAccuracy:true,timeout:10000}
 );
}

/* ---------- AUTO ERROR GUARD ---------- */
window.addEventListener("offline",()=>{
 showStatus("⚠ No internet","#7c2d12");
});

window.addEventListener("online",()=>{
 showStatus("Internet restored","#065f46");
});
</script>

</body>
</html>
