<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Driver Tracking – Ridofy Map</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Turf.js for geo calculations -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
html, body { height: 100%; margin: 0; padding: 0; }
#map { position: absolute; inset: 0; z-index: 0; }

header { z-index: 9999; }
.leaflet-control { border-radius: 0.5rem; }

.status {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 1000;
  display: none;
}
.gmap-bus-pin {
  width: 38px;
  height: 38px;
  background: #1e293b; /* dark navy */
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  position: relative;
  box-shadow: 0 6px 14px rgba(0,0,0,0.45);
  border: 2px solid #fff;
}

.bus-emoji {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(45deg);
  font-size: 18px;
}

.toggle-btn {
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}
.toggle-btn.on { background: #16a34a; color: #fff; }
.toggle-btn.off { background: #dc2626; color: #fff; }
</style>
</head>
<body class="bg-slate-900">

<header class="absolute left-0 right-0 top-0 z-50 m-3 flex justify-between items-center gap-3 max-w-4xl w-full">
  <div class="flex items-center gap-2 rounded-2xl bg-white/90 px-3 py-2 shadow">
    <span class="text-lg font-semibold text-slate-900">🚌 Bus Tracker</span>
  </div>
  <div>
    <span id="busIdText" class="font-bold text-white mr-3">Bus ID: --</span>
    <button id="toggleBtn" class="toggle-btn off" onclick="toggleTracking()">Location OFF</button>
  </div>
</header>

<div id="map"></div>
<div class="status" id="statusText">Tracking Started</div>

<script>
const BASE_URL = "https://college-hwbb.onrender.com";
const params = new URLSearchParams(window.location.search);
const busId = params.get("busId") || "unknown";

document.getElementById("busIdText").textContent = "Bus ID: " + busId;

// Init Leaflet map (Ridofy style)
const map = L.map('map').setView([23.2599, 77.4126], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Google-map style bus icon
const busIcon = L.divIcon({
  html: `
    <div class="gmap-bus-pin">
      <div class="bus-emoji">🚌</div>
    </div>
  `,
  iconSize: [38, 38],
  iconAnchor: [19, 38],
  className: ""
});

let marker = L.marker([0, 0], { icon: busIcon }).addTo(map);

let watchId = null;
let trackingOn = false;


// Status popup
function showStatus(text) {
  const status = document.getElementById("statusText");
  status.textContent = text;
  status.style.display = "block";
  setTimeout(() => status.style.display = "none", 2000);
}

// Toggle tracking button
function toggleTracking() {
  if (!trackingOn) startTracking();
  else stopTracking();
}

// Start high accuracy GPS tracking
function startTracking() {
  if (!navigator.geolocation) { alert("Geolocation not supported"); return; }

  watchId = navigator.geolocation.watchPosition(
    async pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      // Update map instantly
      marker.setLatLng([lat, lng]);
      map.setView([lat, lng], 16);

      // Send location to server
      try {
        await fetch(`${BASE_URL}/api/bus/update-location`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ busId, lat, lng })
        });
      } catch(err) {
        console.error("Failed to send location", err);
      }
    },
    err => alert("Location permission required: " + err.message),
    {
      enableHighAccuracy: true, // HIGH ACCURACY
      maximumAge: 0,
      timeout: 10000
    }
  );

  trackingOn = true;
  document.getElementById("toggleBtn").className = "toggle-btn on";
  document.getElementById("toggleBtn").textContent = "Location ON";
  showStatus("📍 Location Tracking ON");
}

// Stop tracking
function stopTracking() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;

  fetch(`${BASE_URL}/api/bus/stop-location/${busId}`, { method: "POST" });

  trackingOn = false;
  document.getElementById("toggleBtn").className = "toggle-btn off";
  document.getElementById("toggleBtn").textContent = "Location OFF";
  showStatus("⛔ Location Tracking OFF");
}
</script>

</body>
</html>
