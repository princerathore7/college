/* ===========================
   🔍 SEARCH LOGIC
   =========================== */

function searchStop() {
  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("results");
  box.innerHTML = "";

  if (!q) return;

  const matches = BUS_DATA.filter(item =>
    item.stop.toLowerCase().includes(q)
  );

  if (matches.length === 0) {
    box.innerHTML = "<div class='card'>❌ No bus found for this stop</div>";
    return;
  }

  matches.forEach(item => {
    box.innerHTML += `
      <div class="card">
        <div class="bus">📍 ${item.stop}</div>
        <div class="route">🚌 Buses: ${item.buses.join(", ")}</div>
        <div class="time">
          ⏰ 1st Shift: ${item.time1}<br/>
          ⏰ 2nd Shift: ${item.time2}
        </div>
      </div>
    `;
  });
}
function renderResults(data) {
  const box = document.getElementById("results");
  box.innerHTML = "";

  data.forEach(item => {
    box.innerHTML += `
      <div class="card">
        <div class="bus">📍 ${item.stop}</div>
        <div class="route">🚌 Buses: ${item.buses.join(", ")}</div>
        <div class="time">
          ⏰ 1st Shift: ${item.time1}<br/>
          ⏰ 2nd Shift: ${item.time2}
        </div>
      </div>
    `;
  });
}
window.onload = () => {
  renderResults(BUS_DATA);
};
