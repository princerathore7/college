<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Where Is My Bus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  padding: 20px;
}
.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}
h2 {
  text-align: center;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}
.result {
  margin-top: 20px;
  padding: 15px;
  background: #eef3ff;
  border-radius: 8px;
}
.bus {
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>🚌 Where Is My Bus</h2>

  <input
    type="text"
    id="locationInput"
    placeholder="Enter your pickup location (eg: Maksi)"
  />

  <button onclick="findBus()">Find Bus</button>

  <div class="result" id="result"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* 🔴 CHANGE THIS */
const PDF_DIRECT_URL =
  "https://YOUR-BACKEND-DOMAIN/api/bus/direct";

let locationBusMap = {}; // { stop: Set(G64, G58) }

async function loadPDF() {
  try {
    const res = await fetch(PDF_DIRECT_URL);
    const json = await res.json();
    const pdfUrl = json.url;

    const pdf = await pdfjsLib.getDocument(pdfUrl).promise;

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const text = content.items.map(i => i.str).join("\n");
      parsePage(text);
    }

  } catch (err) {
    document.getElementById("result").innerHTML =
      "❌ Failed to load bus routes";
    console.error(err);
  }
}

function parsePage(text) {
  // 1️⃣ Bus numbers on page
  const busMatches = [...text.matchAll(/Bus No.-\s*(G\d+)/g)];
  const buses = busMatches.map(b => b[1]);

  if (buses.length === 0) return;

  // 2️⃣ Possible stop names
  const stopMatches = text.match(
    /\n\d+\s+([A-Za-z\s\(\)]+?)\s+\d{1,2}:\d{2}/g
  );

  if (!stopMatches) return;

  stopMatches.forEach(line => {
    const stop = line
      .replace(/\n\d+\s+/, "")
      .replace(/\d{1,2}:\d{2}.*/, "")
      .trim();

    if (!locationBusMap[stop]) {
      locationBusMap[stop] = new Set();
    }

    buses.forEach(b => locationBusMap[stop].add(b));
  });
}

function findBus() {
  const input = document.getElementById("locationInput").value.trim().toLowerCase();
  const result = document.getElementById("result");

  if (!input) {
    result.innerHTML = "❌ Please enter a location";
    return;
  }

 const match = Object.keys(locationBusMap).find(
  stop =>
    stop.toLowerCase().includes(input) ||
    input.includes(stop.toLowerCase())
);

  if (!match) {
    result.innerHTML = "❌ No bus found for this location";
    return;
  }

  const buses = [...locationBusMap[match]];

  result.innerHTML = `
    <div><b>📍 Location:</b> ${match}</div>
    <div class="bus">🚌 Buses: ${buses.join(", ")}</div>
    <div><b>🎯 Destination:</b> Acropolis Institutes</div>
  `;
}

loadPDF();
</script>

</body>
</html>
