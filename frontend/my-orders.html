<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    padding:20px;
}

.order-card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.status{
    font-weight:bold;
    margin-top:5px;
}

.pending{ color:orange; }
.accepted{ color:blue; }
.preparing{ color:#6b46c1; }
.ready{ color:green; }
.rejected{ color:red; }

.time{
    margin-top:5px;
    font-size:14px;
}
</style>
</head>
<body>

<h2>📦 My Orders</h2>

<div id="ordersContainer"></div>

<script>

const BASE_URL="https://college-hwbb.onrender.com/api/canteen";
const user_id = localStorage.getItem("user_id") || "demo_user";

async function loadOrders(){

    const res = await fetch(`${BASE_URL}/my-orders/${user_id}`);
    const orders = await res.json();

    const container=document.getElementById("ordersContainer");
    container.innerHTML="";

    if(orders.length===0){
        container.innerHTML="<p>No orders found.</p>";
        return;
    }

    orders.reverse().forEach(order=>{

        let statusClass="pending";

        if(order.order_status==="Accepted") statusClass="accepted";
        if(order.order_status==="Preparing") statusClass="preparing";
        if(order.order_status==="Ready") statusClass="ready";
        if(order.order_status==="Rejected") statusClass="rejected";

        const div=document.createElement("div");
        div.className="order-card";

        div.innerHTML=`
            <strong>Token: ${order.token_number}</strong>
            <div>Total: ₹${order.total_price}</div>
            <div class="status ${statusClass}">
                Status: ${order.order_status}
            </div>
            ${
                order.estimated_time && order.order_status!=="Ready" && order.order_status!=="Rejected"
                ? `<div class="time">⏳ Estimated Time: ${order.estimated_time} mins</div>`
                : ""
            }
        `;

        container.appendChild(div);
    });
}

loadOrders();

// Auto refresh every 5 seconds
setInterval(loadOrders,5000);

</script>

</body>
</html>
