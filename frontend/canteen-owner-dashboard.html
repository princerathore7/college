<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canteen Owner Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2d3748;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.section{
    margin-top:30px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
    padding:6px 12px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    margin-right:5px;
    margin-top:5px;
}

.accept{ background:#38a169; color:white; }
.prepare{ background:#dd6b20; color:white; }
.ready{ background:#3182ce; color:white; }
.reject{ background:#e53e3e; color:white; }
.delete{ background:#e53e3e; color:white; }
.addBtn{ background:#805ad5; color:white; }

.sales-box{
    background:#edf2f7;
    padding:10px;
    border-radius:6px;
}

input{
    width:100%;
    padding:8px;
    margin-top:8px;
}
</style>
</head>
<body>

<div class="header">
    <h2 id="canteenName"></h2>
    <p>ID: <span id="canteenId"></span></p>
    <p>Mobile: <span id="canteenMobile"></span></p>
</div>

<div class="container">

    <div class="sales-box">
        <strong>Today's Orders:</strong> <span id="totalOrders">0</span> |
        <strong>Total Sales:</strong> ₹<span id="totalSales">0</span>
    </div>

    <div class="section">
        <h3>Orders</h3>
        <div id="ordersContainer"></div>
    </div>

    <div class="section">
        <h3>Menu Management</h3>
        <button class="addBtn" onclick="openModal()">+ Add Item</button>
        <div id="menuContainer"></div>
    </div>

</div>

<button onclick="goToPostPage()" style="background:#2b6cb0;color:white;padding:8px 14px;border:none;border-radius:6px;margin-top:10px;">
    ➕ Post Menu Items
</button>

<script>

const BASE_URL = "https://college-hwbb.onrender.com/api/canteen";
const canteen_id = localStorage.getItem("canteen_id");
const canteen_name = localStorage.getItem("canteen_name");

if(!canteen_id){
    alert("Login Required!");
    window.location.href="canteen-login.html";
}

document.getElementById("canteenName").innerText = canteen_name;
document.getElementById("canteenId").innerText = canteen_id;

// =========================
// FETCH ORDERS
// =========================
async function fetchOrders(){
    try{
        const res = await fetch(`${BASE_URL}/owner/orders/${canteen_id}`);
        const orders = await res.json();
        const container = document.getElementById("ordersContainer");
        container.innerHTML="";

        orders.forEach(order=>{
            const card=document.createElement("div");
            card.className="card";

            card.innerHTML=`
                <p><strong>Token:</strong> ${order.token_number}</p>
                <p><strong>Customer Name:</strong> ${order.name || "-"}</p>
                <p><strong>Mobile:</strong> ${order.mobile || "-"}</p>
                <p><strong>Payment ID:</strong> ${order.payment_id || "-"}</p>
                <p><strong>Status:</strong> ${order.order_status}</p>
                <p><strong>Total:</strong> ₹${order.total_price}</p>

                <button class="accept" onclick="acceptOrder('${order._id}')">Accept</button>
                <button class="prepare" onclick="updateStatus('${order._id}','Preparing')">Preparing</button>
                <button class="ready" onclick="updateStatus('${order._id}','Ready')">Ready</button>
                <button class="reject" onclick="updateStatus('${order._id}','Rejected')">Reject</button>
            `;

            container.appendChild(card);
        });

    }catch{
        alert("Error fetching orders");
    }
}

fetchOrders();
setInterval(fetchOrders,5000);

// =========================
// ACCEPT WITH TIME
// =========================
async function acceptOrder(order_id){

    const time = prompt("Enter Estimated Time (in minutes):");
    if(!time || isNaN(time)){
        alert("Enter valid time");
        return;
    }

    const res = await fetch(`${BASE_URL}/owner/update-status/${order_id}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            status:"Accepted",
            estimated_time:parseInt(time)
        })
    });

    const data = await res.json();

    if(data.order_data){
        saveToLocal(data.order_data);
    }

    fetchOrders();
}


// =========================
// UPDATE STATUS (Reject also delete)
// =========================
async function updateStatus(order_id,status){

    const res = await fetch(`${BASE_URL}/owner/update-status/${order_id}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({status:status})
    });

    const data = await res.json();

    if(data.order_data){
        saveToLocal(data.order_data);
    }

    fetchOrders();
}


// =========================
// SAVE TO LOCAL STORAGE
// =========================
function saveToLocal(order){

    let orders = JSON.parse(localStorage.getItem("my_orders")) || [];
    orders.push(order);
    localStorage.setItem("my_orders", JSON.stringify(orders));
}


// =========================
// SALES (UNCHANGED)
// =========================
async function fetchSales(){
    const res = await fetch(`${BASE_URL}/owner/daily-sales/${canteen_id}`);
    const data = await res.json();
    document.getElementById("totalOrders").innerText=data.total_orders;
    document.getElementById("totalSales").innerText=data.total_sales;
}
fetchSales();
setInterval(fetchSales,10000);


// =========================
// MENU (UNCHANGED)
// =========================
async function fetchMenu(){
    const res = await fetch(`${BASE_URL}/menu/${canteen_id}`);
    const items = await res.json();
    const container=document.getElementById("menuContainer");
    container.innerHTML="";

    items.forEach(item=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <p><strong>${item.name}</strong> (₹${item.price})</p>
            <p>${item.category}</p>
            ${item.image ? `<img src="${BASE_URL}${item.image}" width="80">` : ""}
            <button class="delete" onclick="deleteMenu('${item._id}')">Delete</button>
        `;
        container.appendChild(card);
    });
}
fetchMenu();

async function deleteMenu(id){
    if(!confirm("Delete this item?")) return;

    await fetch(`${BASE_URL}/owner/delete-menu/${id}`,{
        method:"DELETE"
    });

    alert("Item Deleted");
    fetchMenu();
}

function goToPostPage(){
    window.location.href="canteen-post.html";
}

</script>
</body>
</html>
