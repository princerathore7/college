<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Timetable Panel</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      padding:20px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .topbar{
      background:#0d47a1;
      color:white;
      padding:18px;
      border-radius:12px;
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topbar h1{
      font-size:28px;
    }

    .main-card{
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .section-title{
      margin-bottom:20px;
      color:#0d47a1;
      font-size:24px;
      font-weight:bold;
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#333;
    }

    select,
    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    .day-section{
      margin-top:30px;
      border:2px solid #e0e0e0;
      border-radius:12px;
      padding:20px;
      background:#fafafa;
    }

    .day-title{
      font-size:22px;
      margin-bottom:18px;
      color:#0d47a1;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .period-card{
      background:white;
      border-radius:10px;
      padding:15px;
      margin-bottom:15px;
      border-left:5px solid #0d47a1;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
    }

    .btn{
      padding:12px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    .add-btn{
      background:#0d47a1;
      color:white;
    }

    .remove-btn{
      background:#d32f2f;
      color:white;
      margin-top:15px;
    }

    .submit-btn{
      background:#1b5e20;
      color:white;
      width:100%;
      margin-top:30px;
      padding:16px;
      font-size:18px;
    }

    .type-select{
      background:#fff8e1;
    }

    @media(max-width:768px){

      .topbar{
        flex-direction:column;
        gap:10px;
        text-align:center;
      }

    }

  </style>
</head>
<body>

<!-- ================= CSE ================= -->

    <!-- DAYS CONTAINER -->

    <div id="daysContainer"></div>

    <!-- SUBMIT BUTTON -->

      <i class="fa-solid fa-paper-plane"></i>

<script>

const days = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];

const daysContainer = document.getElementById("daysContainer");


// =======================================================
// CREATE DAY SECTIONS
// =======================================================

days.forEach(day => {

  const dayDiv = document.createElement("div");

  dayDiv.className = "day-section";

  dayDiv.innerHTML = `

    <div class="day-title">

      <span>${day}</span>

      <button class="btn add-btn" onclick="addPeriod('${day}')">

        <i class="fa-solid fa-plus"></i>
        Add Period

      </button>

    </div>

    <div id="${day}-periods"></div>

  `;

  daysContainer.appendChild(dayDiv);

});


// =======================================================
// ADD PERIOD
// =======================================================

function addPeriod(day){

  const container = document.getElementById(`${day}-periods`);

  const periodDiv = document.createElement("div");

  periodDiv.className = "period-card";

  periodDiv.innerHTML = `

    <div class="grid">

      <div>
        <label>Start Time</label>
        <input type="time" class="startTime">
      </div>

      <div>
        <label>End Time</label>
        <input type="time" class="endTime">
      </div>

      <div>
        <label>Type</label>

        <select class="type-select periodType">

          <option value="subject">Subject</option>
          <option value="break">Break</option>

        </select>
      </div>

      <div>
        <label>Subject / Break Name</label>
        <input type="text" class="subject" placeholder="Mathematics / Lunch Break">
      </div>

      <div>
        <label>Faculty Name</label>
        <input type="text" class="faculty" placeholder="Sharma Sir">
      </div>

      <div>
        <label>Room Number</label>
        <input type="text" class="room" placeholder="A-101">
      </div>

    </div>

    <button class="btn remove-btn" onclick="this.parentElement.remove()">

      <i class="fa-solid fa-trash"></i>
      Remove

    </button>

  `;

  container.appendChild(periodDiv);

}


// =======================================================
// SUBMIT TIMETABLE
// =======================================================

async function submitTimetable(){

  const className = document.getElementById("className").value;

  const year = document.getElementById("year").value;

  if(!year){

    alert("Please select year");
    return;

  }

  if(!className){

    alert("Please select class");
    return;

  }

  const weeklySchedule = {};

  days.forEach(day => {

    const periodContainer = document.getElementById(`${day}-periods`);

    const periodCards = periodContainer.querySelectorAll(".period-card");

    weeklySchedule[day] = [];

    periodCards.forEach(card => {

      const periodData = {

        startTime: card.querySelector(".startTime").value,
        endTime: card.querySelector(".endTime").value,
        type: card.querySelector(".periodType").value,
        subject: card.querySelector(".subject").value,
        faculty: card.querySelector(".faculty").value,
        room: card.querySelector(".room").value

      };

      weeklySchedule[day].push(periodData);

    });

  });


  // FINAL DATA

  const finalData = {

    year: year,

    className: className,

    mentorID: localStorage.getItem("mentorID") || "MENTOR001",

    weeklySchedule: weeklySchedule

  };

  console.log(finalData);


  // API CALL

  try{

    const response = await fetch(
      "https://college-hwbb.onrender.com/api/timetable/set-weekly",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(finalData)
      }
    );

    const data = await response.json();

    if(data.success){

      alert("Timetable Posted Successfully");

    }else{

      alert(data.message || "Failed to post timetable");

    }

  }catch(error){

    console.error(error);

    alert("Server Error");

  }

}

</script>
