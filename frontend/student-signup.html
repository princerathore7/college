
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Signup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#001f4d,#003c8f,#005bea);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .signup-box{
      width:100%;
      max-width:500px;
      background:white;
      border-radius:22px;
      padding:35px;
      box-shadow:0 15px 40px rgba(0,0,0,0.25);
    }

    .logo{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:auto;
      margin-bottom:18px;
      border:4px solid #0b57d0;
    }

    h1{
      text-align:center;
      color:#002b6b;
      margin-bottom:8px;
      font-size:30px;
    }

    .subtext{
      text-align:center;
      color:#666;
      margin-bottom:28px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:#002b6b;
      font-weight:600;
      font-size:14px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:2px solid #dfe7ff;
      outline:none;
      font-size:15px;
      transition:0.3s;
    }

    input:focus{
      border-color:#0b57d0;
      box-shadow:0 0 0 4px rgba(11,87,208,0.1);
    }

    .otp-row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .otp-row input{
      flex:1;
    }

    .otp-btn{
      padding:12px 16px;
      border:none;
      background:#0b57d0;
      color:white;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      transition:0.3s;
      white-space:nowrap;
    }

    .otp-btn:hover{
      background:#003ea8;
    }

    .main-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#0b57d0,#003ea8);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      margin-top:20px;
      transition:0.3s;
    }

    .main-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(0,0,0,0.18);
    }

    .success{
      color:green;
      font-size:13px;
      margin-top:6px;
    }

    .error{
      color:red;
      font-size:13px;
      margin-top:6px;
    }

    #recaptcha-container{
      margin-top:15px;
      margin-bottom:15px;
    }

  </style>
</head>
<body>

<div class="signup-box">

  <img src="logo.jpg" class="logo">

  <h1>Student Signup</h1>

  <p class="subtext">
    Create your student account securely
  </p>

  <div class="input-group">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter Full Name">
  </div>

  <div class="input-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter Email Address">

    <div class="otp-row">
      <input type="text" id="emailOtp" placeholder="Enter Email OTP">

      <button class="otp-btn" onclick="sendEmailOTP()">
        Send OTP
      </button>
    </div>

    <button class="otp-btn" style="margin-top:10px;width:100%" onclick="verifyEmailOTP()">
      Verify Email OTP
    </button>

    <div id="emailStatus"></div>
  </div>

  <div class="input-group">
    <label>Mobile Number</label>
    <input type="text" id="phone" placeholder="+919876543210">

    <div id="recaptcha-container"></div>

    <div class="otp-row">
      <input type="text" id="phoneOtp" placeholder="Enter Mobile OTP">

      <button class="otp-btn" onclick="sendPhoneOTP()">
        Send OTP
      </button>
    </div>

    <button class="otp-btn" style="margin-top:10px;width:100%" onclick="verifyPhoneOTP()">
      Verify Mobile OTP
    </button>

    <div id="phoneStatus"></div>
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Create Password">
  </div>

  <button class="main-btn" onclick="signup()">
    Create Account
  </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyD6MJM4ggDOEPt2Y2cEXjDVekIdEerRUFo",

  authDomain: "acropolis-institute-group.firebaseapp.com",

  projectId: "acropolis-institute-group",

  storageBucket: "acropolis-institute-group.firebasestorage.app",

  messagingSenderId: "797942131160",

  appId: "1:797942131160:web:5a14bdc84506d62e9b2aad"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.emailVerified = false;
window.phoneVerified = false;
window.generatedEmailOTP = "";

window.recaptchaVerifier =
new RecaptchaVerifier(
  auth,
  'recaptcha-container',
  {
    size:'normal'
  }
);

window.sendPhoneOTP = async () => {

  const phone =
  document.getElementById("phone").value;

  try {

    const confirmationResult =
    await signInWithPhoneNumber(
      auth,
      phone,
      window.recaptchaVerifier
    );

    window.confirmationResult =
    confirmationResult;

    document.getElementById("phoneStatus").innerHTML =
    '<div class="success">OTP Sent Successfully</div>';

  }

  catch(err){

    console.log(err);

    document.getElementById("phoneStatus").innerHTML =
    `<div class="error">${err.message}</div>`;

  }

};

window.verifyPhoneOTP = async () => {

  const otp =
  document.getElementById("phoneOtp").value;

  try {

    await window.confirmationResult.confirm(otp);

    window.phoneVerified = true;

    document.getElementById("phoneStatus").innerHTML =
    '<div class="success">Mobile Number Verified</div>';

  }

  catch(err){

    document.getElementById("phoneStatus").innerHTML =
    '<div class="error">Invalid Mobile OTP</div>';

  }

};

window.sendEmailOTP = async () => {

  const email =
  document.getElementById("email").value;

  if(!email){

    alert("Enter Email First");

    return;

  }

  const otp =
  Math.floor(100000 + Math.random() * 900000);

  window.generatedEmailOTP = otp.toString();

  try {

    const response =
    await fetch("/send-email-otp", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email:email,
        otp:otp
      })

    });

    const data = await response.json();

    if(data.success){

      document.getElementById("emailStatus").innerHTML =
      '<div class="success">Email OTP Sent Successfully</div>';

    }

    else{

      document.getElementById("emailStatus").innerHTML =
      '<div class="error">Failed To Send OTP</div>';

    }

  }

  catch(err){

    console.log(err);

  }

};

window.verifyEmailOTP = () => {

  const enteredOTP =
  document.getElementById("emailOtp").value;

  if(enteredOTP === window.generatedEmailOTP){

    window.emailVerified = true;

    document.getElementById("emailStatus").innerHTML =
    '<div class="success">Email Verified Successfully</div>';

  }

  else{

    document.getElementById("emailStatus").innerHTML =
    '<div class="error">Invalid Email OTP</div>';

  }

};

window.signup = async () => {

  const name =
  document.getElementById("name").value;

  const email =
  document.getElementById("email").value;

  const phone =
  document.getElementById("phone").value;

  const password =
  document.getElementById("password").value;

  if(!window.emailVerified){

    alert("Verify Email First");

    return;

  }

  if(!window.phoneVerified){

    alert("Verify Mobile Number First");

    return;

  }

  try {

    const response =
    await fetch("/api/students/signup", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        name,
        email,
        phone,
        password
      })

    });

    const data = await response.json();

    if(data.success){

      alert("Signup Successful");

      window.location.href =
      "student-login.html";

    }

    else{

      alert(data.message);

    }

  }

  catch(err){

    console.log(err);

    alert("Server Error");

  }

};

</script>

</body>
</html>
