<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Missing Complaints</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}
h2{
    text-align:center;
    color:#0b1f3a;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
}
th, td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}
th{
    background:#0b1f3a;
    color:#fff;
}
button{
    padding:6px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:13px;
}
.approve{ background:#2ecc71; color:#fff; }
.disapprove{ background:#f39c12; color:#fff; }
.delete{ background:#e74c3c; color:#fff; }
.view{ background:#3498db; color:#fff; }
button:hover{ opacity:0.85; }

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
}
.modal-content{
    background:#fff;
    max-width:500px;
    margin:80px auto;
    padding:20px;
    border-radius:8px;
}
.modal img{
    max-width:100%;
    border-radius:6px;
}
.close{
    float:right;
    cursor:pointer;
    font-size:18px;
}
.status-badge{
    padding:4px 8px;
    border-radius:4px;
    color:#fff;
    font-weight:bold;
}
.status-pending{ background:#7f8c8d; }
.status-approved{ background:#2ecc71; }
.status-disapproved{ background:#f39c12; }
</style>
</head>

<body>

<h2>📋 Missing Complaints – Admin</h2>

<table>
<thead>
<tr>
    <th>Enrollment</th>
    <th>Name</th>
    <th>Category</th>
    <th>Status</th>
    <th>Actions</th>
</tr>
</thead>
<tbody id="complaintsTable"></tbody>
</table>

<!-- VIEW MODAL -->
<div class="modal" id="viewModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h3>Complaint Details</h3>
    <p><b>Enrollment:</b> <span id="mEnroll"></span></p>
    <p><b>Name:</b> <span id="mName"></span></p>
    <p><b>Class:</b> <span id="mClass"></span></p>
    <p><b>Category:</b> <span id="mCategory"></span></p>
    <p><b>Description:</b></p>
    <p id="mDesc"></p>
    <img id="mPhoto">
  </div>
</div>

<script>
const API = "https://college-hwbb.onrender.com/api/missing";

/* =========================
   LOAD ALL COMPLAINTS
========================= */
function loadComplaints(){
  fetch(`${API}/all`)
    .then(res => res.json())
    .then(res => {
      if(!res.success) return alert("Failed to load");

      const tbody = document.getElementById("complaintsTable");
      tbody.innerHTML = "";

      res.data.forEach(item => {
        const tr = document.createElement("tr");

        // Status badge
        let statusClass = "status-pending";
        if(item.status === "approved") statusClass = "status-approved";
        else if(item.status === "disapproved") statusClass = "status-disapproved";

        tr.innerHTML = `
          <td>${item.enrollment}</td>
          <td>${item.name}</td>
          <td>${item.category}</td>
          <td><span class="status-badge ${statusClass}">${item.status.toUpperCase()}</span></td>
          <td>
            <button class="view" onclick='viewMore(${JSON.stringify(item)})'>View</button>
            <button class="approve" onclick="confirmAction('approve','${item._id}')">
                ${item.status==='approved' ? 'Approved' : 'Approve'}
            </button>
            <button class="disapprove" onclick="confirmAction('disapprove','${item._id}')">
                ${item.status==='disapproved' ? 'Disapproved' : 'Disapprove'}
            </button>
            <button class="delete" onclick="confirmDelete('${item._id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
}

/* =========================
   CONFIRMATIONS
========================= */
function confirmAction(action,id){
    let msg = action==='approve' ? "Approve this item?" : "Disapprove this item?";
    if(!confirm(msg)) return;

    fetch(`${API}/${action}/${id}`, { method:"PUT" })
        .then(() => {
            alert(`Item ${action==='approve' ? 'Approved' : 'Disapproved'} successfully!`);
            loadComplaints();
        });
}

function confirmDelete(id){
    if(!confirm("Delete permanently?")) return;
    fetch(`${API}/delete/${id}`, { method:"DELETE" })
        .then(() => loadComplaints());
}

/* =========================
   VIEW MODAL
========================= */
function viewMore(item){
  document.getElementById("mEnroll").innerText = item.enrollment;
  document.getElementById("mName").innerText = item.name;
  document.getElementById("mClass").innerText = item.class;
  document.getElementById("mCategory").innerText = item.category;
  document.getElementById("mDesc").innerText = item.description;
  document.getElementById("mPhoto").src = item.photo;

  document.getElementById("viewModal").style.display = "block";
}

function closeModal(){
  document.getElementById("viewModal").style.display = "none";
}

/* INIT */
loadComplaints();
</script>

</body>
</html>
