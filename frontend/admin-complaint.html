<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Missing Complaints</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}
.container{
    max-width:1100px;
    margin:auto;
}
h2{
    text-align:center;
    margin-bottom:20px;
}
.controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}
input, select{
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    flex:1;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}
th, td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:center;
}
th{
    background:#0b1f3a;
    color:#fff;
}
.btn{
    padding:6px 10px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
}
.approve{background:#2ecc71;color:#fff}
.disapprove{background:#f39c12;color:#fff}
.delete{background:#e74c3c;color:#fff}
.view{background:#3498db;color:#fff}

/* POPUP */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}
.modal-content{
    background:#fff;
    width:90%;
    max-width:500px;
    padding:20px;
    border-radius:8px;
}
.modal img{
    max-width:100%;
    border-radius:6px;
}
.close{
    float:right;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>📂 Missing Complaints – Admin</h2>

    <div class="controls">
        <input type="text" id="search" placeholder="Search enrollment, name, class...">
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option>Electronic Item</option>
            <option>Bag</option>
            <option>Tiffin</option>
            <option>Money</option>
            <option>Books</option>
            <option>ID Card</option>
            <option>Other</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Enrollment</th>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- POPUP -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">✖</span>
        <div id="modalData"></div>
    </div>
</div>

<script>
const API = "https://college-hwbb.onrender.com/api/missing";
let complaints = [];

function loadComplaints(){
    fetch(`${API}/pending`)
    .then(res => res.json())
    .then(res => {
        complaints = res.data || [];
        renderTable();
    });
}

function renderTable(){
    const tbody = document.getElementById("tableBody");
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("categoryFilter").value;

    tbody.innerHTML = "";

    complaints
    .filter(c =>
        (!category || c.category === category) &&
        (
            c.enrollment.toLowerCase().includes(search) ||
            c.name.toLowerCase().includes(search) ||
            c.class.toLowerCase().includes(search)
        )
    )
    .forEach(c => {
        tbody.innerHTML += `
        <tr>
            <td>${c.enrollment}</td>
            <td>${c.name}</td>
            <td>${c.category}</td>
            <td>${c.status}</td>
            <td>
                <button class="btn view" onclick='viewMore(${JSON.stringify(c)})'>View</button>
                <button class="btn approve" onclick="approve('${c._id}')">Approve</button>
                <button class="btn disapprove" onclick="disapprove('${c._id}')">Reject</button>
                <button class="btn delete" onclick="removeItem('${c._id}')">Delete</button>
            </td>
        </tr>`;
    });
}

function approve(id){
    fetch(`${API}/approve/${id}`,{method:"PUT"})
    .then(()=>loadComplaints());
}

function disapprove(id){
    fetch(`${API}/disapprove/${id}`,{method:"PUT"})
    .then(()=>loadComplaints());
}

function removeItem(id){
    if(confirm("Delete permanently?")){
        fetch(`${API}/delete/${id}`,{method:"DELETE"})
        .then(()=>loadComplaints());
    }
}

function viewMore(c){
    document.getElementById("modalData").innerHTML = `
        <img src="${c.photo}">
        <p><b>Enrollment:</b> ${c.enrollment}</p>
        <p><b>Name:</b> ${c.name}</p>
        <p><b>Class:</b> ${c.class}</p>
        <p><b>Category:</b> ${c.category}</p>
        <p><b>Description:</b> ${c.description}</p>
        <p><b>Status:</b> ${c.status}</p>
    `;
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

document.getElementById("search").addEventListener("input", renderTable);
document.getElementById("categoryFilter").addEventListener("change", renderTable);

loadComplaints();
</script>

</body>
</html>
