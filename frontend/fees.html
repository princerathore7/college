<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Pending Fees Checker</title>
    <link rel="icon" href="https://cdn.corenexis.com/view/6199335168">

    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }

        body {
            background: #f5f7fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        header img {
            height: 50px;
        }

        header h1 {
            color: #003366;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            width: 400px;
            max-width: 95%;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #003366;
        }

        button {
            background: #003366;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #001f44;
            transform: scale(1.02);
        }

        .result {
            margin-top: 25px;
            text-align: left;
            font-size: 16px;
        }

        .result p {
            margin: 8px 0;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 600;
            color: #fff;
            display: inline-block;
        }

        .paid { background: #28a745; }
        .pending { background: #dc3545; }

        .back-btn {
            background: #003366;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.2s;
        }

        .back-btn:hover { background: #001f44; transform: scale(1.02); }
        .back-btn:active { transform: scale(0.98); }

        @media(max-width: 480px) {
            .card { padding: 20px 15px; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header / Logo -->
    <header>
        <img src="logo.jpg" alt="Acropolis Logo">
        <h1>Student Pending Fees Checker</h1>
    </header>

    <!-- Card -->
    <div class="card">
        <input type="text" id="enrollmentInput" placeholder="Enter Enrollment Number" />
        <button onclick="fetchPendingFees()">Check Fees</button>

        <div class="result" id="resultBox"></div>
    </div>

    <button class="back-btn" onclick="goBack()">← Back</button>

    <script>
        async function fetchPendingFees() {
            const enrollment = document.getElementById("enrollmentInput").value.trim();
            const resultBox = document.getElementById("resultBox");

            if (!enrollment) {
                resultBox.innerHTML = "<span style='color:red;'>⚠️ Please enter an enrollment number.</span>";
                return;
            }

            resultBox.innerHTML = "⏳ Fetching data...";

            try {
                const response = await fetch(`https://college-hwbb.onrender.com/api/students/${enrollment}/pending-fees?nocache=${Date.now()}`, {
                    method: "GET",
                    headers: { "Cache-Control": "no-cache, no-store, must-revalidate" }
                });

                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const data = await response.json();

                if (data.success && data.student) {
                    const student = data.student;
                    const pending = Number(student.pending_fees) || 0;

                    resultBox.innerHTML = `
                        <p>👤 <strong>Name:</strong> ${student.name}</p>
                        <p>🎓 <strong>Enrollment:</strong> ${student.enrollment}</p>
                        <p>🏫 <strong>Class:</strong> ${student.class || student.branch}</p>
                        ${student.year ? `<p>📅 <strong>Year:</strong> ${student.year}</p>` : ''}
                        <p>💰 <strong>Pending Fees:</strong> ₹${pending.toLocaleString()}</p>
                        <span class="badge ${pending > 0 ? 'pending' : 'paid'}">
                            ${pending > 0 ? 'Pending' : 'Paid'}
                        </span>
                    `;
                } else {
                    resultBox.innerHTML = "<span style='color:red;'>⚠️ No data found for this student.</span>";
                }

            } catch (err) {
                console.error("Error fetching data:", err);
                resultBox.innerHTML = "<span style='color:red;'>❌ Error fetching data from server.</span>";
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
