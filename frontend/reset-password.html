<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#0f172a;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{

background:white;
padding:40px;
border-radius:12px;
width:380px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
text-align:center;

}

.logo{
width:90px;
margin-bottom:10px;
}

h2{
color:#0f172a;
margin-bottom:10px;
}

p{
font-size:14px;
color:#555;
margin-bottom:20px;
}

input{

width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;

}

button{

width:100%;
padding:12px;
margin-top:20px;
border:none;
border-radius:6px;
background:#1e3a8a;
color:white;
font-size:15px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.msg{

margin-top:15px;
font-size:14px;

}

.success{

color:green;

}

.error{

color:red;

}

.footer{

margin-top:25px;
font-size:12px;
color:#888;

}

.red-line{

height:4px;
background:#dc2626;
margin-top:-40px;
margin-bottom:30px;

}

</style>

</head>

<body>

<div class="container">

<div class="red-line"></div>

<img src="logo.jpg" class="logo">

<h2>Reset Password</h2>

<p>Create a new password for your account</p>

<input type="password" id="password" placeholder="New password">

<input type="password" id="confirmPassword" placeholder="Confirm password">

<button onclick="resetPassword()">Update Password</button>

<div id="message" class="msg"></div>

<div class="footer">

Acropolis Institute Portal

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if(!token){

document.getElementById("message").innerHTML="Invalid reset link";
document.getElementById("message").className="msg error";

}

async function resetPassword(){

const password = document.getElementById("password").value.trim();
const confirm = document.getElementById("confirmPassword").value.trim();
const msg = document.getElementById("message");

if(!password || !confirm){

msg.innerHTML="Please fill all fields";
msg.className="msg error";
return;

}

if(password !== confirm){

msg.innerHTML="Passwords do not match";
msg.className="msg error";
return;

}

try{

const res = await fetch("https://college-hwbb.onrender.com/api/auth/reset-password",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
token:token,
password:password
})

});

const data = await res.json();

if(res.ok && data.success){

msg.innerHTML="Password updated successfully";
msg.className="msg success";

setTimeout(()=>{

window.location.href="login.html";

},2000);

}else{

msg.innerHTML=data.message || "Failed to reset password";
msg.className="msg error";

}

}catch(err){

msg.innerHTML="Server error";
msg.className="msg error";

}

}

</script>

</body>
</html>
