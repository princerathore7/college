<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Inter', sans-serif;
background:#f3f4f6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
width:350px;
text-align:center;
}

h2{
margin-bottom:10px;
}

p{
font-size:14px;
color:#666;
}

input{
width:100%;
padding:10px;
margin-top:15px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

button{
width:100%;
padding:10px;
margin-top:15px;
background:#2563eb;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.msg{
margin-top:15px;
font-size:14px;
}

.success{
color:green;
}

.error{
color:red;
}

</style>
</head>

<body>

<div class="card">

<h2>Forgot Password</h2>
<p>Enter your email to receive reset link</p>

<input type="email" id="email" placeholder="Enter your email">

<button onclick="sendReset()">Send Reset Link</button>

<div id="message" class="msg"></div>

</div>

<script>

async function sendReset(){

const email = document.getElementById("email").value.trim();
const msg = document.getElementById("message");

if(!email){
msg.innerHTML = "Please enter your email";
msg.className = "msg error";
return;
}

try{

const res = await fetch("https://college-hwbb.onrender.com/api/auth/forgot-password",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email})

});

const data = await res.json();

if(res.ok && data.success){

msg.innerHTML = "Reset link sent to your email";
msg.className = "msg success";

}else{

msg.innerHTML = data.message || "Something went wrong";
msg.className = "msg error";

}

}catch(err){

msg.innerHTML = "Server error. Please try again.";
msg.className = "msg error";

}

}

</script>

</body>
</html>
