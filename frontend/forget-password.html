<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Access | Educational Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy-blue: #0a192f;
            --pure-white: #ffffff;
            --institute-red: #dc2626;
            --hover-blue: #112240;
            --text-gray: #4b5563;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--navy-blue) 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--navy-blue);
        }

        .card {
            background: var(--pure-white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            border-top: 5px solid var(--institute-red);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 120px;
            height: auto;
            border-radius: 4px;
        }

        h2 {
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--navy-blue);
        }

        p {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--navy-blue);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--navy-blue);
            box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            background: var(--navy-blue);
            border: none;
            color: var(--pure-white);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: var(--hover-blue);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--institute-red);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.jpg" alt="Institute Logo" onerror="this.src='https://via.placeholder.com/120x60?text=LOGO'">
    </div>

    <h2>Forgot Password</h2>
    <p>Please enter your registered institutional email. We will send a secure reset link to your inbox.</p>

    <div class="input-group">
        <label for="email">Institutional Email Address</label>
        <input type="email" id="email" placeholder="e.g. name@institute.edu" autocomplete="email">
    </div>

    <button id="resetBtn" onclick="sendReset()">
        <span id="btnText">Send Reset Link</span>
        <span id="loader" class="spinner" style="display: none;"></span>
    </button>

    <div id="message" class="msg"></div>

    <div class="footer-links">
        <a href="login.html">Back to Login</a>
    </div>
</div>

<script>
    async function sendReset() {
        const emailInput = document.getElementById("email");
        const msg = document.getElementById("message");
        const btnText = document.getElementById("btnText");
        const loader = document.getElementById("loader");
        const resetBtn = document.getElementById("resetBtn");

        const email = emailInput.value.trim();

        // Basic Validation
        if (!email) {
            showMsg("Please enter your email address to proceed.", "error");
            return;
        }

        // Debugging Start
        console.log("--- Reset Password Process Started ---");
        console.log("Target Email:", email);
        console.log("API Endpoint: https://college-hwbb.onrender.com/api/auth/forgot-password");

        // UI State: Loading
        resetBtn.disabled = true;
        btnText.innerText = "Processing...";
        loader.style.display = "inline-block";
        msg.style.display = "none";

        try {
            const res = await fetch("https://college-hwbb.onrender.com/api/auth/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            
            // Debugging Response
            console.log("Response Status:", res.status);
            console.log("Response Data:", data);

            if (res.ok && (data.success || data.status === "success")) {
                showMsg("Verification link has been dispatched to your email.", "success");
                console.log("Success: Reset link sent.");
            } else {
                const errorMsg = data.message || "Unable to find an account with that email.";
                showMsg(errorMsg, "error");
                console.warn("API Error:", errorMsg);
            }

        } catch (err) {
            showMsg("Network error or server is unreachable. Please try again later.", "error");
            console.error("Critical Failure:", err);
        } finally {
            // Restore UI State
            resetBtn.disabled = false;
            btnText.innerText = "Send Reset Link";
            loader.style.display = "none";
            console.log("--- Reset Password Process Ended ---");
        }
    }

    function showMsg(text, type) {
        const msg = document.getElementById("message");
        msg.innerHTML = text;
        msg.className = `msg ${type}`;
        msg.style.display = "block";
    }
</script>

</body>
</html>
