<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Lecture Requests</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f4f7fb;

  color:#172033;

}

.container{

  max-width:1100px;

  margin:auto;

  padding:25px;

}

.header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:25px;

}

.header h1{

  margin:0;

  color:#0b1f3a;

}

.refresh{

  border:0;

  background:#0b1f3a;

  color:white;

  padding:10px 16px;

  border-radius:8px;

  cursor:pointer;

}

.filters{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-bottom:20px;

}

.filter{

  padding:9px 15px;

  border-radius:20px;

  border:1px solid #ddd;

  background:white;

  cursor:pointer;

}

.filter.active{

  background:#0b1f3a;

  color:white;

}

.requests{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(320px,1fr)
    );

  gap:18px;

}

.card{

  background:white;

  border-radius:14px;

  padding:20px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

}

.top{

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:flex-start;

}

.title{

  font-size:18px;

  font-weight:bold;

  color:#0b1f3a;

}

.status{

  padding:5px 10px;

  border-radius:20px;

  font-size:12px;

  font-weight:bold;

  text-transform:uppercase;

}

.pending{

  background:#fff3cd;

  color:#856404;

}

.approved{

  background:#d4edda;

  color:#155724;

}

.disapproved{

  background:#f8d7da;

  color:#721c24;

}

.info{

  margin-top:15px;

  line-height:1.8;

  color:#555;

}

.info strong{

  color:#222;

}

.time{

  display:inline-block;

  background:#eef3f9;

  color:#0b1f3a;

  padding:8px 12px;

  border-radius:8px;

  font-weight:bold;

  margin-top:8px;

}

.lock{

  color:#888;

  font-size:12px;

  margin-left:5px;

}

.actions{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:18px;

}

button{

  border:0;

  padding:9px 14px;

  border-radius:7px;

  cursor:pointer;

  font-weight:bold;

}

.approve{

  background:#27ae60;

  color:white;

}

.reject{

  background:#e74c3c;

  color:white;

}

.edit{

  background:#0b1f3a;

  color:white;

}

.remove{

  background:#c0392b;

  color:white;

}

.disabled{

  opacity:.5;

  pointer-events:none;

}

.empty{

  text-align:center;

  padding:50px;

  color:#888;

}

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  align-items:center;

  justify-content:center;

  padding:20px;

}

.modal.show{

  display:flex;

}

.modal-box{

  background:white;

  width:100%;

  max-width:500px;

  border-radius:14px;

  padding:25px;

}

.modal-box h2{

  margin-top:0;

  color:#0b1f3a;

}

.field{

  margin-bottom:15px;

}

.field label{

  display:block;

  font-weight:bold;

  margin-bottom:6px;

}

.field input,
.field select{

  width:100%;

  padding:11px;

  border:1px solid #ccc;

  border-radius:7px;

}

.locked{

  background:#f1f3f5;

  color:#666;

  cursor:not-allowed;

}

.search-results{

  border:1px solid #ddd;

  border-radius:7px;

  max-height:180px;

  overflow:auto;

  margin-top:5px;

  display:none;

}

.mentor{

  padding:10px;

  cursor:pointer;

  border-bottom:1px solid #eee;

}

.mentor:hover{

  background:#f4f7fb;

}

.modal-actions{

  display:flex;

  gap:10px;

  margin-top:20px;

}

.save{

  background:#27ae60;

  color:white;

}

.cancel{

  background:#777;

  color:white;

}

.message{

  margin-bottom:20px;

  padding:12px;

  border-radius:8px;

  display:none;

}

.message.success{

  display:block;

  background:#d4edda;

  color:#155724;

}

.message.error{

  display:block;

  background:#f8d7da;

  color:#721c24;

}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📋 My Lecture Requests</h1>

    <button
      class="refresh"
      onclick="loadRequests()"
    >
      🔄 Refresh
    </button>

  </div>


  <div id="message"
       class="message">
  </div>


  <div class="filters">

    <button
      class="filter active"
      data-filter="all"
      onclick="setFilter('all',this)"
    >
      All
    </button>

    <button
      class="filter"
      data-filter="pending"
      onclick="setFilter('pending',this)"
    >
      Pending
    </button>

    <button
      class="filter"
      data-filter="approved"
      onclick="setFilter('approved',this)"
    >
      Approved
    </button>

    <button
      class="filter"
      data-filter="disapproved"
      onclick="setFilter('disapproved',this)"
    >
      Disapproved
    </button>

  </div>


  <div
    id="requests"
    class="requests"
  ></div>

</div>


<!-- =====================================================
     EDIT MODAL
====================================================== -->

<div
  id="editModal"
  class="modal"
>

  <div class="modal-box">

    <h2>
      ✏️ Edit The Lecture
    </h2>


    <div class="field">

      <label>
        Lecture Time 🔒
      </label>

      <input
        id="editTime"
        class="locked"
        readonly
      >

    </div>


    <div class="field">

      <label>
        Faculty
      </label>

      <input
        id="facultySearch"
        placeholder="Search faculty..."
        autocomplete="off"
      >

      <div
        id="mentorResults"
        class="search-results"
      ></div>

    </div>


    <div class="field">

      <label>
        Selected Faculty
      </label>

      <input
        id="selectedFaculty"
        readonly
        class="locked"
      >

    </div>


    <div class="field">

      <label>
        Subject
      </label>

      <input
        id="editSubject"
        placeholder="Enter subject"
      >

    </div>


    <div class="modal-actions">

      <button
        class="save"
        onclick="saveLectureEdit()"
      >
        💾 Save Changes
      </button>

      <button
        class="cancel"
        onclick="closeEditModal()"
      >
        Cancel
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
  "https://college-hwbb.onrender.com/api/timetable";


/* =====================================================
   MENTOR ID FROM LOCAL STORAGE
===================================================== */

function getMentorId(){

  return (

    localStorage.getItem(
      "mentorId"
    )

    ||

    ""

  ).trim();

}


const mentorId =
  getMentorId();


if(!mentorId){

  document.body.innerHTML = `

    <div
      style="
        text-align:center;
        margin-top:20vh;
        font-family:Arial;
      "
    >

      <h2>
        ❌ Mentor ID not found
      </h2>

      <p>
        Please login again.
      </p>

    </div>

  `;

  throw new Error(
    "mentorId missing"
  );

}


/* =====================================================
   STATE
===================================================== */

let allRequests = [];

let currentFilter =
  "all";

let editingRequest = null;

let selectedFacultyId =
  "";

let selectedFacultyName =
  "";


/* =====================================================
   LOAD REQUESTS
===================================================== */

async function loadRequests(){

  const container =
    document.getElementById(
      "requests"
    );


  container.innerHTML = `

    <div class="empty">
      ⏳ Loading lecture requests...
    </div>

  `;


  try{

    const response =
      await fetch(

        `${API_BASE}/lecture-requests/my/${encodeURIComponent(mentorId)}`

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Unable to load requests."
      );

    }


    allRequests =
      Array.isArray(
        data.requests
      )
      ? data.requests
      : [];


    renderRequests();


  }catch(error){

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        ❌
        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(
  filter,
  button
){

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  renderRequests();

}


/* =====================================================
   RENDER
===================================================== */

function renderRequests(){

  const container =
    document.getElementById(
      "requests"
    );


  let requests =
    [...allRequests];


  if(
    currentFilter !== "all"
  ){

    requests =
      requests.filter(
        req => {

          const status =
            getDisplayStatus(
              req
            );

          return (
            status ===
            currentFilter
          );

        }
      );

  }


  if(!requests.length){

    container.innerHTML = `

      <div class="empty">

        📭 No ${

          currentFilter === "all"
            ? ""
            : currentFilter + " "

        }

        lecture requests found.

      </div>

    `;

    return;

  }


  container.innerHTML =
    requests
      .map(
        renderRequestCard
      )
      .join("");

}


/* =====================================================
   REQUEST CARD
===================================================== */

function renderRequestCard(
  req
){

  const status =
    getDisplayStatus(
      req
    );


  const statusClass =
    status === "approved"
      ? "approved"
      : status === "disapproved"
      ? "disapproved"
      : "pending";


  const requester =
    req.requesterName
    ||
    req.requesterMentorId
    ||
    "Unknown";


  const target =
    req.targetName
    ||
    req.targetMentorId
    ||
    "Unknown";


  const time =

    `${escapeHtml(
      req.startTime ||
      req.oldLecture?.startTime ||
      "-"
    )} - ${escapeHtml(
      req.endTime ||
      req.oldLecture?.endTime ||
      "-"
    )}`;


  let actions = "";


  /* ---------------------------------------------
     TARGET MENTOR ACTIONS
  --------------------------------------------- */

  if(
    status === "pending"
    &&
    req.canApprove
  ){

    actions += `

      <button
        class="approve"
        onclick="approveRequest('${req._id}')"
      >
        ✅ Approve
      </button>

    `;


    actions += `

      <button
        class="reject"
        onclick="rejectRequest('${req._id}')"
      >
        ❌ Disapprove
      </button>

    `;

  }


  /* ---------------------------------------------
     REQUESTER ACTIONS
  --------------------------------------------- */

  if(
    status === "approved"
    &&
    req.canEdit
    &&
    !req.lectureRemoved
  ){

    actions += `

      <button
        class="edit"
        onclick="openEditModal('${req._id}')"
      >
        ✏️ Edit The Lecture Now
      </button>

    `;

  }


  if(
    status === "approved"
    &&
    req.canRemove
    &&
    !req.lectureRemoved
  ){

    actions += `

      <button
        class="remove"
        onclick="removeLecture('${req._id}')"
      >
        🗑 Remove Lecture
      </button>

    `;

  }


  let approvedInfo = "";


  if(status === "approved"){

    approvedInfo = `

      <div>

        <strong>
          Lecture Time
        </strong>

        <div class="time">

          ${time}

          <span class="lock">
            🔒 Locked
          </span>

        </div>

      </div>

    `;

  }


  if(req.lectureRemoved){

    approvedInfo += `

      <div
        style="
          margin-top:10px;
          color:#c0392b;
          font-weight:bold;
        "
      >

        🗑 Lecture Removed

      </div>

    `;

  }


  return `

    <div class="card">

      <div class="top">

        <div class="title">

          ${escapeHtml(
            req.className ||
            req.existingClass ||
            "Lecture Request"
          )}

        </div>


        <span
          class="status ${statusClass}"
        >

          ${status}

        </span>

      </div>


      <div class="info">

        <div>

          <strong>
            Day:
          </strong>

          ${escapeHtml(
            req.day || "-"
          )}

        </div>


        ${approvedInfo}


        <div>

          <strong>
            Requested By:
          </strong>

          ${escapeHtml(
            requester
          )}

        </div>


        <div>

          <strong>
            Designated Faculty:
          </strong>

          ${escapeHtml(
            target
          )}

        </div>


        <div>

          <strong>
            Subject:
          </strong>

          ${escapeHtml(
            req.subject ||
            req.oldLecture?.subject ||
            "-"
          )}

        </div>


      </div>


      ${
        actions
          ? `
            <div class="actions">
              ${actions}
            </div>
          `
          : ""
      }

    </div>

  `;

}


/* =====================================================
   STATUS
===================================================== */

function getDisplayStatus(
  req
){

  const status =
    String(
      req.displayStatus ||
      req.status ||
      "pending"
    )
    .toLowerCase()
    .trim();


  if(
    status === "rejected"
  ){

    return "disapproved";

  }


  return status;

}


/* =====================================================
   APPROVE
===================================================== */

async function approveRequest(
  requestId
){

  if(
    !confirm(
      "Approve this lecture request?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(

        `${API_BASE}/lecture-request/approve`,

        {

          method:
            "PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              requestId,

              mentorId

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Approval failed."
      );

    }


    showMessage(
      "Request approved. Timetable is unchanged until the requester edits and saves the lecture.",
      "success"
    );


    await loadRequests();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =====================================================
   DISAPPROVE
===================================================== */

async function rejectRequest(
  requestId
){

  if(
    !confirm(
      "Disapprove this lecture request?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(

        `${API_BASE}/lecture-request/reject`,

        {

          method:
            "PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              requestId,

              mentorId

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Disapproval failed."
      );

    }


    showMessage(
      "Lecture request disapproved.",
      "success"
    );


    await loadRequests();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =====================================================
   OPEN EDIT MODAL
===================================================== */

function openEditModal(
  requestId
){

  const req =
    allRequests.find(
      item =>
        String(
          item._id
        ) === String(
          requestId
        )
    );


  if(!req){

    showMessage(
      "Request not found.",
      "error"
    );

    return;

  }


  if(
    !req.canEdit
  ){

    showMessage(
      "You cannot edit this lecture.",
      "error"
    );

    return;

  }


  editingRequest =
    req;


  const lecture =
    req.appliedLecture
    ||
    req.oldLecture
    ||
    {};


  /*
    TIME IS LOCKED
  */

  document.getElementById(
    "editTime"
  ).value =

    `${lecture.startTime || req.startTime || "-"} - ${
      lecture.endTime || req.endTime || "-"
    }`;


  document.getElementById(
    "editSubject"
  ).value =

    lecture.subject
    ||
    req.subject
    ||
    "";


  /*
    Current faculty
  */

  const currentFaculty =
    lecture.faculty?.[0];


  selectedFacultyId =

    currentFaculty?.mentorId
    ||
    lecture.facultyIds?.[0]
    ||
    req.targetMentorId
    ||
    "";


  selectedFacultyName =

    currentFaculty?.name
    ||
    req.targetName
    ||
    selectedFacultyId;


  document.getElementById(
    "selectedFaculty"
  ).value =
    selectedFacultyName;


  document.getElementById(
    "facultySearch"
  ).value =
    "";


  document.getElementById(
    "mentorResults"
  ).style.display =
    "none";


  document.getElementById(
    "editModal"
  ).classList.add(
    "show"
  );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeEditModal(){

  editingRequest =
    null;

  selectedFacultyId =
    "";

  selectedFacultyName =
    "";

  document.getElementById(
    "editModal"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   FACULTY SEARCH
===================================================== */

let searchTimer = null;


document.getElementById(
  "facultySearch"
)
.addEventListener(
  "input",
  function(){

    const query =
      this.value.trim();


    clearTimeout(
      searchTimer
    );


    if(query.length < 2){

      document.getElementById(
        "mentorResults"
      ).style.display =
        "none";

      return;

    }


    searchTimer =
      setTimeout(
        () =>
          searchMentors(query),
        300
      );

  }
);


/* =====================================================
   SEARCH MENTORS
===================================================== */

async function searchMentors(
  query
){

  try{

    const response =
      await fetch(

        `${API_BASE}/mentor/search?q=${encodeURIComponent(query)}`

      );


    const data =
      await response.json();


    const box =
      document.getElementById(
        "mentorResults"
      );


    if(
      !data.success ||
      !Array.isArray(
        data.mentors
      )
    ){

      box.style.display =
        "none";

      return;

    }


    if(!data.mentors.length){

      box.innerHTML = `

        <div
          style="
            padding:10px;
            color:#888;
          "
        >
          No faculty found.
        </div>

      `;

      box.style.display =
        "block";

      return;

    }


    box.innerHTML =
      data.mentors
        .map(
          mentor => `

            <div
              class="mentor"
              onclick="
                selectFaculty(
                  '${escapeJs(
                    mentor.mentorId
                  )}',
                  '${escapeJs(
                    mentor.name
                  )}'
                )
              "
            >

              <strong>
                ${escapeHtml(
                  mentor.name
                )}
              </strong>

              <br>

              <small>

                ${escapeHtml(
                  mentor.mentorId
                )}

                ${
                  mentor.subject
                    ? " • " +
                      escapeHtml(
                        mentor.subject
                      )
                    : ""
                }

              </small>

            </div>

          `
        )
        .join("");


    box.style.display =
      "block";


  }catch(error){

    console.error(
      "Faculty search error:",
      error
    );

  }

}


/* =====================================================
   SELECT FACULTY
===================================================== */

function selectFaculty(
  id,
  name
){

  selectedFacultyId =
    id;


  selectedFacultyName =
    name;


  document.getElementById(
    "selectedFaculty"
  ).value =
    name;


  document.getElementById(
    "facultySearch"
  ).value =
    "";


  document.getElementById(
    "mentorResults"
  ).style.display =
    "none";

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveLectureEdit(){

  if(!editingRequest){

    return;

  }


  const subject =
    document.getElementById(
      "editSubject"
    ).value.trim();


  if(!selectedFacultyId){

    showMessage(
      "Please select a faculty.",
      "error"
    );

    return;

  }


  if(!subject){

    showMessage(
      "Please enter subject.",
      "error"
    );

    return;

  }


  try{

    const response =
      await fetch(

        `${API_BASE}/lecture-request/edit`,

        {

          method:
            "PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              requestId:
                editingRequest._id,

              mentorId,

              facultyIds:[
                selectedFacultyId
              ],

              subject

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      if(
        data.conflict
      ){

        throw new Error(
          "Selected faculty is already occupied during this locked lecture time."
        );

      }


      throw new Error(
        data.message ||
        "Lecture update failed."
      );

    }


    closeEditModal();


    showMessage(
      "✅ Lecture updated successfully on the timetable.",
      "success"
    );


    await loadRequests();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =====================================================
   REMOVE LECTURE
===================================================== */

async function removeLecture(
  requestId
){

  if(
    !confirm(
      "Are you sure you want to remove this lecture from the timetable?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(

        `${API_BASE}/lecture-request/remove`,

        {

          method:
            "DELETE",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              requestId,

              mentorId

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Unable to remove lecture."
      );

    }


    showMessage(
      "🗑 Lecture removed successfully.",
      "success"
    );


    await loadRequests();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    `message ${type}`;


  setTimeout(
    () => {

      box.className =
        "message";

    },
    5000
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadRequests();

</script>
