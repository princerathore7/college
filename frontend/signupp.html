<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#001f4d,#003c8f,#005bea);display:flex;justify-content:center;align-items:center;padding:30px}
.signup-box{width:100%;max-width:500px;background:#fff;border-radius:22px;padding:35px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.logo{width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:auto auto 18px;border:4px solid #0b57d0}
h1{text-align:center;color:#002b6b;margin-bottom:8px}
.subtext{text-align:center;color:#666;margin-bottom:28px}
.input-group{margin-bottom:18px}
label{display:block;margin-bottom:8px;color:#002b6b;font-weight:600}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #dfe7ff}
.otp-row{display:flex;gap:10px;margin-top:10px}
.otp-row input{flex:1}
.otp-btn,.main-btn{border:none;background:#0b57d0;color:#fff;border-radius:10px;cursor:pointer}
.otp-btn{padding:12px 16px}
.main-btn{width:100%;padding:15px;margin-top:20px}
.success{color:green}.error{color:red}
</style>
</head>
<body>
<div class="signup-box">
<img src="logop.png" class="logo">
<h1>Student Signup</h1>
<p class="subtext">Create your student account securely</p>

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name">
</div>
<div class="input-group">
<label>Enrollment Number</label>
<input type="text" id="enrollment" required>
</div>

<div class="input-group">
<label>Year</label>
<select id="year" required>
<option value="">Select Year</option>
<option value="1st Year">1st Year</option>
<option value="2nd Year">2nd Year</option>
<option value="3rd Year">3rd Year</option>
<option value="4th Year">4th Year</option>
</select>
</div>

<div class="input-group">
<label>Branch</label>
<select id="branch" required>
<option value="">Select Branch</option>
<option value="IT">IT</option>
<option value="CSE">CSE</option>
<option value="AIDS">AIDS</option>
<option value="CSD">CSD</option>
<option value="CSIT">CSIT</option>
<option value="ME">ME</option>
<option value="CE">CE</option>
</select>
</div>

<div class="input-group">
<label>Section</label>
<select id="section" required>
<option value="">Select Section</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>
</div>


<div class="input-group">
<label>Email Address</label>
<input type="email" id="email">
<div class="otp-row">
    <input type="text" id="emailOtp" placeholder="Enter Email OTP">
    <button class="otp-btn" id="emailOtpBtn" onclick="sendEmailOTP()">Send OTP</button>
</div>
<button class="otp-btn" style="margin-top:10px;width:100%" onclick="verifyEmailOTP()">Verify Email OTP</button>
<div id="emailStatus"></div>
</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="text" id="phone" placeholder="+919876543210">
<div class="otp-row">
    <input type="text" id="phoneOtp" placeholder="Enter Mobile OTP">
    <button class="otp-btn" id="phoneOtpBtn" onclick="sendPhoneOTP()">Send OTP</button>
</div>
<button class="otp-btn" style="margin-top:10px;width:100%" onclick="verifyPhoneOTP()">Verify Mobile OTP</button>
<div id="phoneStatus"></div>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password">
</div>
<div class="input-group">
<label>Re-enter Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button class="main-btn" onclick="signup()">Create Account</button>
</div>

<script>
    const API_BASE = "https://college-hwbb.onrender.com";
window.emailVerified=false;
window.phoneVerified=false;
window.generatedEmailOTP="";
// ✅ NEW: Timer Function
function startOtpTimer(buttonId, durationInSeconds) {
    const btn = document.getElementById(buttonId);
    btn.disabled = true;
    let time = durationInSeconds;
    
    // Original button background store kar lo taaki disable hone pe color change dikhe
    btn.style.backgroundColor = "#cccccc"; 
    btn.style.cursor = "not-allowed";

    const timer = setInterval(() => {
        let minutes = Math.floor(time / 60);
        let seconds = time % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        btn.innerText = `Wait ${minutes}:${seconds}`;
        time--;

        if (time < 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = "Resend OTP";
            btn.style.backgroundColor = "#0b57d0";
            btn.style.cursor = "pointer";
        }
    }, 1000);
}
async function sendPhoneOTP() {
    const phone = document.getElementById("phone").value.trim();
    if (!phone) {
        alert("Enter Mobile Number First");
        return;
    }

    // 1. Check if phone is unique
    const checkRes = await fetch(`${API_BASE}/api/students/check-unique`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone })
    });
    const checkData = await checkRes.json();

    if (!checkData.success) {
        document.getElementById("phoneStatus").innerHTML = `<div class="error">${checkData.message}</div>`;
        return; // Stop here if duplicate
    }

    // 2. Start 5 Minutes (300 seconds) Timer
    startOtpTimer("phoneOtpBtn", 300);

    // 3. Send OTP
    const response = await fetch(`${API_BASE}/send-phone-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
    });
    const data = await response.json();
    document.getElementById("phoneStatus").innerHTML = data.success ?
        '<div class="success">OTP Sent Successfully</div>' :
        '<div class="error">' + (data.message || 'Failed') + '</div>';
}
async function verifyPhoneOTP(){
 const phone=document.getElementById("phone").value.trim();
 const otp=document.getElementById("phoneOtp").value.trim();
 const response=await fetch(
   `${API_BASE}/verify-phone-otp`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({phone,otp})
 });
 const data=await response.json();
 if(data.success){
   window.phoneVerified=true;
   document.getElementById("phoneStatus").innerHTML='<div class="success">Mobile Number Verified</div>';
 }else{
   document.getElementById("phoneStatus").innerHTML='<div class="error">Invalid Mobile OTP</div>';
 }
}

async function sendEmailOTP() {



const email = document.getElementById("email").value.trim();



if (!email) {

alert("Enter Email Address First");

return;

}



// 6 digit OTP

window.generatedEmailOTP =

Math.floor(100000 + Math.random() * 900000).toString();



try {



const response = await fetch(

`${API_BASE}/send-email`,

{

method: "POST",

headers: {

"Content-Type": "application/json"

},

body: JSON.stringify({

email: email,

subject: "Email Verification OTP",

html: `

<div style="font-family:Poppins,sans-serif">

<h2>Acropolis Campus Verification</h2>

<p>Your OTP is:</p>

<h1>${window.generatedEmailOTP}</h1>

<p>Do not share this OTP with anyone.</p>

</div>

`

})

}

);



const data = await response.json();



if (data.success) {



document.getElementById("emailStatus").innerHTML =

'<div class="success">OTP Sent To Email</div>';



} else {



document.getElementById("emailStatus").innerHTML =

'<div class="error">Failed To Send Email OTP</div>';



}



} catch (err) {



console.error(err);



document.getElementById("emailStatus").innerHTML =

'<div class="error">Email Service Error</div>';



}

}


function verifyEmailOTP() {

    const enteredOTP =
        document.getElementById("emailOtp").value.trim();

    if (enteredOTP === window.generatedEmailOTP) {

        window.emailVerified = true;

        document.getElementById("emailStatus").innerHTML =
            '<div class="success">Email Verified Successfully</div>';

    } else {

        window.emailVerified = false;

        document.getElementById("emailStatus").innerHTML =
            '<div class="error">Invalid Email OTP</div>';

    }
}
async function signup(){

    if(!window.emailVerified){
        alert("Verify Email First");
        return;
    }

    if(!window.phoneVerified){
        alert("Verify Mobile Number First");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const enrollment = document.getElementById("enrollment").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const year = document.getElementById("year").value;
    const branch = document.getElementById("branch").value;
    const section = document.getElementById("section").value;

    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(
        !name ||
        !enrollment ||
        !email ||
        !phone ||
        !year ||
        !branch ||
        !section ||
        !password
    ){
        alert("Please fill all fields");
        return;
    }

    if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
    }

    try{

        const response = await fetch(
            `${API_BASE}/api/students/signup`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    name:name,
                    enrollment:enrollment,
                    password:password,
                    email:email,
                    phone:phone,

                    // Branch field me year + section combine
                    // kyunki backend get_collection_name()
                    // branch field hi use kar raha hai

                    branch:`${year}-${branch}-${section}`,

                    year:year,
                    section:section
                })
            }
        );

        const data = await response.json();

        if(data.success){

            alert("Signup Successful");

            window.location.href =
                "student-login.html";

        }else{

            alert(data.message || "Signup Failed");

        }

    }catch(err){

        console.error(err);

        alert("Server Error");

    }
}
</script>
</body>
</html>
