<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Bus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f1f5f9;
  height:100vh;
  overflow:hidden;
}

#map { height:100vh; width:100vw; }

.top-controls{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1500;
  display:flex;
  gap:6px;
}

button,input{
  padding:8px;
  border:none;
  border-radius:6px;
  font-size:14px;
}

button{ cursor:pointer; background:#2563eb; color:white; }

.sidebar{
  position:absolute;
  top:0;
  left:0;
  width:250px;
  height:100%;
  background:#0f172a;
  color:white;
  padding:10px;
  overflow:auto;
  z-index:1400;
}

.bus-item{
  background:#1e293b;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  cursor:pointer;
}

.bus-item.active{ background:#2563eb; }

.info{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:white;
  padding:8px 14px;
  border-radius:20px;
  z-index:1500;
}
</style>
</head>

<body>

<div class="top-controls">
  <button onclick="refreshNow()">🔄 Refresh</button>
  <button onclick="getMyLocation()">📍 My Location</button>
  <input id="searchBox" placeholder="Search location">
  <button onclick="searchLocation()">🔍</button>
</div>

<div class="sidebar">
<h3>🚌 Buses</h3>
<div id="busList">Loading...</div>
</div>

<div id="map"></div>
<div class="info" id="info">Ready</div>

<script>
const BASE_URL="https://college-hwbb.onrender.com";
let selectedBus=null;
let prevPos=null;
let prevTime=null;
let interval;
let studentMarker=null;
let searchMarker=null;

const map=L.map("map").setView([23.2599,77.4126],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const busMarker=L.marker([0,0]).addTo(map);

function showInfo(t){
 document.getElementById("info").innerText=t;
}

/* -------- Distance helper -------- */
function distance(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* -------- Smooth animation -------- */
function smoothMove(from,to){
 let steps=20;
 let i=0;
 const latStep=(to[0]-from[0])/steps;
 const lngStep=(to[1]-from[1])/steps;

 const anim=setInterval(()=>{
   i++;
   busMarker.setLatLng([
     from[0]+latStep*i,
     from[1]+lngStep*i
   ]);
   if(i>=steps) clearInterval(anim);
 },50);
}

/* -------- Load buses -------- */
async function loadBuses(){
 const res=await fetch(`${BASE_URL}/api/bus/list`);
 const buses=await res.json();
 const box=document.getElementById("busList");
 box.innerHTML="";

 buses.forEach(b=>{
   const d=document.createElement("div");
   d.className="bus-item";
   d.innerText=b.busId;
   d.onclick=()=>selectBus(b.busId,d);
   box.appendChild(d);
 });
}

/* -------- Select bus -------- */
function selectBus(id,el){
 selectedBus=id;
 document.querySelectorAll(".bus-item").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");

 fetchLocation();
 clearInterval(interval);
 interval=setInterval(fetchLocation,5000);
}

/* -------- Fetch bus -------- */
async function fetchLocation(){
 if(!selectedBus) return;

 const r=await fetch(`${BASE_URL}/api/bus/location/${selectedBus}`);
 const d=await r.json();

 if(!d.lat) return;

 const newPos=[d.lat,d.lng];

 if(prevPos) smoothMove(prevPos,newPos);
 else busMarker.setLatLng(newPos);

 map.panTo(newPos);

 /* speed calc */
 if(prevPos){
   const dist=distance(prevPos[0],prevPos[1],newPos[0],newPos[1]);
   const now=Date.now();
   const speed=(dist/((now-prevTime)/3600000));
   showInfo(`Speed: ${speed.toFixed(1)} km/h`);

   if(searchMarker){
     const s=searchMarker.getLatLng();
     const d2=distance(newPos[0],newPos[1],s.lat,s.lng);
     const eta=(d2/speed)*60;
     showInfo(`ETA: ${eta.toFixed(1)} min`);
   }

   if(studentMarker){
     const st=studentMarker.getLatLng();
     const d3=distance(newPos[0],newPos[1],st.lat,st.lng);
     showInfo(`Distance to bus: ${d3.toFixed(2)} km`);
   }
 }

 prevPos=newPos;
 prevTime=Date.now();
}

/* -------- Refresh -------- */
function refreshNow(){
 fetchLocation();
 showInfo("Live location refreshed");
}

/* -------- My location -------- */
function getMyLocation(){
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude;
   const lng=pos.coords.longitude;

   if(studentMarker) map.removeLayer(studentMarker);
   studentMarker=L.marker([lat,lng]).addTo(map);

   showInfo("Student location detected");
 });
}

/* -------- Search -------- */
async function searchLocation(){
 const q=document.getElementById("searchBox").value;
 if(!q) return;

 const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
 const d=await r.json();

 if(!d.length) return;

 const lat=parseFloat(d[0].lat);
 const lng=parseFloat(d[0].lon);

 if(searchMarker) map.removeLayer(searchMarker);
 searchMarker=L.marker([lat,lng]).addTo(map);

 map.setView([lat,lng],14);
 showInfo("Location selected");
}

loadBuses();
</script>

</body>
</html>
