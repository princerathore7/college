<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Bus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f1f5f9;
  height:100vh;
  overflow:hidden;
}

#map{height:100vh;width:100vw;}

.menu-btn{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1600;
  background:#2563eb;
  color:#fff;
  border:none;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.refresh-btn{
  position:absolute;
  top:55px;
  left:10px;
  z-index:1600;
  background:#16a34a;
  color:#fff;
  border:none;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.my-btn{
  position:absolute;
  top:100px;
  left:10px;
  z-index:1600;
  background:#0ea5e9;
  color:#fff;
  border:none;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.sidebar{
  position:absolute;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#0f172a;
  color:white;
  padding:10px;
  overflow:auto;
  z-index:1500;
  transition:0.3s;
}

.sidebar.open{
  left:0;
}

.bus-item{
  background:#1e293b;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  cursor:pointer;
}

.bus-item.active{background:#2563eb;}

.info{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:white;
  padding:8px 14px;
  border-radius:20px;
  z-index:1500;
}
</style>
</head>

<body>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<button class="refresh-btn" onclick="refreshNow()">⟳</button>
<button class="my-btn" onclick="getMyLocation()">📍</button>

<div class="sidebar" id="sidebar">
<h3>🚌 Buses</h3>
<div id="busList">Loading...</div>
</div>

<div id="map"></div>
<div class="info" id="info">Ready</div>

<script>
const BASE_URL="https://college-hwbb.onrender.com";
let selectedBus=null;
let prevPos=null;
let prevTime=null;
let interval;
let studentMarker=null;
let accuracyCircle=null;

const map=L.map("map").setView([23.2599,77.4126],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const busMarker=L.marker([0,0]).addTo(map);

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

map.on("click",()=>{
  document.getElementById("sidebar").classList.remove("open");
});

function showInfo(t){
 document.getElementById("info").innerText=t;
}

function distance(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function smoothMove(from,to){
 let steps=20;
 let i=0;
 const latStep=(to[0]-from[0])/steps;
 const lngStep=(to[1]-from[1])/steps;

 const anim=setInterval(()=>{
   i++;
   busMarker.setLatLng([
     from[0]+latStep*i,
     from[1]+lngStep*i
   ]);
   if(i>=steps) clearInterval(anim);
 },50);
}

async function loadBuses(){
 const res=await fetch(`${BASE_URL}/api/bus/list`);
 const buses=await res.json();
 const box=document.getElementById("busList");
 box.innerHTML="";

 buses.forEach(b=>{
   const d=document.createElement("div");
   d.className="bus-item";
   d.innerText=b.busId;
   d.onclick=()=>selectBus(b.busId,d);
   box.appendChild(d);
 });
}

function selectBus(id,el){
 selectedBus=id;
 document.querySelectorAll(".bus-item").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");

 fetchLocation();
 clearInterval(interval);
 interval=setInterval(fetchLocation,5000);

 document.getElementById("sidebar").classList.remove("open");
}

async function fetchLocation(){
 if(!selectedBus) return;

 const r=await fetch(`${BASE_URL}/api/bus/location/${selectedBus}`);
 const d=await r.json();

 if(!d.lat) return;

 const newPos=[d.lat,d.lng];

 if(prevPos) smoothMove(prevPos,newPos);
 else busMarker.setLatLng(newPos);

 map.panTo(newPos);

 if(prevPos){
   const dist=distance(prevPos[0],prevPos[1],newPos[0],newPos[1]);
   const now=Date.now();
   const speed=(dist/((now-prevTime)/3600000));
   showInfo(`Speed: ${speed.toFixed(1)} km/h`);
 }

 prevPos=newPos;
 prevTime=Date.now();
}

function refreshNow(){
 fetchLocation();
 showInfo("Live location refreshed");
}

function getMyLocation(){
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude;
   const lng=pos.coords.longitude;
   const accuracy=pos.coords.accuracy;

   if(studentMarker) map.removeLayer(studentMarker);
   if(accuracyCircle) map.removeLayer(accuracyCircle);

   studentMarker=L.circleMarker([lat,lng],{
     radius:8,
     color:"#2563eb",
     fillColor:"#3b82f6",
     fillOpacity:1
   }).addTo(map);

   accuracyCircle=L.circle([lat,lng],{
     radius:accuracy,
     color:"#3b82f6",
     fillColor:"#3b82f6",
     fillOpacity:0.2
   }).addTo(map);

   map.setView([lat,lng],15);
 });
}

loadBuses();
</script>

</body>
</html>
