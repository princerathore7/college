<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;padding:15px}
h2{color:#0b1f3a}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 6px 15px rgba(0,0,0,.08)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
select,input{padding:8px;border-radius:6px;border:1px solid #ccc}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#0b1f3a;color:#fff}
button{padding:6px 10px;border:none;border-radius:5px;cursor:pointer}
.p{background:#2ecc71;color:#fff}
.a{background:#e74c3c;color:#fff}
.selected{outline:3px solid #000}
.no-data{text-align:center;color:#888}
</style>
</head>

<body>

<h2>📊 Attendance Engine</h2>

<div class="card">

<div class="controls">
  <select id="year">
    <option value="">All Years</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
  </select>

  <select id="branch">
    <option value="">All Branches</option>
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="AIML">AIML</option>
  </select>

  <select id="section">
    <option value="">All Sections</option>
    <option value="1">Section 1</option>
    <option value="2">Section 2</option>
    <option value="3">Section 3</option>
  </select>

  <input id="lectureId" placeholder="Lecture ID">
  <button onclick="submitAttendance()">🚀 Submit</button>
</div>

<table>
<thead>
<tr>
  <th>Enrollment</th>
  <th>Name</th>
  <th>Year</th>
  <th>Branch</th>
  <th>Section</th>
  <th>P</th>
  <th>A</th>
</tr>
</thead>
<tbody id="studentsBody">
<tr><td colspan="7" class="no-data">Loading...</td></tr>
</tbody>
</table>

</div>

<script>
const API_STUDENTS = "https://college-hwbb.onrender.com/api/admin/students";
const API_ROBOT = "https://college-hwbb.onrender.com/api/attendance/robot_update";

let STUDENTS = [];
let RECORDS = {};

/* ===============================
   FETCH STUDENTS
================================ */
async function fetchStudents(){
  const res = await fetch(API_STUDENTS);
  const d = await res.json();
  if(d.success){
    STUDENTS = d.students;
    render();
  }
}

/* ===============================
   RENDER
================================ */
function render(){
  const body = document.getElementById("studentsBody");
  const y = document.getElementById("year").value;
  const b = document.getElementById("branch").value;
  const s = document.getElementById("section").value;

  const filtered = STUDENTS.filter(st =>
    (!y || st.year === y) &&
    (!b || st.branch === b) &&
    (!s || st.section === s)
  );

  body.innerHTML = "";
  if(!filtered.length){
    body.innerHTML = `<tr><td colspan="7" class="no-data">No students found</td></tr>`;
    return;
  }

  filtered.forEach(st=>{
    body.innerHTML += `
      <tr>
        <td>${st.enrollment}</td>
        <td>${st.name}</td>
        <td>${st.year}</td>
        <td>${st.branch}</td>
        <td>${st.section}</td>
        <td><button class="p" onclick="mark('${st.enrollment}','P',this)">P</button></td>
        <td><button class="a" onclick="mark('${st.enrollment}','A',this)">A</button></td>
      </tr>`;
  });
}

function mark(enr,status,btn){
  RECORDS[enr]=status;
  btn.closest("tr").querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
}

async function submitAttendance(){
  const lectureId = lectureId.value.trim();
  if(!lectureId) return alert("Lecture ID required");
  if(!Object.keys(RECORDS).length) return alert("No attendance marked");

  await fetch(API_ROBOT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({lectureId,records:RECORDS})
  });

  alert("✅ Attendance submitted");
  RECORDS = {};
  document.querySelectorAll(".selected").forEach(b=>b.classList.remove("selected"));
}

["year","branch","section"].forEach(id=>{
  document.getElementById(id).addEventListener("change",render);
});

fetchStudents();
</script>
</body>
</html>
