<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance (Robot Auto)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;padding:20px}
h2{margin-bottom:10px}
.controls{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#0b1f3a;color:#fff}
button{padding:6px 10px;cursor:pointer}
.p{background:#2ecc71;color:#fff}
.a{background:#e74c3c;color:#fff}
.selected{outline:3px solid #000}
.saveBtn{background:#0b1f3a;color:#fff}
.no-data{text-align:center;color:#888}
</style>
</head>

<body>

<h2>Attendace Engine</h2>

<div class="controls">
  <select id="year">
    <option value="">All Years</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
  </select>

  <select id="branch">
    <option value="">Select Branch</option>
    <option value="CSE1">CSE1</option>
    <option value="CSE2">CSE2</option>
    <option value="CSE3">CSE3</option>
    <option value="CSE4">CSE4</option>
  </select>

  <input id="lectureId" placeholder="Lecture ID (required)">
  <button class="saveBtn" onclick="submitAttendance()">🚀 Submit</button>
</div>

<table>
<thead>
<tr>
  <th>Enrollment</th>
  <th>Name</th>
  <th>Class</th>
  <th>Present</th>
  <th>Absent</th>
</tr>
</thead>
<tbody id="studentsBody"></tbody>
</table>

<script>
/* ===============================
   ACCESS CONTROL
================================ */
const mentorId = localStorage.getItem("mentorId");
const source   = sessionStorage.getItem("accessSource");
const ALLOWED_SOURCES = ["ad","admin"];

if(!mentorId || !ALLOWED_SOURCES.includes(source)){
  document.body.innerHTML = `
    <h2 style="text-align:center;margin-top:20vh;color:red">
      ❌ Access Denied
    </h2>`;
  throw new Error("Unauthorized");
}

/* ===============================
   HELPERS
================================ */
function formatClass(year, branch, section){
  if(!year || !branch) return "—";
  const yearText =
    year=="1" ? "1st" :
    year=="2" ? "2nd" :
    year=="3" ? "3rd" : "4th";
  return `${yearText} Year ${branch} ${section ?? ""}`.trim();
}

/* ===============================
   API CONFIG
================================ */
const API_STUDENTS = "https://college-hwbb.onrender.com/api/admin/students";
const API_ROBOT    = "https://college-hwbb.onrender.com/api/attendance/robot_update";

let STUDENTS = [];
let RECORDS = {}; // enrollment : P/A

/* ===============================
   FETCH STUDENTS
================================ */
async function fetchStudents(){
  const res = await fetch(API_STUDENTS);
  const d = await res.json();
  if(d.success){
    STUDENTS = d.students;
    render();
  }
}

/* ===============================
   RENDER TABLE
================================ */
function render(){
  const body   = document.getElementById("studentsBody");
  const year   = document.getElementById("year").value;
  const branch = document.getElementById("branch").value;

  body.innerHTML = "";

  const filtered = STUDENTS.filter(s =>
    (!year || String(s.year) === year) &&
    (!branch || s.branch === branch)
  );

  if(!filtered.length){
    body.innerHTML =
      `<tr><td colspan="5" class="no-data">No students found</td></tr>`;
    return;
  }

  filtered.forEach(s=>{
    const classText = formatClass(s.year, s.branch, s.section);

    body.innerHTML += `
      <tr>
        <td>${s.enrollment}</td>
        <td>${s.name}</td>
        <td><strong>${classText}</strong></td>
        <td>
          <button class="p" onclick="mark('${s.enrollment}','P',this)">P</button>
        </td>
        <td>
          <button class="a" onclick="mark('${s.enrollment}','A',this)">A</button>
        </td>
      </tr>
    `;
  });
}

/* ===============================
   MARK P / A
================================ */
function mark(enr,status,btn){
  RECORDS[enr] = status;

  const row = btn.parentElement.parentElement;
  row.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
}

/* ===============================
   SUBMIT → ROBOT
================================ */
async function submitAttendance(){
  const lectureId = document.getElementById("lectureId").value.trim();

  if(!lectureId) return alert("Lecture ID required");
  if(!Object.keys(RECORDS).length) return alert("No attendance marked");

  const res = await fetch(API_ROBOT,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ lectureId, records: RECORDS })
  });

  const d = await res.json();
  if(d.success){
    alert("✅ Robot processed: " + d.processed);
    RECORDS = {};
    document.querySelectorAll(".selected")
      .forEach(b=>b.classList.remove("selected"));
  }else{
    alert("❌ Robot failed");
  }
}

/* ===============================
   EVENTS
================================ */
["year","branch"].forEach(id=>{
  document.getElementById(id).addEventListener("change", render);
});

fetchStudents();
</script>

</body>
</html>
