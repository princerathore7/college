<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --navy:#0b1f3a;
  --green:#2ecc71;
  --red:#e74c3c;
  --bg:#f4f7fb;
  --card:#ffffff;
}

*{box-sizing:border-box}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  margin:0;
  padding:15px;
}

h2{
  margin:5px 0 15px;
  color:var(--navy);
}

/* ===============================
   CARD
================================ */
.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  box-shadow:0 6px 15px rgba(0,0,0,.08);
}

/* ===============================
   CONTROLS
================================ */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.controls select,
.controls input{
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  min-width:140px;
}

.saveBtn{
  background:var(--navy);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  cursor:pointer;
}

.saveBtn:hover{opacity:.9}

/* ===============================
   TABLE
================================ */
.table-wrap{
  position:relative;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}

th{
  background:var(--navy);
  color:#fff;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.p{background:var(--green);color:#fff}
.a{background:var(--red);color:#fff}

.selected{
  outline:3px solid #000;
}

.no-data{
  text-align:center;
  color:#888;
}

/* ===============================
   LOADER
================================ */
.loader{
  position:absolute;
  top:10px;
  right:10px;
  display:none;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#555;
}

.spinner{
  width:18px;
  height:18px;
  border:3px solid #ccc;
  border-top:3px solid var(--navy);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ===============================
   POPUP
================================ */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.popup-box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:320px;
  width:90%;
  text-align:center;
}

.popup-box h3{
  color:var(--green);
  margin-top:0;
}

.popup-box p{
  margin:6px 0;
}

.popup-box button{
  margin-top:10px;
  background:var(--navy);
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
}
.refreshBtn, .backBtn{
  background:#4f46e5; /* nice blue */
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  cursor:pointer;
  transition:opacity .2s;
}

.refreshBtn:hover, .backBtn:hover{
  opacity:.9;
}

.backBtn{
  background:#6b7280; /* gray for back */
}

/* ===============================
   RESPONSIVE
================================ */
@media(max-width:600px){
  th,td{font-size:12px}
}
</style>
</head>

<body>

<h2>📊 Attendance Engine</h2>

<div class="card">

  <div class="controls">
    <select id="year">
      <option value="">All Years</option>
      <option value="1">1st Year</option>
      <option value="2">2nd Year</option>
      <option value="3">3rd Year</option>
      <option value="4">4th Year</option>
    </select>

    <select id="branch">
      <option value="">Select Branch</option>
      <option value="CSE1">CSE1</option>
      <option value="CSE2">CSE2</option>
      <option value="CSE3">CSE3</option>
      <option value="CSE4">CSE4</option>
    </select>
 <div class="table-wrap">
    <div class="loader" id="loader">
      <div class="spinner"></div> Loading students...
    </div>

    <input id="lectureId" placeholder="Lecture ID (required)">
    <button class="saveBtn" onclick="submitAttendance()">🚀 Submit</button>
  </div>
  <button class="refreshBtn" onclick="refreshStudents()">🔄 Refresh</button>
  <button class="backBtn" onclick="goBack()">⬅ Back</button>
 
    <table>
      <thead>
        <tr>
          <th>Enrollment</th>
          <th>Name</th>
          <th>Class</th>
          <th>Present</th>
          <th>Absent</th>
        </tr>
      </thead>
      <tbody id="studentsBody"></tbody>
    </table>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h3>✅ Attendance Updated</h3>
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
/* ===============================
   ACCESS CONTROL
================================ */
const mentorId = localStorage.getItem("mentorId");
if(!mentorId){
  document.body.innerHTML =
    `<h2 style="text-align:center;margin-top:20vh;color:red">❌ Access Denied</h2>`;
  throw new Error("Unauthorized");
}

/* ===============================
   API
================================ */
const API_STUDENTS = "https://college-hwbb.onrender.com/api/admin/students";
const API_ROBOT   = "https://college-hwbb.onrender.com/api/attendance/robot_update";

let STUDENTS = [];
let RECORDS = {};

/* ===============================
   HELPERS
================================ */
function formatClass(year,branch,section){
  if(!year||!branch) return "—";
  const y = year=="1"?"1st":year=="2"?"2nd":year=="3"?"3rd":"4th";
  return `${y} Year ${branch} ${section||""}`.trim();
}

/* ===============================
   FETCH STUDENTS
================================ */
async function fetchStudents(){
  loader.style.display = "flex";

  try {
    const res = await fetch(API_STUDENTS + `?ts=${Date.now()}`); // prevent caching
    const d = await res.json();

    if(d.success){
      STUDENTS = d.students; // always fresh
      render(); // render fresh data
    }
  } catch(err){
    console.error(err);
    studentsBody.innerHTML = `<tr><td colspan="5" class="no-data">Error loading students</td></tr>`;
  } finally {
    loader.style.display = "none";
  }
}

/* ===============================
   RENDER
================================ */
function render(){
  const body = studentsBody;
  const year = yearSelect.value;
  const branch = branchSelect.value;

  body.innerHTML="";

  const filtered = STUDENTS.filter(s =>
    (!year || String(s.year)===year) &&
    (!branch || s.branch===branch)
  );

  if(!filtered.length){
    body.innerHTML =
      `<tr><td colspan="5" class="no-data">No students found</td></tr>`;
    return;
  }

  filtered.forEach(s=>{
    body.innerHTML += `
      <tr>
        <td>${s.enrollment}</td>
        <td>${s.name}</td>
        <td><strong>${formatClass(s.year,s.branch,s.section)}</strong></td>
        <td><button class="p" onclick="mark('${s.enrollment}','P',this)">P</button></td>
        <td><button class="a" onclick="mark('${s.enrollment}','A',this)">A</button></td>
      </tr>`;
  });
}
// 🔹 Refresh latest students from server
async function refreshStudents(){
  loader.style.display="flex";
  try {
    const res = await fetch(API_STUDENTS + `?ts=${Date.now()}`); // prevent caching
    const d = await res.json();
    if(d.success){
      STUDENTS = d.students;
      render(); // render fresh table
    } else {
      alert("❌ Failed to fetch students");
    }
  } catch(err){
    console.error(err);
    alert("❌ Network error while fetching students");
  } finally {
    loader.style.display="none";
  }
}

// 🔹 Go back to previous page
function goBack(){
  window.history.back();
}

/* ===============================
   MARK
================================ */
function mark(enr,status,btn){
  RECORDS[enr]=status;
  const row = btn.closest("tr");
  row.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
}
async function submitAttendance(){
  const lectureId = lectureIdInput.value.trim();
  if(!lectureId) return alert("Lecture ID required");
  if(!Object.keys(RECORDS).length) return alert("No attendance marked");

  // 🔹 Submit button animation
  const btn = document.querySelector(".saveBtn");
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Submitting...';
  btn.disabled = true;

  try {
    const res = await fetch(API_ROBOT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lectureId,records:RECORDS})
    });

    const d = await res.json();

    if(d.success){
      const total = Object.keys(RECORDS).length;
      const present = Object.values(RECORDS).filter(v=>v==="P").length;
      const absent = total - present;

      popupText.innerHTML = `
        👨‍🎓 Total Updated: <b>${total}</b><br>
        ✅ Present: <b>${present}</b><br>
        ❌ Absent: <b>${absent}</b>
      `;

      popup.style.display="flex";
      RECORDS={};
      document.querySelectorAll(".selected")
        .forEach(b=>b.classList.remove("selected"));
    } else {
      alert("❌ Attendance update failed");
    }
  } catch(err) {
    console.error(err);
    alert("❌ Network or server error");
  } finally {
    // 🔹 Reset button after submission
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}


function closePopup(){
  popup.style.display="none";
}

/* ===============================
   EVENTS
================================ */
const yearSelect = document.getElementById("year");
const branchSelect = document.getElementById("branch");
const lectureIdInput = document.getElementById("lectureId");
const loader = document.getElementById("loader");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");

yearSelect.onchange = render;
branchSelect.onchange = render;

fetchStudents();
</script>

</body>
</html>
