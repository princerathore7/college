<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --navy:#0b1f3a;
  --green:#2ecc71;
  --red:#e74c3c;
  --bg:#f4f7fb;
  --card:#ffffff;
}

*{box-sizing:border-box}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  margin:0;
  padding:15px;
}

h2{margin:5px 0 15px;color:var(--navy)}

.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  box-shadow:0 6px 15px rgba(0,0,0,.08);
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.controls select,.controls input{
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  min-width:140px;
}

.saveBtn{
  background:var(--navy);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  cursor:pointer;
}

.table-wrap{position:relative;overflow-x:auto}

table{width:100%;border-collapse:collapse;background:#fff}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}

th{background:var(--navy);color:#fff}

button{padding:6px 10px;border:none;border-radius:5px;cursor:pointer}

.p{background:var(--green);color:#fff}
.a{background:var(--red);color:#fff}

.selected{outline:3px solid #000}

.no-data{text-align:center;color:#888}
</style>
</head>

<body>

<h2>📊 Attendance Engine</h2>

<div class="card">

<div class="controls">
  <select id="year">
    <option value="">All Years</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
  </select>

  <select id="branch">
    <option value="">All Branches</option>
  </select>

  <select id="section">
    <option value="">All Sections</option>
  </select>

  <input id="lectureId" placeholder="Lecture ID">
  <button class="saveBtn" onclick="submitAttendance()">🚀 Submit</button>
</div>

<table>
<thead>
<tr>
  <th>Enrollment</th>
  <th>Name</th>
  <th>Class</th>
  <th>P</th>
  <th>A</th>
</tr>
</thead>
<tbody id="studentsBody"></tbody>
</table>

</div>

<script>
const API_STUDENTS = "https://college-hwbb.onrender.com/api/admin/students";
const API_ROBOT = "https://college-hwbb.onrender.com/api/attendance/robot_update";

let STUDENTS = [];
let RECORDS = {};

/* 🔹 ENROLLMENT PARSER */
function parseEnrollment(enr){
  enr = enr.toUpperCase();
  const year = enr[0];
  const section = enr[enr.length-1];
  const branch = enr.slice(1,-1);
  return {year,branch,section};
}

/* 🔹 FETCH STUDENTS */
async function fetchStudents(){
  const res = await fetch(API_STUDENTS);
  const d = await res.json();
  if(d.success){
    STUDENTS = d.students.map(s=>{
      const p = parseEnrollment(s.enrollment);
      return {...s,...p};
    });
    populateFilters();
    render();
  }
}

/* 🔹 POPULATE BRANCH + SECTION */
function populateFilters(){
  const branchSet = new Set();
  const sectionSet = new Set();

  STUDENTS.forEach(s=>{
    branchSet.add(s.branch);
    sectionSet.add(s.section);
  });

  branch.innerHTML = `<option value="">All Branches</option>`;
  section.innerHTML = `<option value="">All Sections</option>`;

  [...branchSet].sort().forEach(b=>{
    branch.innerHTML += `<option value="${b}">${b}</option>`;
  });

  [...sectionSet].sort().forEach(s=>{
    section.innerHTML += `<option value="${s}">${s}</option>`;
  });
}

/* 🔹 RENDER */
function render(){
  const y = year.value;
  const b = branch.value;
  const s = section.value;

  studentsBody.innerHTML="";

  const filtered = STUDENTS.filter(st =>
    (!y || st.year===y) &&
    (!b || st.branch===b) &&
    (!s || st.section===s)
  );

  if(!filtered.length){
    studentsBody.innerHTML =
      `<tr><td colspan="5" class="no-data">No students found</td></tr>`;
    return;
  }

  filtered.forEach(st=>{
    studentsBody.innerHTML += `
    <tr>
      <td>${st.enrollment}</td>
      <td>${st.name}</td>
      <td><b>${st.year} ${st.branch} ${st.section}</b></td>
      <td><button class="p" onclick="mark('${st.enrollment}','P',this)">P</button></td>
      <td><button class="a" onclick="mark('${st.enrollment}','A',this)">A</button></td>
    </tr>`;
  });
}

/* 🔹 MARK */
function mark(enr,status,btn){
  RECORDS[enr]=status;
  btn.closest("tr").querySelectorAll("button")
    .forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
}

/* 🔹 SUBMIT */
async function submitAttendance(){
  if(!lectureId.value) return alert("Lecture ID required");
  if(!Object.keys(RECORDS).length) return alert("No attendance marked");

  const res = await fetch(API_ROBOT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({lectureId:lectureId.value,records:RECORDS})
  });

  const d = await res.json();
  if(d.success){
    alert("✅ Attendance Updated");
    RECORDS={};
    document.querySelectorAll(".selected")
      .forEach(b=>b.classList.remove("selected"));
  } else {
    alert("❌ Failed");
  }
}

year.onchange = branch.onchange = section.onchange = render;
fetchStudents();
</script>

</body>
</html>
