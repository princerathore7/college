<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Acropolis Admin | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #ca8a04;
            --accent-hover: #eab308;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        .wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .logo-box {
            width: 40px; height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: grid; place-items: center;
            color: white;
        }

        .nav-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* Shutter / Accordion Styles */
        .nav-group {
            margin-bottom: 10px;
        }

        .group-title {
            width: 100%;
            padding: 12px 15px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .group-title:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        .group-content {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 4px;
            padding-left: 12px;
            margin-top: 5px;
        }

        .group-content.active {
            display: flex;
        }

        .nav-item {
            padding: 10px 15px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .nav-item i { width: 18px; }

        .nav-item:hover {
            background: #f1f5f9;
            color: var(--accent);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            height: 70px;
            background: white;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
        }

        .welcome-msg {
            font-size: 14px;
            color: var(--text-muted);
        }

        .welcome-msg span {
            color: var(--primary);
            font-weight: 700;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #e2e8f0;
            color: var(--text-main);
        }

        .btn-outline:hover { background: #f8fafc; }

        .btn-danger {
            background: #fee2e2;
            color: #ef4444;
            border: none;
        }

        .btn-danger:hover { background: #fecaca; }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-card {
            max-width: 500px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- OVERLAY IFRAME --- */
        .page-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .overlay-top {
            padding: 15px 25px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-overlay iframe {
            flex: 1;
            border: none;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 992px) {
            aside {
                position: absolute;
                left: -300px;
                height: 100%;
            }
            aside.open { left: 0; }
            .menu-toggle { display: block !important; }
        }

        .menu-toggle {
            display: none;
            background: none; border: none; cursor: pointer;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<div class="wrapper">
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo-box"><i data-lucide="shield-check"></i></div>
            <h2 style="font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px;">Acropolis Admin</h2>
        </div>

        <div class="nav-container">
            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('core')">
                    Student & Class <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content active" id="core">
                    <button class="nav-item" data-page="/admin-students.html"><i data-lucide="users"></i> Student Management</button>
                    <button class="nav-item" data-page="/admin.html"><i data-lucide="settings-2"></i> Class Control</button>
                    <button class="nav-item" data-page="/admin-marks.html"><i data-lucide="bar-chart-3"></i> Marks & Results</button>
                    <button class="nav-item" data-page="/exam-ring.html"><i data-lucide="pencil-ruler"></i> Examination Setup</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('att')">
                    Attendance Portal <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="att">
                    <button class="nav-item" data-page="/class-attendace.html"><i data-lucide="clipboard-check"></i> Attendance Records</button>
                    <button class="nav-item" data-page="/attendace-pdf-upload.html"><i data-lucide="file-up"></i> Upload Attendance PDF</button>
                    <button class="nav-item" data-page="/attendace-pdf-view.html"><i data-lucide="file-search"></i> View Attendance Data</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('acad')">
                    Academics <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="acad">
                    <button class="nav-item" data-page="/notes-post.html"><i data-lucide="book-open"></i> Upload Study Notes</button>
                    <button class="nav-item" data-page="/post-assignments.html"><i data-lucide="file-text"></i> Post Assignments</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('forms')">
                    Form Engine <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="forms">
                    <button class="nav-item" data-page="/form-creator.html"><i data-lucide="plus-square"></i> Create New Form</button>
                    <button class="nav-item" data-page="/form-submissions.html"><i data-lucide="list-checks"></i> View Submissions</button>
                    <button class="nav-item" data-page="/form-management.html"><i data-lucide="trash-2"></i> Delete/Manage Forms</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('bus')">
                    Transport System <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="bus">
                    <button class="nav-item" data-page="/bus-route.html"><i data-lucide="map-pin"></i> Transport Routes</button>
                    <button class="nav-item" data-page="/bus-admin.html"><i data-lucide="user-plus"></i> Create Driver ID</button>
                    <button class="nav-item" data-page="/bus-delet.html"><i data-lucide="truck"></i> Manage Bus IDs</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('finance')">
                    Finance & Staff <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="finance">
                    <button class="nav-item" data-page="/admin-salary.html"><i data-lucide="wallet"></i> Staff Salary</button>
                    <button class="nav-item" data-page="/pending.html"><i data-lucide="hourglass"></i> Pending Fees</button>
                    <button class="nav-item" data-page="/ewuhewbbewubewbeadmin-fine"><i data-lucide="credit-card"></i> Fines & Dues</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('comms')">
                    Communications <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="comms">
                    <button class="nav-item" data-page="/notice.html"><i data-lucide="megaphone"></i> Notice Board</button>
                    <button class="nav-item" data-page="/manage-notice.html"><i data-lucide="layout-list"></i> Manage Notices</button>
                    <button class="nav-item" data-page="/manage.html"><i data-lucide="calendar"></i> Event Management</button>
                    <button class="nav-item" data-page="/design.html"><i data-lucide="party-popper"></i> Post New Event</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-title" onclick="toggleGroup('ids')">
                    Account Access <i data-lucide="chevron-down"></i>
                </button>
                <div class="group-content" id="ids">
                    <button class="nav-item" data-page="/signup.html"><i data-lucide="user-plus-2"></i> Create Student ID</button>
                    <button class="nav-item" data-page="/mentor-signup.html"><i data-lucide="user-cog"></i> Create Mentor ID</button>
                </div>
            </div>
        </div>
    </aside>

    <main>
</div>

<div class="page-overlay" id="pageOverlay">
    <div class="overlay-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="btn btn-outline" style="background: white; color: black; border: none;" id="closeOverlay">
                <i data-lucide="arrow-left"></i> Back
            </button>
            <h3 id="overlayTitle" style="font-weight: 500;">Module</h3>
        </div>
        <i data-lucide="info" size="20"></i>
    </div>
    <iframe id="mainFrame"></iframe>
</div>

<script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle Shutter Groups
    function toggleGroup(id) {
        const content = document.getElementById(id);
        const icon = content.previousElementSibling.querySelector('.lucide-chevron-down');
        
        // Close others (Optional: comment out if you want multiple open)
        // document.querySelectorAll('.group-content').forEach(el => {
        //     if(el.id !== id) el.classList.remove('active');
        // });

        content.classList.toggle('active');
        icon.style.transform = content.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    // Toggle Sidebar Mobile
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Auth Check & UI
    const mentorId = localStorage.getItem("mentorId");
    const mentorName = localStorage.getItem("mentorName");
    
    if(!mentorId) {
        window.location.href = "/login.html";
    }
    if(mentorName) {
        document.getElementById('mentorNameDisplay').innerText = mentorName;
    }

    // Navigation Logic
    const overlay = document.getElementById('pageOverlay');
    const iframe = document.getElementById('mainFrame');
    const title = document.getElementById('overlayTitle');

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            const page = btn.getAttribute('data-page');
            const label = btn.innerText.trim();
            
            sessionStorage.setItem("accessSource", "ad");
            
            // Highlight active
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Open Iframe
            title.innerText = label;
            iframe.src = page;
            overlay.style.display = 'flex';
            
            // Close mobile sidebar if open
            document.getElementById('sidebar').classList.remove('open');
        };
    });

    document.getElementById('closeOverlay').onclick = () => {
        overlay.style.display = 'none';
        iframe.src = "";
    };

    // Logout
    document.getElementById('logoutBtn').onclick = () => {
        if(confirm("Sign out of the administration panel?")) {
            localStorage.clear();
            sessionStorage.clear();
            location.href = "/login.html";
        }
    };

    // Anti-Zoom
    document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
</script>

</body>
</html>
