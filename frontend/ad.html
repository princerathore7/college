<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Acropolis | Professional Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-body: #f1f5f9;
            --sidebar-width: 280px;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--primary);
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            height: 100vh;
        }

        /* --- SIDEBAR --- */
        aside {
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            font-size: 1.25rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        /* --- ACCORDION SYSTEM --- */
        .nav-group {
            margin-bottom: 5px;
        }

        .group-trigger {
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .group-trigger:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .group-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(0,0,0,0.2);
        }

        .group-content.open {
            max-height: 500px; /* Large enough to fit content */
        }

        .nav-item {
            width: 100%;
            padding: 10px 20px 10px 45px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            color: white;
            background: var(--accent);
        }

        .nav-item i { width: 18px; text-align: center; }

        /* --- TOP BAR --- */
        .top-bar {
            background: white;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: var(--card-shadow);
        }

        .welcome-msg { font-weight: 600; color: var(--secondary); }

        .top-actions { display: flex; gap: 10px; }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline { background: #f1f5f9; color: var(--secondary); }
        .btn-outline:hover { background: #e2e8f0; }
        .btn-danger { background: #fee2e2; color: #ef4444; }
        .btn-danger:hover { background: #fecaca; }

        /* --- MAIN CONTENT --- */
        main {
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-body);
        }

        .dashboard-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
        }

        /* --- OVERLAY IFRAME --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .overlay-header {
            padding: 15px 25px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        iframe { border: none; flex: 1; width: 100%; }

        /* Mobile */
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            aside { display: none; }
        }
    </style>
</head>

<body>

<div class="layout">
    <aside>
        <div class="sidebar-header">
            <i class="fas fa-university"></i> Acropolis Admin
        </div>
        
        <div class="nav-container">
            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-graduation-cap"></i> &nbsp; Academic Control</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/admin-students.html"><i class="fas fa-user-graduate"></i> Student Mgmt</button>
                    <button class="nav-item" data-page="/notes-post.html"><i class="fas fa-book-open"></i> Study Notes</button>
                    <button class="nav-item" data-page="/admin-marks.html"><i class="fas fa-chart-line"></i> Marks & Results</button>
                    <button class="nav-item" data-page="/admin.html"><i class="fas fa-chalkboard-teacher"></i> Class Control</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-calendar-check"></i> &nbsp; Attendance</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/class-attendace.html"><i class="fas fa-list"></i> Daily Records</button>
                    <button class="nav-item" data-page="/attendace-pdf-upload.html"><i class="fas fa-upload"></i> Upload PDF</button>
                    <button class="nav-item" data-page="/attendace-pdf-view.html"><i class="fas fa-file-pdf"></i> View Data</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-bus"></i> &nbsp; Transport</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/bus-route.html"><i class="fas fa-route"></i> Route Maps</button>
                    <button class="nav-item" data-page="/bus-admin.html"><i class="fas fa-user-plus"></i> Create Driver ID</button>
                    <button class="nav-item" data-page="/bus-delet.html"><i class="fas fa-tasks"></i> Manage Bus IDs</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-wpforms"></i> &nbsp; Forms & Notices</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/form-creator.html"><i class="fas fa-plus-circle"></i> Create Form</button>
                    <button class="nav-item" data-page="/form-submissions.html"><i class="fas fa-inbox"></i> Submissions</button>
                    <button class="nav-item" data-page="/form-management.html"><i class="fas fa-trash-alt"></i> Delete Form</button>
                    <button class="nav-item" data-page="/notice.html"><i class="fas fa-bullhorn"></i> Notice Board</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-wallet"></i> &nbsp; Accounts</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/admin-salary.html"><i class="fas fa-money-bill-wave"></i> Staff Salary</button>
                    <button class="nav-item" data-page="/pending.html"><i class="fas fa-clock"></i> Pending Fees</button>
                    <button class="nav-item" data-page="/ewuhewbbewubewbeadmin-fine"><i class="fas fa-exclamation-circle"></i> Fines</button>
                </div>
            </div>

            <div class="nav-group">
                <button class="group-trigger" onclick="toggleGroup(this)">
                    <span><i class="fas fa-id-badge"></i> &nbsp; ID Management</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="group-content">
                    <button class="nav-item" data-page="/signup.html"><i class="fas fa-user-plus"></i> Student ID</button>
                    <button class="nav-item" data-page="/mentor-signup.html"><i class="fas fa-user-shield"></i> Mentor ID</button>
                </div>
            </div>
        </div>
    </aside>

    <div class="content-wrapper">
        <div class="top-bar">
            <div class="welcome-msg" id="postedBy">Welcome, Admin</div>
            <div class="top-actions">
                <button class="btn btn-outline" onclick="location.href='/mentor-dashboard.html'">
                    <i class="fas fa-columns"></i> Dashboard
                </button>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <main>
            <div class="dashboard-card">
                <img src="https://i.ibb.co/8tZSKKT/logo-with-bg.webp" alt="Logo" style="width: 80px; margin-bottom: 20px;">
                <h2>Administrative Control Center</h2>
                <p style="color: var(--text-muted); margin-top: 10px;">Select a module from the sidebar to manage university operations.</p>
            </div>
        </main>
    </div>
</div>

<div class="overlay" id="pageOverlay">
    <div class="overlay-header">
        <h3 id="pageTitle" style="font-size: 1rem;">Module</h3>
        <button class="btn btn-danger" id="overlayBackBtn">Close <i class="fas fa-times"></i></button>
    </div>
    <iframe id="overlayFrame"></iframe>
</div>

<script>
    // --- ACCORDION LOGIC ---
    function toggleGroup(btn) {
        const content = btn.nextElementSibling;
        const icon = btn.querySelector('.fa-chevron-down');
        
        // Close other groups
        document.querySelectorAll('.group-content').forEach(el => {
            if(el !== content) el.classList.remove('open');
        });
        document.querySelectorAll('.fa-chevron-down').forEach(el => {
            if(el !== icon) el.style.transform = 'rotate(0deg)';
        });

        // Toggle current
        content.classList.toggle('open');
        icon.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    // --- NAVIGATION LOGIC ---
    const navItems = document.querySelectorAll(".nav-item");
    const overlay = document.getElementById("pageOverlay");
    const frame = document.getElementById("overlayFrame");
    const titleEl = document.getElementById("pageTitle");

    navItems.forEach(item => {
        item.onclick = () => {
            sessionStorage.setItem("accessSource", "ad");
            navItems.forEach(b => b.classList.remove("active"));
            item.classList.add("active");

            titleEl.textContent = item.innerText;
            frame.src = item.dataset.page;
            overlay.style.display = "flex";
        };
    });

    document.getElementById("overlayBackBtn").onclick = () => {
        overlay.style.display = "none";
        frame.src = "about:blank";
    };

    // --- ACCESS & LOGOUT ---
    const mentorId = localStorage.getItem("mentorId");
    const mentorName = localStorage.getItem("mentorName");
    
    if(!mentorId){
        window.location.href = "/login.html";
    }

    if(mentorName) {
        document.getElementById("postedBy").innerText = `Welcome, ${mentorName}`;
    }

    document.getElementById("logoutBtn").onclick = () => {
        if(confirm("Are you sure you want to logout?")){
            localStorage.clear();
            sessionStorage.clear();
            location.href = "/login.html";
        }
    };

    // Anti-Zoom
    document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
