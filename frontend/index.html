<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logop.png">
<title>Acropolis - Loading</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;800&display=swap" rel="stylesheet">

<style>
:root {
  --dark-blue: #2E3192;
  --light-blue: #00AEEF;
  --red: #ED1C24;
}

body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #fff;
  font-family: 'Open Sans', sans-serif;
  overflow: hidden;
}

.container {
  position: relative;
  width: 400px; /* Thoda bada container better visibility ke liye */
  height: 400px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* SVG Animation Layer */
#animation-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
}

/* Final Logo Layer */
#final-logo {
  position: absolute;
  width: 280px; /* Orbit size ke hisab se adjusted */
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 1;
}

#final-logo.show {
  opacity: 1;
  transform: scale(1);
}

.path-hidden {
  stroke-dasharray: 1500;
  stroke-dashoffset: 1500;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.fade-out {
  opacity: 0 !important;
  transition: opacity 0.5s ease;
}

/* Text Container */
.text-container {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease 0.3s;
}

.text-container.visible {
  opacity: 1;
  transform: translateY(0);
}

.title {
  font-size: 42px;
  font-weight: 800;
  color: var(--dark-blue);
  margin: 0;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 18px;
  font-weight: 300;
  color: #777;
  margin-top: -5px;
}
</style>
</head>

<body>

<div class="container">
  <img src="logop.png" id="final-logo" alt="Acropolis Logo">

  <svg id="animation-wrapper" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <ellipse id="orbit-1" cx="250" cy="250" rx="140" ry="65"
      fill="none" stroke="var(--dark-blue)" stroke-width="6"
      transform="rotate(-25 250 250)" class="path-hidden"/>

    <ellipse id="orbit-2" cx="250" cy="250" rx="130" ry="60"
      fill="none" stroke="var(--red)" stroke-width="6"
      transform="rotate(25 250 250)" class="path-hidden"/>

    <ellipse id="orbit-3" cx="250" cy="250" rx="120" ry="80"
      fill="none" stroke="var(--light-blue)" stroke-width="6"
      transform="rotate(90 250 250)" class="path-hidden"/>
  </svg>

  <div class="text-container" id="brand-text">
    <h1 class="title">ACROPOLIS</h1>
    <p class="subtitle">Enlightening Wisdom</p>
  </div>
</div>

<script>
const orbits = [
  { id: 'orbit-1', delay: 200 },
  { id: 'orbit-2', delay: 500 },
  { id: 'orbit-3', delay: 800 }
];

function startAnimation() {
  orbits.forEach((orbit, index) => {
    setTimeout(() => {
      const el = document.getElementById(orbit.id);
      el.style.opacity = '1';
      el.style.transition = 'stroke-dashoffset 1.5s ease-in-out, opacity 0.3s ease';
      el.style.strokeDashoffset = '0';

      // Jab aakhri orbit khatam hone wala ho
      if (index === orbits.length - 1) {
        setTimeout(() => {
          // Orbits ko fade out karo
          document.querySelectorAll('ellipse').forEach(e => e.classList.add('fade-out'));
          
          // Original Logo ko dikhao
          document.getElementById('final-logo').classList.add('show');
          
          // Text ko dikhao
          document.getElementById('brand-text').classList.add('visible');
        }, 1200);
      }
    }, orbit.delay);
  });

  // Page Redirect (After 4 seconds to allow animation to finish)
  setTimeout(function() {
    window.location.href = "/login";
  }, 4500);
}

window.onload = startAnimation;
</script>

</body>
</html>
