<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Creator - Acropolis Campus</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
--primary:#003366;
--accent:#31c2cf;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
display:flex;
height:100vh;
background:#f4f6fa;
overflow:hidden;
}

.main-wrapper{
display:flex;
width:100%;
}

.image-section{
flex:1.2;
position:relative;
background:black;
}

.image-section img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
opacity:0;
transition:1s;
}

.image-section img.active{
opacity:1;
}

.logo-overlay{
position:absolute;
top:30px;
left:30px;
color:white;
font-size:26px;
font-weight:600;
letter-spacing:2px;
}

.form-section{
flex:1;
background:white;
padding:60px 8%;
overflow-y:auto;
}

.form-header h1{
font-weight:400;
margin-bottom:5px;
}

.form-header p{
color:gray;
margin-bottom:30px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
background:#e8f0fe;
border-bottom:2px solid transparent;
outline:none;
}

input:focus,select:focus{
border-bottom:2px solid var(--accent);
}

.btn-create{
background:var(--primary);
color:white;
border:none;
padding:12px 40px;
cursor:pointer;
float:right;
}

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:100;
}

.id-card-popup{
background:white;
padding:25px;
border-radius:10px;
text-align:center;
width:340px;
}

.id-card{
border:2px solid #003366;
padding:15px;
border-radius:10px;
background:#f8fbff;
}

.id-card img.logo{
width:70px;
margin-bottom:5px;
}

.id-card img.photo{
width:90px;
height:100px;
object-fit:cover;
border-radius:6px;
margin-bottom:10px;
}

.id-card p{
font-size:13px;
text-align:left;
margin-bottom:4px;
}

.modal-btns{
margin-top:15px;
display:flex;
gap:10px;
justify-content:center;
}

.modal-btns button{
border:none;
padding:8px 14px;
border-radius:5px;
cursor:pointer;
color:white;
}

.btn-img{background:#4caf50;}
.btn-pdf{background:#2196f3;}
.btn-close{background:#f44336;}

@media(max-width:900px){
.image-section{display:none;}
}

</style>
</head>

<body>

<div class="main-wrapper">

<div class="image-section" id="slider">
<div class="logo-overlay">ACROPOLIS</div>

<img src="model1.png" class="active">
<img src="model2.png">
<img src="model3.png">

</div>

<div class="form-section">

<div class="form-header">
<h1>Student ID Creator</h1>
<p>Create new student credentials</p>
</div>

<form id="signupForm">

<input type="text" id="studentName" placeholder="Full Name" required>

<input type="text" id="enrollment" placeholder="Enrollment Number" required>

<input type="password" id="password" placeholder="Set Password" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="tel" id="phone" placeholder="Mobile Number" required>

<input type="file" id="photo" accept="image/*" required>

<select id="branchSelect" required>

<option value="">Select Branch</option>

<option>CSE1</option>
<option>CSE2</option>
<option>IT1</option>
<option>IT2</option>
<option>AIDS1</option>
<option>CSD1</option>

</select>

<select id="semesterSelect"></select>

<select id="yearSelect">

<option value="">Year</option>

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>

</select>

<button class="btn-create">Create ID</button>

</form>

</div>

</div>

<!-- POPUP -->

<div class="modal-overlay" id="modalOverlay">

<div class="id-card-popup">

<div class="id-card" id="captureArea">

<img src="logo.jpg" class="logo">

<h3>ACROPOLIS INSTITUTE</h3>

<img id="resPhoto" class="photo">

<p><b>Name:</b> <span id="resName"></span></p>

<p><b>Enrollment:</b> <span id="resEnroll"></span></p>

<p><b>Password:</b> <span id="resPass"></span></p>

<p><b>Email:</b> <span id="resEmail"></span></p>

<p><b>Phone:</b> <span id="resPhone"></span></p>

<p><b>Branch:</b> <span id="resBranch"></span></p>

<p><b>Semester:</b> <span id="resSem"></span></p>

<p><b>Year:</b> <span id="resYear"></span></p>

</div>

<div class="modal-btns">

<button class="btn-img" onclick="downloadImage()">Download Image</button>

<button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>

<button class="btn-close" onclick="closeModal()">Close</button>

</div>

</div>

</div>

<script>

const images=document.querySelectorAll("#slider img");
let idx=0;

setInterval(()=>{
images[idx].classList.remove("active");
idx=(idx+1)%images.length;
images[idx].classList.add("active");
},5000);

const semSelect=document.getElementById("semesterSelect");

for(let i=1;i<=8;i++){
let opt=document.createElement("option");
opt.value=i;
opt.textContent="Semester "+i;
semSelect.appendChild(opt);
}

const form=document.getElementById("signupForm");
const modal=document.getElementById("modalOverlay");

form.addEventListener("submit",function(e){

e.preventDefault();

const reader=new FileReader();

const photo=document.getElementById("photo").files[0];

reader.onload=function(){

document.getElementById("resPhoto").src=reader.result;

};

reader.readAsDataURL(photo);

document.getElementById("resName").innerText=document.getElementById("studentName").value;

document.getElementById("resEnroll").innerText=document.getElementById("enrollment").value;

document.getElementById("resPass").innerText=document.getElementById("password").value;

document.getElementById("resEmail").innerText=document.getElementById("email").value;

document.getElementById("resPhone").innerText=document.getElementById("phone").value;

document.getElementById("resBranch").innerText=document.getElementById("branchSelect").value;

document.getElementById("resSem").innerText=document.getElementById("semesterSelect").value;

document.getElementById("resYear").innerText=document.getElementById("yearSelect").value;

modal.style.display="flex";

});

function closeModal(){
modal.style.display="none";
}

function downloadImage(){

html2canvas(document.getElementById("captureArea")).then(canvas=>{

let link=document.createElement("a");

link.download="Student_ID.png";

link.href=canvas.toDataURL();

link.click();

});

}

async function downloadPDF(){

const {jsPDF}=window.jspdf;

const canvas=await html2canvas(document.getElementById("captureArea"));

const img=canvas.toDataURL("image/png");

const pdf=new jsPDF();

pdf.addImage(img,"PNG",10,10,180,0);

pdf.save("Student_ID.pdf");

}

</script>

</body>
</html>
