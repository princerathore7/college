<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forms | Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="https://cdn.corenexis.com/view/6199335168">
<style>
body{margin:0;background:#f4f6f9;font-family:Inter;padding:30px}
.container{max-width:1100px;margin:auto}
.header{margin-bottom:20px}
.header h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{
  background:#fff;border:1px solid #e1e5ec;
  padding:18px;border-radius:4px
}
.card h3{margin:0;font-size:18px}
.card p{font-size:13px;color:#555}
.btn{
  margin-top:14px;padding:10px 14px;
  border:none;background:#1e90ff;color:#fff;
  font-size:13px;font-weight:600;cursor:pointer
}
.empty{text-align:center;color:#777;padding:40px}
   .back-btn {
  background: #003366;          /* Navy Blue */
  color: #fff;
  border: none;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s ease;
}

.back-btn:hover {
  background: #002244;
}

.back-btn:active {
  transform: scale(0.96);
}
</style>
</head>

<body>
<button class="back-btn" onclick="goBack()">
  ← Back
</button>
<div class="container">
  <div class="header">
    <h1>Forms</h1>
    <p>Click a form to view submissions</p>
  </div>

  <!-- SEARCH FIELD -->
  <input
    type="text"
    id="searchInput"
    placeholder="Search forms..."
    oninput="filterForms()"
    style="
      margin-top:10px;
      padding:10px;
      width:100%;
      max-width:350px;
      border:1px solid #ccc;
      border-radius:4px;
      font-size:14px;
    "
  >
</div>
  <div class="grid" id="formsGrid"></div>
</div>

<script>
          const mentorIdVal = localStorage.getItem("mentorId");
const source = sessionStorage.getItem("accessSource");
const ALLOWED_SOURCES = ["ad", "admin"];

if(!mentorIdVal || !ALLOWED_SOURCES.includes(source)){
  document.body.innerHTML = `
    <div class="denied-container">
      <h1 style="color:#d32f2f; font-size: 3rem;">❌</h1>
      <h2 style="color:#d32f2f">Access Denied</h2>
      <p>Security protocol triggered. This incident will be reported.<br>Please login via the Official Administration Panel.</p>
      <button onclick="location.href='/login.html'" style="width:200px">Back to Login</button>
    </div>
  `;
  throw new Error("Unauthorized access");
}
const grid = document.getElementById("formsGrid");
let allForms = []; // store all forms
async function loadForms(){
  try{
    const res = await fetch(
      "https://college-hwbb.onrender.com/api/admin/forms"
    );

    if(!res.ok) throw new Error("Server error");

  allForms = await res.json();
renderForms(allForms);
    grid.innerHTML = "";

    if(forms.length === 0){
      grid.innerHTML = `<div class="empty">No forms found</div>`;
      return;
    }

    forms.forEach(f=>{
      const div = document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <h3>${f.name}</h3>
        <p>Total Submissions: <b>${f.submissions}</b></p>
        <button class="btn"
          onclick="openForm('${f.id}','${f.name}')">
          View Submissions →
        </button>
      `;
      grid.appendChild(div);
    });

  }catch(err){
    console.error(err);
    grid.innerHTML = `<div class="empty">Server error / API not reachable</div>`;
  }
}
function renderForms(forms){
  grid.innerHTML = "";

  if(forms.length === 0){
    grid.innerHTML = `<div class="empty">No forms found</div>`;
    return;
  }

  forms.forEach(f=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <h3>${f.name}</h3>
      <p>Total Submissions: <b>${f.submissions}</b></p>
      <button class="btn"
        onclick="openForm('${f.id}','${f.name}')">
        View Submissions →
      </button>
    `;
    grid.appendChild(div);
  });
}
function filterForms(){
  const search = document
    .getElementById("searchInput")
    .value.toLowerCase();

  const filtered = allForms.filter(f =>
    f.name.toLowerCase().includes(search)
  );

  renderForms(filtered);
}
function openForm(id,name){
  location.href=`form-data-details.html?formId=${id}&formName=${encodeURIComponent(name)}`;
}
function goback(){
window.history.back();
}
loadForms();
</script>

</body>
</html>
