<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Attendance Summary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: Inter, sans-serif; background: #0f172a; color: white; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .header { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .sub { color: #94a3b8; margin-bottom: 20px; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
        button { padding: 8px 16px; border: none; border-radius: 6px; background: #22c55e; color: white; cursor: pointer; }
        button:hover { background: #16a34a; }
        .stats { margin-bottom: 15px; padding: 10px; background: #1e293b; border-radius: 8px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table th, .table td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .table th { background: #1e293b; }
        .present { color: #22c55e; font-weight: 600; }
        .absent { color: #ef4444; font-weight: 600; }
        .percentage { font-weight: 700; color: #38bdf8; }
        .loading { padding: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Student Attendance Summary</div>
    <div class="sub" id="lectureIdText">Loading...</div>

    <div class="filters">
        <select id="yearFilter">
            <option value="">All Years</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
            <option value="5">5th Year</option>
        </select>

        <select id="branchFilter">
            <option value="">All Branch</option>
           
  <!-- (Your full RGPV branch list here) -->
  <option value="CSE">CSE - Computer Science Engineering</option>
  <option value="IT">IT - Information Technology</option>
  <option value="AIML">AIML - Artificial Intelligence & Machine Learning</option>
  <option value="AIDS">AIDS - Artificial Intelligence & Data Science</option>
  <option value="CSBS">CSBS - Computer Science & Business Systems</option>
  <option value="IOT">IoT - Internet of Things</option>
  <option value="ECE">ECE - Electronics & Communication</option>
  <option value="EEE">EEE - Electrical & Electronics</option>
  <option value="EE">EE - Electrical Engineering</option>
  <option value="ME">ME - Mechanical Engineering</option>
  <option value="AU">AU - Automobile Engineering</option>
  <option value="MT">MT - Mechatronics</option>
  <option value="CE">CE - Civil Engineering</option>
  <option value="CHE">CHE - Chemical Engineering</option>
  <option value="MIN">MIN - Mining Engineering</option>
  <option value="PET">PET - Petroleum Engineering</option>
  <option value="BT">BT - Biotechnology</option>
  <option value="BME">BME - Biomedical Engineering</option>
  <option value="FT">FT - Food Technology</option>
  <option value="AG">AG - Agriculture Engineering</option>
  <option value="ENV">ENV - Environmental Engineering</option>
  <option value="TX">TX - Textile Engineering</option>
  <option value="PIE">PIE - Production & Industrial Engineering</option>
  <option value="IM">IM - Industrial Management</option>

  <!-- Diploma -->
  <option value="DCSE">Diploma - Computer Science</option>
  <option value="DIT">Diploma - IT</option>
  <option value="DCYBER">Diploma - Cyber Security</option>
  <option value="DECE">Diploma - ECE</option>
  <option value="DEEE">Diploma - EEE</option>
  <option value="DEE">Diploma - Electrical</option>
  <option value="DME">Diploma - Mechanical</option>
  <option value="DCE">Diploma - Civil</option>
  <option value="DMIN">Diploma - Mining</option>
  <option value="DCHE">Diploma - Chemical</option>
  <option value="DAG">Diploma - Agriculture</option>
  <option value="DTX">Diploma - Textile</option>
  <option value="DPLASTIC">Diploma - Plastic</option>
  <option value="DPOLY">Diploma - Polymer</option>

  <!-- Pharmacy -->
  <option value="DPHARMA">D.Pharmacy</option>
  <option value="BPHARMA">B.Pharmacy</option>
  <option value="MPHARMA">M.Pharmacy</option>

        </select>

<label>Select Section</label>
<select id="section">
  <option value="">-- Select --</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>
        <input type="text" id="enrollmentSearch" placeholder="Search enrollment...">
        <button onclick="loadAttendance()">Apply Filter</button>
    </div>

    <div class="stats" id="stats"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Enrollment</th>
                <th>Present</th>
                <th>Absent</th>
                <th>Total</th>
                <th>Percentage</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" class="loading">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_BASE = "https://college-hwbb.onrender.com/api/attendance/robot/lecture";
    
    // Security Check
    const mentorIdVal = localStorage.getItem("mentorId");
    const source = sessionStorage.getItem("accessSource");
    const ALLOWED_SOURCES = ["ad", "admin"];

    if(!mentorIdVal || !ALLOWED_SOURCES.includes(source)){
        document.body.innerHTML = `<div style="text-align:center; margin-top:50px;"><h1>❌ Access Denied</h1><button onclick="location.href='/login.html'">Back to Login</button></div>`;
        throw new Error("Unauthorized access");
    }

    const params = new URLSearchParams(window.location.search);
    const lectureId = params.get("lectureId");
    document.getElementById("lectureIdText").innerText = "Lecture ID: " + (lectureId || "Not Found");

    async function loadAttendance(){
        if(!lectureId) return;

        const year = document.getElementById("yearFilter").value;
        const branch = document.getElementById("branchFilter").value;
        const search = document.getElementById("enrollmentSearch").value.toUpperCase();

        let url = `${API_BASE}/${lectureId}?`;
        if(year) url += `year=${year}&`;
        if(branch) url += `branch=${branch}&`;

        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading records...</td></tr>`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            let records = data.records || [];

            // Enrollment search filter
            if(search) {
                records = records.filter(r => r.enrollment.includes(search));
            }

            // --- GROUPING LOGIC START ---
            const groupedData = records.reduce((acc, curr) => {
                const id = curr.enrollment;
                if (!acc[id]) {
                    acc[id] = { enrollment: id, pCount: 0, aCount: 0, total: 0 };
                }
                if (curr.status === "P") acc[id].pCount++;
                else acc[id].aCount++;
                
                acc[id].total++;
                return acc;
            }, {});

            const groupedArray = Object.values(groupedData);
            // --- GROUPING LOGIC END ---

            renderTable(groupedArray);
        } catch(err) {
            tbody.innerHTML = `<tr><td colspan="5" style="color:red">Failed to load data.</td></tr>`;
        }
    }

    function renderTable(groupedRecords){
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        if(!groupedRecords.length){
            tbody.innerHTML = `<tr><td colspan="5">No records found</td></tr>`;
            return;
        }

        groupedRecords.forEach(r => {
            const percentage = ((r.pCount / r.total) * 100).toFixed(1);
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${r.enrollment}</td>
                <td class="present">${r.pCount}</td>
                <td class="absent">${r.aCount}</td>
                <td>${r.total}</td>
                <td class="percentage">${percentage}%</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("stats").innerHTML = `
            <strong>Unique Students:</strong> ${groupedRecords.length}
        `;
    }

    loadAttendance();
</script>

</body>
</html>
