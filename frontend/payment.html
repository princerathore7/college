<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Fine — Acropolis</title>

<!-- Razorpay Checkout -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: #f4f6f9;
}

.topbar {
  background: #003366;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  max-width: 450px;
  margin: 25px auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.info-box {
  background: #eef3ff;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}

#upiBtn {
  background: #009933;
  color: white;
}

#qrBtn {
  background: #003366;
  color: white;
}

.back-btn{
  margin:20px auto;
  display:block;
  padding:10px 15px;
  background:#666;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.note {
  margin-top: 15px;
  font-size: 13px;
  color: #666;
  text-align: center;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>Pay Your Fine</h2>
</div>

<div class="container">

  <div class="info-box">
    <p><b>Enrollment:</b> <span id="enrollment"></span></p>
    <p><b>Fine Amount:</b> ₹ <span id="amount"></span></p>
    <p><b>Reason:</b> <span id="reason"></span></p>
    <p><b>Status:</b> Pending</p>
  </div>

  <button id="upiBtn" onclick="startPayment()">
    Pay via UPI (GPay / PhonePe / Paytm)
  </button>

  <button id="qrBtn" onclick="openQRPage()">
    Pay via QR Code
  </button>

  <p class="note">
    Please complete the payment securely.
  </p>

</div>

<button class="back-btn" onclick="goBack()">← Back</button>

<script>

const API_BASE = "https://college-hwbb.onrender.com";

// Get URL params
const params = new URLSearchParams(window.location.search);
const enrollment = params.get("enrollment");
const amount = params.get("amount");
const reason = params.get("reason");

// Show data
document.getElementById("enrollment").innerText = enrollment;
document.getElementById("amount").innerText = amount;
document.getElementById("reason").innerText = reason;


/************************************************
  START PAYMENT
************************************************/
async function startPayment() {

  try {

    // Create order from backend
    const res = await fetch(`${API_BASE}/api/fines/create-order`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        enrollment: enrollment,
        amount: amount,
        reason: reason
      })
    });

    const data = await res.json();

    console.log("Order response:", data);

    if (!data.success) {
      alert("Failed to create order");
      return;
    }


    // Razorpay options
    const options = {

      key: data.key,

      amount: data.amount,

      currency: "INR",

      name: "Acropolis Institute Indore",

      description: "Fine Payment",

      order_id: data.order_id,


      handler: async function (response) {

        try {

          // VERIFY PAYMENT
          const verifyRes = await fetch(`${API_BASE}/api/fines/verify-payment`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          });

          const verifyData = await verifyRes.json();

          if (verifyData.success) {

            alert("✅ Payment successful!");

            window.location.href = "fine.html";

          } else {

            alert("❌ Payment verification failed");

          }

        } catch (err) {

          console.error(err);

          alert("Verification error");

        }

      },


      notes: {
        enrollment: enrollment,
        reason: reason
      },


      method: {
        upi: true
      },


      theme: {
        color: "#003366"
      }

    };


    const rzp = new Razorpay(options);

    rzp.open();


  } catch (error) {

    console.error(error);

    alert("Server error. Please try again.");

  }

}



/************************************************
  OPEN QR PAGE
************************************************/
function openQRPage() {

  const qrUrl =
    `qr.html?enrollment=${encodeURIComponent(enrollment)}
    &amount=${encodeURIComponent(amount)}
    &reason=${encodeURIComponent(reason)}`;

  window.location.href = qrUrl;

}


/************************************************
  BACK BUTTON
************************************************/
function goBack() {

  window.history.back();

}

</script>

</body>
</html>
