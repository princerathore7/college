<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fine Payment Receipt</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    padding:20px;
}

/* RECEIPT CONTAINER */
.receipt-container{
    position:relative;
    max-width:750px;
    margin:auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    padding:30px;
    overflow:hidden;
}

/* WATERMARK */
.watermark{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    opacity:0.04; /* ultra low opacity */
    pointer-events:none;
    z-index:0;
    background-image:url("logo.jpg");
    background-repeat:repeat;
    background-size:120px;
}

/* CONTENT ABOVE WATERMARK */
.content{
    position:relative;
    z-index:1;
}

/* HEADER */
.header{
    text-align:center;
    border-bottom:2px solid #eee;
    padding-bottom:15px;
}

.logo{
    width:80px;
    margin-bottom:10px;
}

.college-name{
    font-size:22px;
    font-weight:bold;
}

.receipt-title{
    font-size:18px;
    color:#555;
    margin-top:5px;
}

/* DETAILS */
.details{
    margin-top:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.label{
    font-weight:bold;
    color:#333;
}

.value{
    color:#555;
}

/* AMOUNT BOX */
.amount-box{
    text-align:center;
    margin-top:25px;
    padding:18px;
    background:#e8f4ff;
    border-radius:8px;
}

.amount{
    font-size:30px;
    font-weight:bold;
    color:#007bff;
}

/* STATUS */
.status-paid{
    color:green;
    font-weight:bold;
}

.status-pending{
    color:orange;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}

/* BUTTONS */
.buttons{
    text-align:center;
    margin-top:20px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    margin:5px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.back-btn{
    background:#6c757d;
}

.back-btn:hover{
    background:#4e555b;
}

/* PRINT MODE */
@media print{

    body{
        background:white;
    }

    .buttons{
        display:none;
    }

}

</style>
</head>
<body>

<div class="receipt-container">

    <!-- WATERMARK -->
    <div class="watermark"></div>

    <!-- CONTENT -->
    <div class="content">

        <div class="header">
            <img src="logop.png" class="logo">

            <div class="college-name">
                Acropolis Institute of Technology & Research
            </div>

            <div class="receipt-title">
                Fine Payment Receipt
            </div>
        </div>

        <div class="details">

            <div class="row">
                <div class="label">Receipt ID</div>
                <div class="value" id="receiptId"></div>
            </div>

            <div class="row">
                <div class="label">Payment ID</div>
                <div class="value" id="paymentId"></div>
            </div>

            <div class="row">
                <div class="label">Enrollment Number</div>
                <div class="value" id="enrollment"></div>
            </div>

            <div class="row">
                <div class="label">Class</div>
                <div class="value" id="className"></div>
            </div>

            <div class="row">
                <div class="label">Reason</div>
                <div class="value" id="reason"></div>
            </div>

            <div class="row">
                <div class="label">Status</div>
                <div class="value" id="status"></div>
            </div>

            <div class="row">
                <div class="label">Date & Time</div>
                <div class="value" id="dateTime"></div>
            </div>

        </div>

        <div class="amount-box">
            Paid Amount
            <div class="amount" id="amount"></div>
        </div>

        <div class="footer">
            This is a computer generated receipt.<br>
            No signature required.
        </div>

        <div class="buttons">

            <button onclick="window.print()">
                <i class="fa fa-print"></i> Print
            </button>

            <button class="back-btn" onclick="goBack()">
                <i class="fa fa-arrow-left"></i> Back
            </button>

        </div>

    </div>

</div>

<script>

/* GET RECEIPT */

const receipt = JSON.parse(localStorage.getItem("selectedReceipt"));

if(!receipt){

    alert("Receipt not found");
    window.location.href = "my-receipt.html";

}

/* GET CLASS FROM LOCAL STORAGE */

let className = receipt.class;

if(!className){

    const studentProfile = JSON.parse(localStorage.getItem("studentProfile"));

    if(studentProfile && studentProfile.class){

        className = studentProfile.class;

    }
    else{

        className = "-";

    }

}

/* EXTRACT DATA */

const receiptId = receipt.receipt_id || receipt._id || "-";
const paymentId = receipt.payment_id || "-";
const enrollment = receipt.enrollment || "-";
const reason = receipt.reason || "-";
const status = receipt.status || "-";
const amount = receipt.amount_paid || receipt.amount || "0";

/* DATE */

let formattedDate = "-";

if(receipt.createdAt){

    const d = new Date(receipt.createdAt);

    if(!isNaN(d.getTime())){

        formattedDate = d.toLocaleString("en-IN");

    }

}

/* FILL */

document.getElementById("receiptId").innerText = receiptId;
document.getElementById("paymentId").innerText = paymentId;
document.getElementById("enrollment").innerText = enrollment;
document.getElementById("className").innerText = className;
document.getElementById("reason").innerText = reason;
document.getElementById("amount").innerText = "₹ " + amount;
document.getElementById("dateTime").innerText = formattedDate;

/* STATUS COLOR */

const statusElement = document.getElementById("status");

statusElement.innerText = status;

if(status.toLowerCase() === "paid"){

    statusElement.classList.add("status-paid");

}
else{

    statusElement.classList.add("status-pending");

}

/* BACK */

function goBack(){

    window.location.href = "my-receipt.html";

}

</script>

</body>
</html>
