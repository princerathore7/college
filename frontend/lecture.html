<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Robot Lectures</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Inter, sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.header{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
}

.lecture{
    background:#1e293b;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid #334155;
    transition:.2s;
}

.lecture:hover{
    background:#334155;
}

.loading{
    padding:20px;
    text-align:center;
}

.empty{
    padding:20px;
    text-align:center;
    color:#94a3b8;
}

.refresh{
    background:#22c55e;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    margin-bottom:15px;
}

.refresh:hover{
    background:#16a34a;
}

</style>

</head>
<body>

<div class="container">

<div class="header">
All Lecture IDs
</div>

<button class="refresh" onclick="loadLectures()">
Refresh
</button>

<div id="lectureList" class="loading">
Loading lectures...
</div>

</div>

<script>


/* IMPORTANT: change if needed */

const API_URL =
"https://college-hwbb.onrender.com/api/attendance/robot/lectures";

async function loadLectures(){

    const container =
    document.getElementById("lectureList");

    container.innerHTML =
    "<div class='loading'>Loading lectures...</div>";

    try{

        const res =
        await fetch(API_URL);

        const data =
        await res.json();


        if(!data.success || !data.lectures.length){

            container.innerHTML =
            "<div class='empty'>No lectures found</div>";

            return;
        }


        container.innerHTML = "";


        data.lectures.forEach(lecture=>{

            const div =
            document.createElement("div");

            div.className =
            "lecture";

            div.innerHTML =
            `<strong>${lecture}</strong>`;


            div.onclick = ()=>{

                /* redirect to lecture detail page */

                window.location.href =
                `lecture-details.html?lectureId=${lecture}`;

            };


            container.appendChild(div);

        });


    }

    catch(err){

        container.innerHTML =
        "<div class='empty'>Failed to load lectures</div>";

    }

}



/* auto load */

loadLectures();


</script>

</body>
</html>
