<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acropolis | Lost & Found Professional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; /* Deep Navy */
            --accent: #2563eb; /* Modern Blue */
            --bg: #f1f5f9;
            --white: #ffffff;
            --text-main: #1e293b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Hero Header Section */
        header {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.9)), 
                        url('logo.jpg') center/cover; /* Logo as background texture */
            color: #fff;
            padding: 100px 20px 140px;
            text-align: center;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
            margin-top: 15px;
        }

        /* Floating Search Controls */
        .container {
            max-width: 1200px;
            margin: -60px auto 50px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .search-box { flex: 3; position: relative; }
        .search-box input, .filter-box select {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .filter-box { flex: 1; }

        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
        }

        .card-img-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover img { transform: scale(1.1); }

        .card-content { padding: 20px; }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.9);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
        }

        .tag {
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-title {
            margin: 10px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
        }

        /* Modal System */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            animation: modalSlide 0.4s ease-out;
        }

        @keyframes modalSlide {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-img-container {
            position: relative;
            height: 300px;
            background: #eee;
        }

        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }

        .fullscreen-btn:hover { background: #fff; transform: scale(1.05); }

        .modal-body { padding: 30px; }

        .close-x {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Utils */
        .empty-state { text-align: center; padding: 100px 0; grid-column: 1/-1; }
        .empty-state span { font-size: 80px; display: block; filter: grayscale(1); }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .search-container { flex-direction: column; }
            header { padding: 60px 20px 100px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <img src="logo.jpg" alt="Acropolis Logo" class="header-logo">
        <h1>Acropolis Portal</h1>
        <p>Official Lost & Found Repository for Students & Staff</p>
    </div>
</header>

<div class="container">
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="search" placeholder="Search for items (e.g., 'Calculator', 'Keys')...">
        </div>
        <div class="filter-box">
            <select id="category">
                <option value="">All Categories</option>
                <option>Electronic Item</option>
                <option>Bag</option>
                <option>Tiffin</option>
                <option>Money</option>
                <option>Books</option>
                <option>ID Card</option>
                <option>Other</option>
            </select>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty-state" id="empty" style="display:none;">
        <span>🔍</span>
        <h3>No Items Found</h3>
        <p>We couldn't find any items matching your criteria.</p>
    </div>
</div>

<div class="modal" id="itemModal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal()">×</button>
        <div class="modal-img-container">
            <img id="modalImg" src="">
            <button class="fullscreen-btn" onclick="viewFullScreen()">
                ⛶ View Full Screen
            </button>
        </div>
        <div class="modal-body">
            <span class="tag" id="modalTag">Category</span>
            <h2 id="modalTitle" class="item-title" style="font-size: 28px;">Item Name</h2>
            <p id="modalDesc" style="color: #475569; line-height: 1.6;">Description...</p>
            
            <div style="background: #f8fafc; padding: 20px; border-radius: 15px; margin-top: 20px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 14px;">
                    <div>
                        <strong style="display:block; color: #94a3b8;">Owner's Class</strong>
                        <span id="modalClass" style="font-weight: 600;">-</span>
                    </div>
                    <div>
                        <strong style="display:block; color: #94a3b8;">Found Date</strong>
                        <span id="modalDate" style="font-weight: 600;">-</span>
                    </div>
                </div>
            </div>
            
            <button onclick="closeModal()" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:600; margin-top:25px; cursor:pointer; font-size: 16px;">Close Details</button>
        </div>
    </div>
</div>

<script>
const API = "https://college-hwbb.onrender.com/api/missing/public";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const modal = document.getElementById("itemModal");

let allItems = [];

async function loadItems(){
    try {
        const response = await fetch(API);
        const res = await response.json();
        allItems = res.data || [];
        renderItems(allItems, "", "");
    } catch (error) {
        console.error("API Error:", error);
    }
}

function renderItems(items, searchTerm, categoryTerm) {
    grid.innerHTML = "";
    
    const filtered = items.filter(item => {
        const matchesSearch = item.description.toLowerCase().includes(searchTerm) || item.name.toLowerCase().includes(searchTerm);
        const matchesCategory = categoryTerm === "" || item.category === categoryTerm;
        return matchesSearch && matchesCategory;
    });

    if(filtered.length === 0){
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-img-wrapper">
                <span class="status-badge">Found</span>
                <img src="${item.photo}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Preview'">
            </div>
            <div class="card-content">
                <span class="tag">${item.category}</span>
                <div class="item-title">${item.name}</div>
                <div class="item-info">
                    <span>📍 Room: ${item.class}</span>
                    <span>🕒 ${new Date(item.created_at).toLocaleDateString()}</span>
                </div>
            </div>
        `;
        card.onclick = () => openModal(item);
        grid.appendChild(card);
    });
}

function openModal(item) {
    document.getElementById("modalImg").src = item.photo;
    document.getElementById("modalTag").innerText = item.category;
    document.getElementById("modalTitle").innerText = item.name;
    document.getElementById("modalDesc").innerText = item.description;
    document.getElementById("modalClass").innerText = item.class;
    document.getElementById("modalDate").innerText = new Date(item.created_at).toLocaleDateString();
    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
}

function viewFullScreen() {
    const imgUrl = document.getElementById("modalImg").src;
    window.open(imgUrl, '_blank');
}

// Event Listeners
document.getElementById("search").addEventListener("input", (e) => {
    renderItems(allItems, e.target.value.toLowerCase(), document.getElementById("category").value);
});

document.getElementById("category").addEventListener("change", (e) => {
    renderItems(allItems, document.getElementById("search").value.toLowerCase(), e.target.value);
});

window.onclick = (e) => { if (e.target == modal) closeModal(); }

loadItems();
</script>

</body>
</html>
