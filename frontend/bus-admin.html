<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1e2a38;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    .msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚌 Bus Admin Panel</h2>

    <label for="busId">Bus Pilot ID</label>
    <input type="text" id="busId" placeholder="e.g. BUS-101">

    <label for="password">Bus Pilot Password</label>
    <input type="password" id="password" placeholder="Strong password">

    <button onclick="createBus()">Create Bus Pilot</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    async function createBus() {
      const busId = document.getElementById("busId").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";
      msg.className = "msg";

      if (!busId || !password) {
        msg.textContent = "Bus ID and Password required";
        msg.classList.add("error");
        return;
      }

      try {
        const res = await fetch("https://college-hwbb.onrender.com/api/admin/bus/create", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            busId: busId,
            password: password
          })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || "Error creating bus";
          msg.classList.add("error");
          return;
        }

        msg.textContent = "✅ Bus Pilot Created Successfully";
        msg.classList.add("success");

        document.getElementById("busId").value = "";
        document.getElementById("password").value = "";

      } catch (err) {
        msg.textContent = "Server error. Try again.";
        msg.classList.add("error");
      }
    }
  </script>

</body>
</html>
