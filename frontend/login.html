<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acropolis Campus - Login</title>
<link rel="icon" href="logop.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root {
  --primary-color: #00bcd4; /* Fresh Cyan */
  --primary-dark: #0097a7;
  --text-main: #333;
  --text-muted: #888;
  --bg-light: #f4f7f6;
  --white: #ffffff;
  --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  background-color: var(--bg-light);
  overflow: hidden;
}

/* --- Layout Container --- */
.main-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
  background: var(--white);
}

/* --- Left Side: Image Slider --- */
.image-section {
  flex: 1.3;
  position: relative;
  background-color: #000;
  overflow: hidden;
}

/* Overlay to ensure text readability */
.image-section::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,188,212,0.2));
  z-index: 5;
}

.image-section img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  transition: opacity 1.5s ease-in-out, transform 6s ease;
  opacity: 0;
  transform: scale(1);
}

.image-section img.active {
  opacity: 1;
  transform: scale(1.1); /* Slow Zoom Effect */
}

.logo-overlay {
  position: absolute;
  top: 40px;
  left: 40px;
  z-index: 10;
  color: white;
  font-weight: 700;
  font-size: 1.8rem;
  letter-spacing: 2px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

/* --- Right Side: Login Form --- */
.login-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 8%;
  position: relative;
  background: var(--white);
  z-index: 20;
}

.login-header {
  margin-bottom: 30px;
}

.login-header h1 {
  font-size: 2rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 8px;
}

.login-header p {
  color: var(--text-muted);
  font-size: 0.95rem;
}

/* --- Modern Role Selector (Tabs) --- */
.role-container {
  display: flex;
  background: #f0f2f5;
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 30px;
  position: relative;
}

.role-item {
  flex: 1;
  text-align: center;
  position: relative;
  z-index: 2;
}

/* Hide actual radio buttons */
.role-item input[type="radio"] {
  display: none;
}

.role-item label {
  display: block;
  padding: 10px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s ease;
}

/* Active State Styling */
.role-item input[type="radio"]:checked + label {
  background-color: var(--white);
  color: var(--primary-color);
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  font-weight: 600;
}

/* --- Input Fields with Icons --- */
.form-group {
  margin-bottom: 20px;
  position: relative;
}

.input-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #aaa;
  transition: 0.3s;
}

input[type="text"], 
input[type="password"] {
  width: 100%;
  padding: 14px 15px 14px 45px; /* Space for icon */
  border: 1px solid #e1e1e1;
  background-color: #f9f9f9;
  border-radius: 10px;
  font-size: 0.95rem;
  font-family: 'Poppins', sans-serif;
  outline: none;
  transition: all 0.3s ease;
}

input:focus {
  background-color: #fff;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 4px rgba(49, 194, 207, 0.1);
}

input:focus + .input-icon {
  color: var(--primary-color);
}

/* --- Footer & Actions --- */
.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-muted);
  cursor: pointer;
}

.forgot-pw {
  color: var(--primary-color);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
}

.forgot-pw:hover {
  text-decoration: underline;
}

/* Login Button */
.btn-login {
  background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
  color: white;
  border: none;
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 30px;
  box-shadow: 0 4px 15px rgba(49, 194, 207, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(49, 194, 207, 0.5);
}

.btn-login:active {
  transform: translateY(0);
}

.btn-login:disabled {
  background: #ccc;
  cursor: not-allowed;
  box-shadow: none;
}

/* Socials & Copyright */
.social-section {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.social-icons {
    display: flex;
    gap: 15px;
}

.social-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s;
    color: #555;
}

.social-btn:hover {
    background: var(--primary-color);
    color: white;
}

.footer-text {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  left: 0;
  font-size: 0.75rem;
  color: #aaa;
}

/* --- SVG Icons --- */
.icon-svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

/* Responsive */
@media (max-width: 900px) {
  .image-section { display: none; }
  .login-section { padding: 40px; width: 100%; }
}
.login-section img {
    position: center;
    width: 70px;        /* max width control */
    height: auto;       /* ✅ aspect ratio safe */
    border-radius: 0;   /* no circular border */
    object-fit: contain;
}


</style>
</head>
<body>

<div class="main-wrapper">
  <div class="image-section" id="slider">
    <div class="logo-overlay">
        ACROPOLIS
    </div>
    <img src="model1.png" class="active" alt="Campus 1">
    <img src="model2.png" alt="Campus 2">
    <img src="model3.png" alt="Campus 3">
  </div>

  <div class="login-section">
    <div class="login-header">
      
    <img src="logop.png" alt="Acropolis Logo">
          <h1>ACROPOLIS ENLIGHTMENT WISDOME</h1>
      <p>Please enter your details to sign in.</p>
    </div>

    <form id="loginForm">
      <div class="role-container">
        <div class="role-item">
          <input type="radio" id="role-student" name="role" value="student" checked>
          <label for="role-student">Student</label>
        </div>
        <div class="role-item">
          <input type="radio" id="role-mentor" name="role" value="mentor">
          <label for="role-mentor">Mentor</label>
        </div>
        <div class="role-item">
            <input type="radio" id="role-bus" name="role" value="bus">
            <label for="role-bus">Bus</label>
        </div>
      </div>

      <div class="form-group">
        <svg class="icon-svg input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <input type="text" id="username" placeholder="Enrollment Number" required>
      </div>
      
      <div class="form-group">
        <svg class="icon-svg input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <div class="form-footer">
        <label class="remember-me">
          <input type="checkbox"> &nbsp; Remember me
        </label>
        <a href="forget-password.html" class="forgot-pw">Forgot Password?</a>
      </div>
   <a href="signupp.html" class="forgot-pw">New user? signup</a>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
    </form>

    <div class="social-section">
        <div class="social-icons">
            <div class="social-btn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg>
            </div>
            <div class="social-btn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m13 2h-2.5A3.5 3.5 0 0 0 12 8.5V11h-2v3h2v7h3v-7h3v-3h-3V9a1 1 0 0 1 1-1h2V5z"/></svg>
            </div>
        </div>
    </div>

    <div class="footer-text">
      2025-26 © Prince Rathore IT3
    </div>
  </div>
</div>

<script>
/* =====================================================
   IMAGE SLIDER LOGIC
===================================================== */
const images = document.querySelectorAll('#slider img');
let currentIndex = 0;

function nextImage() {
  images[currentIndex].classList.remove('active');
  currentIndex = (currentIndex + 1) % images.length;
  images[currentIndex].classList.add('active');
}
setInterval(nextImage, 6000); // Increased time slightly for smoother feel


/* =====================================================
   DYNAMIC PLACEHOLDER BASED ON ROLE
===================================================== */
const roleRadios = document.querySelectorAll('input[name="role"]');
const usernameInput = document.getElementById("username");

roleRadios.forEach(radio => {
  radio.addEventListener("change", () => {
    // Add a slight fade effect to input when switching
    usernameInput.style.opacity = '0.5';
    
    setTimeout(() => {
        if (radio.value === "student") {
        usernameInput.placeholder = "Enrollment Number";
        } 
        else if (radio.value === "mentor") {
        usernameInput.placeholder = "Mentor ID";
        } 
        else if (radio.value === "bus") {
        usernameInput.placeholder = "Bus Pilot ID (e.g. BUS-101)";
        }
        usernameInput.style.opacity = '1';
    }, 200);
  });
});


/* =====================================================
   LOGIN HANDLER (Logic Untouched)
===================================================== */
const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const originalBtnText = btn.innerText;
  btn.disabled = true;
  btn.innerText = "Authenticating..."; // Better text
  btn.style.opacity = "0.7";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const role = document.querySelector('input[name="role"]:checked').value;

  let url = "";
  let bodyData = {};

  /* ---------- API SELECTION ---------- */
  if (role === "mentor") {
    url = "https://college-hwbb.onrender.com/api/login/mentor";
    bodyData = { mentorId: username, password };

  } 
  else if (role === "bus") {
    url = "https://college-hwbb.onrender.com/api/bus/login";
    bodyData = { busId: username, password };

  } 
  else {
    url = "https://college-hwbb.onrender.com/api/students/login";
    bodyData = { enrollment: username, password };
  }

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bodyData)
    });

    const data = await res.json();
if (role === "student" && data.suspended) {
  window.location.href = "suspended.html";
  return;
}
    /* ---------- SUCCESS HANDLING ---------- */
    if (res.ok) {
/* ---------- STUDENT SUSPENSION CHECK ---------- */

      /* STUDENT */
      if (role === "student" && data.success) {
        localStorage.setItem("enrollment", data.enrollment);
        localStorage.setItem("role", "student");
        window.location.href = "ewhfihewlbewcbewstudent-dashboard45689";
        return;
      }

      /* MENTOR */
      if (role === "mentor" && data.success) {
        localStorage.setItem("mentorId", data.mentor.mentorId);
        localStorage.setItem("mentorName", data.mentor.name || "Mentor");
        localStorage.setItem("role", "mentor");
        window.location.href = "uihfewibfasdvkfdbvkbkvbwifowjnfhbfebfuhiufbwfbuid";
        return;
      }

      /* 🚌 BUS DRIVER */
      if (role === "bus") {
        localStorage.setItem("busId", username);
        localStorage.setItem("role", "bus");
        window.location.href = `bus-driver.html?busId=${username}`;
        return;
      }

    } else {
      alert(data.message || data.error || "Invalid credentials");
    }

  } catch (err) {
    console.error(err);
    alert("Server connection error. Please try again.");
  } finally {
    btn.disabled = false;
    btn.innerText = originalBtnText;
    btn.style.opacity = "1";
  }
});
</script>

</body>
</html>
