<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post Menu Item</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    width:400px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

.message{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Add Menu Item</h2>

    <form id="menuForm">
        <input type="text" id="canteen_id" placeholder="Canteen ID" required>
        <input type="text" id="name" placeholder="Item Name" required>

        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Snacks">Snacks</option>
            <option value="Drinks">Drinks</option>
            <option value="Meal">Meal</option>
            <option value="Other">Other</option>
        </select>

        <input type="number" id="price" placeholder="Price" required>
        <input type="file" id="photo">

        <button type="submit">Add Item</button>
    </form>

    <div class="message" id="responseMsg"></div>
</div>

<script>
document.getElementById("menuForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const formData = new FormData();
    formData.append("canteen_id", document.getElementById("canteen_id").value);
    formData.append("name", document.getElementById("name").value);
    formData.append("category", document.getElementById("category").value);
    formData.append("price", document.getElementById("price").value);

    const photoInput = document.getElementById("photo");
    if(photoInput.files.length > 0){
        formData.append("photo", photoInput.files[0]);
    }

    try{
        const response = await fetch("https://college-hwbb.onrender.com/api/canteen/owner/add-menu",{
            method:"POST",
            body: formData
        });

        const data = await response.json();

        if(response.ok){
            document.getElementById("responseMsg").style.color="green";
            document.getElementById("responseMsg").innerText = data.message;
            document.getElementById("menuForm").reset();
        }else{
            document.getElementById("responseMsg").style.color="red";
            document.getElementById("responseMsg").innerText = data.error;
        }

    }catch(error){
        document.getElementById("responseMsg").style.color="red";
        document.getElementById("responseMsg").innerText = "Server Error!";
    }
});
</script>

</body>
</html>
