<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin • Manage Personal Messages</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#0b5ed7;
  --danger:#dc3545;
  --light:#f4f6f9;
  --dark:#212529;
}

body{
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background:var(--light);
}

header{
  background:#fff;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

header img{
  height:42px;
}

header h1{
  font-size:20px;
  margin:0;
  color:var(--dark);
}

.container{
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.search-bar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-bar select,
.search-bar input{
  padding:8px;
  font-size:14px;
}

.search-bar input{
  flex:1;
}

.bulk-box{
  display:none;
  background:#eef3ff;
  padding:10px;
  border-radius:6px;
  margin-bottom:15px;
}

.bulk-box span{
  font-size:14px;
}

.bulk-box button{
  margin-left:10px;
  padding:5px 10px;
  border:none;
  background:var(--danger);
  color:#fff;
  cursor:pointer;
  border-radius:4px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  font-size:14px;
}

th{
  background:var(--blue);
  color:#fff;
}

button{
  cursor:pointer;
}

.viewBtn{
  background:#198754;
  color:#fff;
  border:none;
  padding:4px 8px;
  border-radius:4px;
}

.deleteBtn{
  background:var(--danger);
  color:#fff;
  border:none;
  padding:4px 8px;
  border-radius:4px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#fff;
  width:500px;
  max-width:95%;
  padding:20px;
  border-radius:10px;
}

.modal-content h3{
  margin-top:0;
}

.close{
  float:right;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <img src="https://acropoliss.netlify.app/logo.png" alt="Acropolis Logo">
  <h1>Admin • Personal Messages</h1>
</header>

<div class="container">

  <!-- SEARCH -->
  <div class="search-bar">
    <select id="searchType">
      <option value="enrollment">Enrollment Number</option>
      <option value="title">Title</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search...">
  </div>

  <!-- BULK BOX -->
  <div class="bulk-box" id="bulkBox">
    <span id="bulkCount">0 selected</span>
    <button onclick="bulkDelete()">Delete Selected</button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll"></th>
        <th>Title</th>
        <th>Description</th>
        <th>Enrollments</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="messageTable"></tbody>
  </table>

</div>

<!-- MODAL -->
<div class="modal" id="viewModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h3 id="mTitle"></h3>
    <p id="mDesc"></p>
    <p><b>Enrollments:</b> <span id="mEnroll"></span></p>
    <p><b>Date:</b> <span id="mDate"></span></p>
  </div>
</div>

<script>
const API = "https://college-hwbb.onrender.com/api";
let messages = [];
let selected = new Set();

const table = document.getElementById("messageTable");
const bulkBox = document.getElementById("bulkBox");
const bulkCount = document.getElementById("bulkCount");

async function loadMessages(){
  const res = await fetch(API + "/admin/personal-messages/all");
  const data = await res.json();
  messages = data.messages;
  render(messages);
}

function render(list){
  table.innerHTML="";
  selected.clear();
  updateBulk();

  list.forEach(m=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><input type="checkbox" onchange="toggleSelect('${m.id}',this)"></td>
      <td>${m.title}</td>
      <td>${m.description.slice(0,40)}... 
        <button class="viewBtn" onclick='viewMsg(${JSON.stringify(m)})'>View</button>
      </td>
      <td>${m.enrollments.join(", ")}</td>
      <td>${new Date(m.created_at).toLocaleString()}</td>
      <td><button class="deleteBtn" onclick="deleteMsg('${m.id}')">Delete</button></td>
    `;
    table.appendChild(tr);
  });
}

function toggleSelect(id,cb){
  cb.checked ? selected.add(id) : selected.delete(id);
  updateBulk();
}

function updateBulk(){
  bulkBox.style.display = selected.size ? "block":"none";
  bulkCount.innerText = selected.size + " selected";
}

async function bulkDelete(){
  if(!confirm("Delete selected messages?")) return;
  for(let id of selected){
    await fetch(API + "/admin/personal-message/" + id,{method:"DELETE"});
  }
  loadMessages();
}

async function deleteMsg(id){
  if(!confirm("Delete this message?")) return;
  await fetch(API + "/admin/personal-message/" + id,{method:"DELETE"});
  loadMessages();
}

function viewMsg(m){
  document.getElementById("mTitle").innerText = m.title;
  document.getElementById("mDesc").innerText = m.description;
  document.getElementById("mEnroll").innerText = m.enrollments.join(", ");
  document.getElementById("mDate").innerText = new Date(m.created_at).toLocaleString();
  document.getElementById("viewModal").style.display="flex";
}

function closeModal(){
  document.getElementById("viewModal").style.display="none";
}

document.getElementById("searchInput").addEventListener("input",()=>{
  const val = event.target.value.toLowerCase();
  const type = document.getElementById("searchType").value;
  render(messages.filter(m =>
    type==="title"
      ? m.title.toLowerCase().includes(val)
      : m.enrollments.join(" ").toLowerCase().includes(val)
  ));
});

loadMessages();
</script>

</body>
</html>
