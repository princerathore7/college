<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin: Manage Personal Messages</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
  .container { max-width: 900px; margin: 50px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h2 { text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: left; }
  th { background: #007bff; color: #fff; }
  tr.unread { font-weight: bold; }
  button.deleteBtn { background: #dc3545; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  button.deleteBtn:hover { opacity: 0.8; }
  .msg { display: none; padding: 10px; margin-top: 10px; border-radius: 5px; }
  .msg.success { background: #d4edda; color: #155724; }
  .msg.error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="container">
  <h2>📋 Manage Personal Messages</h2>
  <div id="responseMsg" class="msg"></div>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Enrollments</th>
        <th>Attachments</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="messageTable">
      <!-- Messages will load here -->
    </tbody>
  </table>
</div>

<script>
const tableBody = document.getElementById("messageTable");
const msgBox = document.getElementById("responseMsg");

async function loadMessages() {
  tableBody.innerHTML = "";
  msgBox.style.display = "none";

  try {
    const res = await fetch("/api/admin/personal-messages/all");
    const data = await res.json();

    if (!data.success) throw new Error(data.message || "Failed to load messages");

    if (data.messages.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center">No messages found</td></tr>`;
      return;
    }

    data.messages.forEach(msg => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${msg.title}</td>
        <td>${msg.description}</td>
        <td>${msg.enrollments.join(", ")}</td>
        <td>${msg.attachments.map(a => a.filename).join(", ")}</td>
        <td>${new Date(msg.created_at).toLocaleString()}</td>
        <td><button class="deleteBtn" onclick="deleteMessage('${msg.id}')">Delete</button></td>
      `;
      tableBody.appendChild(tr);
    });

  } catch(err) {
    msgBox.className = "msg error";
    msgBox.innerText = err.message;
    msgBox.style.display = "block";
  }
}

async function deleteMessage(id){
  if(!confirm("Are you sure you want to delete this message?")) return;

  msgBox.style.display = "none";
  try {
    const res = await fetch(`/api/admin/personal-message/${id}`, { method: "DELETE" });
    const data = await res.json();

    if(!data.success) throw new Error(data.message || "Failed to delete");

    msgBox.className = "msg success";
    msgBox.innerText = data.message || "Message deleted successfully";
    msgBox.style.display = "block";

    loadMessages(); // refresh table
  } catch(err) {
    msgBox.className = "msg error";
    msgBox.innerText = err.message;
    msgBox.style.display = "block";
  }
}

// Initial load
loadMessages();
</script>

</body>
</html>
