<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Forms</title>
<link rel="icon" href="https://cdn.corenexis.com/view/6199335168">
<style>
  body { font-family: Arial; background: #f4f4f4; margin: 0; padding: 0; }
  .container { max-width: 900px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; }
  input { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ccc; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
  button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
  .btn-delete { background: red; color: #fff; }
   .back-btn {
  background: #003366;          /* Navy Blue */
  color: #fff;
  border: none;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s ease;
}

.back-btn:hover {
  background: #002244;
}

.back-btn:active {
  transform: scale(0.96);
}
</style>
</head>
<body>

<div class="container">
  <button class="back-btn" onclick="goBack()">
  ← Back
</button>
  <h1>Manage Forms</h1>
  <input type="text" id="searchInput" placeholder="Search forms by title...">
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="formsTableBody">
      <!-- Forms will be loaded here -->
    </tbody>
  </table>
</div>

<script>
const apiBase = "https://college-hwbb.onrender.com/api";
          const mentorIdVal = localStorage.getItem("mentorId");
const source = sessionStorage.getItem("accessSource");
const ALLOWED_SOURCES = ["ad", "admin"];

if(!mentorIdVal || !ALLOWED_SOURCES.includes(source)){
  document.body.innerHTML = `
    <div class="denied-container">
      <h1 style="color:#d32f2f; font-size: 3rem;">❌</h1>
      <h2 style="color:#d32f2f">Access Denied</h2>
      <p>Security protocol triggered. This incident will be reported.<br>Please login via the Official Administration Panel.</p>
      <button onclick="location.href='/login.html'" style="width:200px">Back to Login</button>
    </div>
  `;
  throw new Error("Unauthorized access");
}
async function fetchForms(search="") {
  try {
    const res = await fetch(`${apiBase}/forms?search=${encodeURIComponent(search)}`);
    const forms = await res.json();
    const tbody = document.getElementById("formsTableBody");
    tbody.innerHTML = "";

    if(forms.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center">No forms found</td></tr>`;
      return;
    }

    forms.forEach(f => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${f.title}</td>
    <td>${f.description || "-"}</td>
    <td>${f.fields_count}</td>
    <td>
      <button class="btn-delete" onclick="deleteForm('${f.id}')">
        Delete
      </button>
    </td>
  `;
  tbody.appendChild(tr);
});

  } catch (err) {
    console.error(err);
    alert("❌ Failed to load forms");
  }
}

async function deleteForm(formId) {
  if(!confirm("Are you sure you want to delete this form?")) return;

  try {
    const res = await fetch(`${apiBase}/forms/${formId}`, { method: "DELETE" });
    const data = await res.json();
    if(res.ok) {
      alert("✅ Form deleted successfully");
      fetchForms(document.getElementById("searchInput").value);
    } else {
      alert(data.message || "Failed to delete form");
    }
  } catch (err) {
    console.error(err);
    alert("❌ Server error");
  }
}
function goback(){
window.history.back();
}
// search functionality
document.getElementById("searchInput").addEventListener("input", e => {
  fetchForms(e.target.value);
});

// initial load
fetchForms();
</script>

</body>
</html>
