<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Students</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

.header{
background:#0f172a;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:700;
}

.container{
padding:20px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:20px;
font-size:14px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

th{
background:#1e293b;
color:white;
padding:12px;
text-align:left;
font-size:14px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
font-size:13px;
}

tr:hover{
background:#f8fafc;
}

.badge{
padding:5px 10px;
background:#22c55e;
color:white;
border-radius:20px;
font-size:12px;
}

img{
width:45px;
height:45px;
border-radius:8px;
object-fit:cover;
}

.loading{
text-align:center;
padding:20px;
font-weight:600;
}
</style>

</head>

<body>

<div class="header">
Verified Students List
</div>

<div class="container">

<input type="text" id="search" placeholder="Search by name, enrollment, email..." onkeyup="filterData()">

<div class="loading" id="loading">Loading data...</div>

<table id="table" style="display:none;">
<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Enrollment</th>
<th>Email</th>
<th>Phone</th>
<th>Branch</th>
<th>Status</th>
<th>Verified At</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

</div>

<script>

let allData = [];

async function loadData(){

try{

const res = await fetch("https://college-hwbb.onrender.com/api/cleanup/verified-students");
const data = await res.json();

document.getElementById("loading").style.display = "none";

if(data.success){

allData = data.students;

document.getElementById("table").style.display = "table";

render(allData);

}else{

document.getElementById("loading").innerText = "No data found";

}

}catch(err){

console.log(err);
document.getElementById("loading").innerText = "Server error";

}

}

function render(data){

const tbody = document.getElementById("tbody");
tbody.innerHTML = "";

data.forEach(s => {

tbody.innerHTML += `
<tr>
<td><img src="${s.photo || 'https://via.placeholder.com/50'}"></td>
<td>${s.studentName || s.name}</td>
<td>${s.enrollment}</td>
<td>${s.email || "-"}</td>
<td>${s.phone || "-"}</td>
<td>${s.branch || "-"}</td>
<td><span class="badge">${s.status || "VERIFIED"}</span></td>
<td>${s.verifiedAt ? new Date(s.verifiedAt).toLocaleString() : "-"}</td>
</tr>
`;

});

}

function filterData(){

const q = document.getElementById("search").value.toLowerCase();

const filtered = allData.filter(s =>
(s.studentName || s.name || "").toLowerCase().includes(q) ||
(s.enrollment || "").toLowerCase().includes(q) ||
(s.email || "").toLowerCase().includes(q) ||
(s.phone || "").toLowerCase().includes(q)
);

render(filtered);

}

loadData();

</script>

</body>
</html>
