<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin0: Send Personal Message</title>
<style>
.container { max-width: 600px; margin: 50px auto; font-family: sans-serif; }
.file-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
.msg { display: none; padding: 10px; margin-top: 10px; border-radius: 5px; }
.msg.success { background: #d4edda; color: #155724; }
.msg.error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<div class="container">
  <h2>📩 Send Personal Message</h2>

  <form id="messageForm">
    <label>Message Title</label>
    <input type="text" name="title" required>

    <label>Description</label>
    <textarea name="description" required></textarea>

    <label>Enrollment Numbers <small>(comma separated)</small></label>
    <input type="text" name="enrollments" placeholder="ENR001, ENR002" required>

    <label>Attachments</label>
    <div id="fileContainer">
      <div class="file-row">
        <input type="file" name="attachments">
        <button type="button" onclick="removeFile(this)">X</button>
      </div>
    </div>

    <button type="button" onclick="addFile()">➕ Add More File</button>
    <button type="submit">🚀 Send Message</button>

    <div id="responseMsg" class="msg"></div>
  </form>
</div>

<script>
const form = document.getElementById("messageForm");
const msgBox = document.getElementById("responseMsg");

function addFile() {
  const div = document.createElement("div");
  div.className = "file-row";
  div.innerHTML = `<input type="file" name="attachments"><button type="button" onclick="removeFile(this)">X</button>`;
  document.getElementById("fileContainer").appendChild(div);
}

function removeFile(btn) {
  btn.parentElement.remove();
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  msgBox.style.display = "none";

  const formData = new FormData(form);

  try {
    const res = await fetch("/api/admin0/personal-message/send", { method: "POST", body: formData });
    const text = await res.text();
    console.log(text);

    let data;
    try { data = JSON.parse(text); } 
    catch { throw new Error("Server returned HTML instead of JSON"); }

    if(res.ok) {
      msgBox.className = "msg success";
      msgBox.innerText = data.message || "Message sent successfully";
      msgBox.style.display = "block";
      form.reset();
      document.getElementById("fileContainer").innerHTML = `
        <div class="file-row"><input type="file" name="attachments"><button type="button" onclick="removeFile(this)">X</button></div>`;
    } else {
      throw new Error(data.message || "Something went wrong");
    }
  } catch(err) {
    msgBox.className = "msg error";
    msgBox.innerText = err.message;
    msgBox.style.display = "block";
  }
});
</script>

</body>
</html>
