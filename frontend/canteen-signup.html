<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canteen Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.signup-container{
    background:white;
    padding:40px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.signup-container h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    font-size:14px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#667eea;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5a67d8;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}
</style>
</head>
<body>

<div class="signup-container">
    <h2>Canteen Signup</h2>

    <div class="input-group">
        <label>Canteen Name</label>
        <input type="text" id="name" placeholder="Enter canteen name">
    </div>

    <div class="input-group">
        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter mobile number">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>

    <button onclick="signup()">Register Canteen</button>

    <div class="message" id="message"></div>
</div>

<script>
async function signup(){

    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const password = document.getElementById("password").value;

    if(!name || !mobile || !password){
        document.getElementById("message").innerText = "All fields required!";
        return;
    }

    try{
        const response = await fetch("https://college-hwbb.onrender.com/canteen/signup", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                name:name,
                mobile:mobile,
                password:password
            })
        });

        const data = await response.json();

        if(response.ok){
            document.getElementById("message").style.color="green";
            document.getElementById("message").innerText = 
                "Registered Successfully! Canteen ID: " + data.canteen_id;
        }else{
            document.getElementById("message").style.color="red";
            document.getElementById("message").innerText = data.error;
        }

    }catch(error){
        document.getElementById("message").innerText = "Server Error!";
    }
}
</script>

</body>
</html>
